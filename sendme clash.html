<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود با گوگل - گیمینگ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ==========================================
           متغیرهای رنگی (حالت شب / روز)
           ========================================== */
        :root {
            --bg-base: #0d0f14;
            --bg-radial: #1a1f2b;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --card-bg: #1a1f2b;
            --card-border: #2a3040;
            --pill-bg: rgba(26, 31, 43, 0.95);
            --accent-pink: #ff0055;
            --accent-green: #00ff88;
            --green-shadow: rgba(0, 255, 136, 0.4);
            --shadow-color: rgba(0, 0, 0, 0.35);
            --google-color: #ea4335;
            --google-neon: rgba(234, 67, 53, 0.6);
        }

        .light-mode {
            --bg-base: #f5f7fa;
            --bg-radial: #eef1f5;
            --text-main: #2d3748;
            --text-sub: #4a5568;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --pill-bg: rgba(255, 255, 255, 0.95);
            --shadow-color: rgba(0, 0, 0, 0.08);
            --accent-green: #38a89d;
            --green-shadow: rgba(56, 168, 157, 0.25);
            --google-neon: rgba(234, 67, 53, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 10% 10%, var(--bg-radial) 0%, var(--bg-base) 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 90px;
            position: relative;
            transition: background-color 0.5s ease, color 0.5s ease, background-image 0.5s ease;
        }

        /* ==========================================
           هدر (فشرده)
           ========================================== */
        header {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border-bottom: 2px solid var(--accent-green);
            box-shadow: 0 4px 20px var(--green-shadow);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-container {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            padding: 3px;
            background: var(--card-bg);
            border: 2px solid var(--accent-pink);
            box-shadow: 0 0 15px var(--accent-pink), inset 0 0 15px var(--accent-pink);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .light-mode .logo-container {
            border-color: #e53e6b;
            box-shadow: 0 0 15px rgba(229, 62, 107, 0.15), inset 0 0 15px rgba(229, 62, 107, 0.05);
        }

        .logo-container:hover {
            transform: scale(1.08);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .header-title {
            color: var(--accent-green);
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--green-shadow);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.5s ease;
        }

        .light-mode .header-title {
            text-shadow: 0 0 10px rgba(56, 168, 157, 0.15);
        }

        .header-title i {
            font-size: 1rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent-green);
            box-shadow: 0 0 12px var(--green-shadow);
        }

        .membership-btn {
            width: auto;
            padding: 0 14px;
            border-radius: 21px;
            font-weight: 700;
            font-size: 0.75rem;
            background: linear-gradient(135deg, var(--accent-pink), #ff5588);
            border: none;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.35);
            transition: all 0.3s ease;
        }

        .light-mode .membership-btn {
            background: linear-gradient(135deg, #e53e6b, #ed6a8e);
            box-shadow: 0 0 15px rgba(229, 62, 107, 0.2);
        }

        .membership-btn:hover {
            box-shadow: 0 0 22px rgba(255, 0, 85, 0.55);
        }

        .lang-btn {
            width: auto;
            padding: 0 12px;
            border-radius: 21px;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }

        /* ==========================================
           بخش اصلی
           ========================================== */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .train-container {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 480px;
        }

        /* ریل عمودی نوری */
        .train-container::before {
            content: '';
            position: absolute;
            top: 25px;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            background: var(--accent-green);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent-green), 0 0 20px var(--accent-green), 0 0 35px var(--accent-green);
            z-index: 0;
            transition: all 0.5s ease;
        }

        .light-mode .train-container::before {
            background: #cbd5e0;
            box-shadow: none;
            width: 2px;
        }

        /* کارت گوگل */
        .island-card {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px 20px;
            box-shadow: 0 8px 25px var(--shadow-color);
            transition: all 0.3s ease;
            animation: floatIsland 4s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes floatIsland {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .island-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: var(--accent-green);
            box-shadow: 0 12px 35px var(--green-shadow);
        }

        .light-mode .island-card:hover {
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            border-color: var(--accent-green);
        }

        .island-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* ==========================================
           باکس آیکون با نوار نئونی
           ========================================== */
        .icon-box {
            width: 50px;
            height: 50px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            flex-shrink: 0;
            position: relative;
        }

        .light-mode .icon-box {
            background: #f7fafc;
        }

        .island-card:hover .icon-box {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px var(--green-shadow);
        }

        /* ==========================================
           نوار نئونی دور آیکون گوگل
           ========================================== */
        .icon-box::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 16px;
            z-index: -1;
            opacity: 0;
            transition: all 0.4s ease;
        }

        .island-card:hover .icon-box::before {
            opacity: 1;
        }

        /* گوگل - نوار نئونی قرمز */
        .island-card.google .icon-box::before {
            background: var(--google-neon);
            filter: blur(8px);
            box-shadow: 0 0 30px var(--google-neon);
        }
        .island-card.google:hover .icon-box {
            border-color: var(--google-color);
            box-shadow: 0 0 25px var(--google-neon);
        }
        .island-card.google .icon-box { color: var(--google-color); }
        .island-card.google:hover .icon-box { background: var(--google-color); color: #ffffff; border-color: var(--google-color); }
        .island-card.google:hover h3 { color: var(--google-color); }

        /* ==========================================
           اطلاعات کارت
           ========================================== */
        .island-info h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 2px;
            color: var(--text-main);
            transition: color 0.3s ease;
        }

        .island-info p {
            font-size: 0.78rem;
            color: var(--text-sub);
            transition: color 0.3s ease;
        }

        .arrow-icon {
            font-size: 0.9rem;
            color: var(--text-sub);
            transition: all 0.3s ease;
        }

        .island-card:hover .arrow-icon {
            transform: translateX(-6px);
            color: var(--accent-green);
        }

        /* ==========================================
           دکمه بازگشت
           ========================================== */
        .back-btn {
            margin-top: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 24px;
            border-radius: 25px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow-color);
            cursor: pointer;
        }

        .back-btn:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
            box-shadow: 0 0 25px var(--green-shadow);
            transform: translateY(-3px);
        }

        .back-btn i {
            transition: transform 0.3s ease;
        }

        .back-btn:hover i {
            transform: translateX(4px);
        }

        /* ==========================================
           نوار پایین
           ========================================== */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .ps-shapes {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            background: var(--pill-bg);
            padding: 14px 35px;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px var(--shadow-color);
            width: auto;
            transition: all 0.5s ease;
        }

        .light-mode .ps-shapes {
            background: rgba(255, 255, 255, 0.9);
            border-color: #e2e8f0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .ps-shapes i {
            font-size: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .ps-shapes .ps-cross { color: #5352ed; text-shadow: 0 0 15px rgba(83, 82, 237, 0.7); }
        .ps-shapes .ps-circle { color: #ff4757; text-shadow: 0 0 15px rgba(255, 71, 87, 0.7); }
        .ps-shapes .ps-triangle { color: #00f0ff; text-shadow: 0 0 15px rgba(0, 240, 255, 0.7); }
        .ps-shapes .ps-square { color: #ff77a9; text-shadow: 0 0 15px rgba(255, 119, 169, 0.7); }

        .light-mode .ps-shapes .ps-cross { color: #6c63c4; text-shadow: 0 0 15px rgba(108, 99, 196, 0.2); }
        .light-mode .ps-shapes .ps-circle { color: #e53e6b; text-shadow: 0 0 15px rgba(229, 62, 107, 0.2); }
        .light-mode .ps-shapes .ps-triangle { color: #38b2ac; text-shadow: 0 0 15px rgba(56, 178, 172, 0.2); }
        .light-mode .ps-shapes .ps-square { color: #b779c4; text-shadow: 0 0 15px rgba(183, 121, 196, 0.2); }

        .ps-shapes i:hover {
            transform: scale(1.3) rotate(10deg);
            filter: brightness(1.5);
        }

        .light-mode .ps-shapes i:hover {
            filter: brightness(1.2);
        }

        /* ==========================================
           واکنش‌گرایی
           ========================================== */
        @media (max-width: 500px) {
            header { padding: 10px 15px; }
            .logo-container { width: 42px; height: 42px; }
            .icon-btn { width: 34px; height: 34px; font-size: 0.8rem; }
            .lang-btn { padding: 0 10px; font-size: 0.7rem; }
            .membership-btn { padding: 0 10px; font-size: 0.7rem; }
            .header-actions { gap: 5px; }
            .header-title { font-size: 0.75rem; }
            .header-title i { font-size: 0.8rem; }

            .train-container { max-width: 100%; }
            .island-card { padding: 12px 14px; border-radius: 14px; }
            .icon-box { width: 42px; height: 42px; font-size: 1.3rem; }
            .island-info h3 { font-size: 0.9rem; }
            .island-info p { font-size: 0.7rem; }

            .bottom-nav { bottom: 12px; }
            .ps-shapes { padding: 12px 25px; gap: 20px; }
            .ps-shapes i { font-size: 1.2rem; }

            .back-btn { padding: 8px 18px; font-size: 0.75rem; }
        }

        @media (max-width: 380px) {
            .header-title { font-size: 0.65rem; }
            .header-title i { font-size: 0.7rem; }
            .logo-container { width: 36px; height: 36px; }
            .icon-box { width: 36px; height: 36px; font-size: 1.1rem; }
            .island-card { padding: 10px 10px; }
            .island-info h3 { font-size: 0.8rem; }
            .island-info p { font-size: 0.6rem; }
            .ps-shapes { gap: 14px; padding: 10px 16px; }
            .ps-shapes i { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <!-- ==========================================
    هدر (فشرده)
    ========================================== -->
    <header>
        <div class="header-left">
            <div class="logo-container">
                <img src="op.jpg.png" alt="Logo">
            </div>
            <div class="header-title">
                <i class="fa-solid fa-gamepad"></i>
                <span data-i18n="headerTitle">ورود به حساب پاپجی</span>
            </div>
        </div>

        <div class="header-actions">
            <button class="icon-btn" id="themeToggle" type="button">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="icon-btn lang-btn" id="langToggle" type="button">
                <span id="langLabel">FA</span>
            </button>
            <button class="icon-btn membership-btn" id="membershipBtn" type="button">
                <span id="membershipLabel">عضویت</span>
            </button>
        </div>
    </header>

    <!-- ==========================================
    محتوای اصلی - فقط گوگل
    ========================================== -->
    <main>
        <div class="train-container">

            <!-- فقط کارت گوگل -->
            <div class="island-card google" data-page="google.html">
                <div class="island-content">
                    <div class="icon-box">
                        <i class="fa-brands fa-google"></i>
                    </div>
                    <div class="island-info">
                        <h3 data-i18n="googleTitle">Google</h3>
                        <p data-i18n="googleDesc">ورود از طریق گوگل</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </div>

        </div>

        <div class="back-btn" id="backBtn">
            <i class="fa-solid fa-arrow-right"></i>
            <span data-i18n="backBtn">بازگشت</span>
        </div>
    </main>

    <!-- ==========================================
    نوار پایین
    ========================================== -->
    <div class="bottom-nav">
        <div class="ps-shapes">
            <i class="fa-solid fa-xmark ps-cross"></i>
            <i class="fa-regular fa-circle ps-circle"></i>
            <i class="fa-solid fa-triangle-exclamation ps-triangle"></i>
            <i class="fa-regular fa-square ps-square"></i>
        </div>
    </div>

    <script>
        // ==========================================
        // ترجمه‌ها
        // ==========================================
        var translations = {
            fa: {
                'langLabel': 'FA',
                'membershipLabel': 'عضویت',
                'headerTitle': 'ورود به حساب پاپجی',
                'googleTitle': 'Google',
                'googleDesc': 'ورود از طریق گوگل',
                'backBtn': 'بازگشت'
            },
            en: {
                'langLabel': 'EN',
                'membershipLabel': 'Sign up',
                'headerTitle': 'PUBG Account Login',
                'googleTitle': 'Google',
                'googleDesc': 'Login via Google',
                'backBtn': 'Back'
            }
        };

        var currentLang = localStorage.getItem('lang') || 'fa';

        // ==========================================
        // توابع ترجمه
        // ==========================================
        function changeLanguage(lang) {
            currentLang = lang;
            var t = translations[lang];
            
            document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            localStorage.setItem('lang', lang);
            
            var elements = document.querySelectorAll('[data-i18n]');
            for (var i = 0; i < elements.length; i++) {
                var el = elements[i];
                var key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) {
                    var icon = el.querySelector('i');
                    if (icon) {
                        var textNode = el.childNodes[el.childNodes.length - 1];
                        if (textNode && textNode.nodeType === 3) {
                            textNode.textContent = ' ' + t[key];
                        } else {
                            el.innerHTML = icon.outerHTML + ' ' + t[key];
                        }
                    } else {
                        el.textContent = t[key];
                    }
                }
            }
            
            document.getElementById('langLabel').textContent = t['langLabel'];
            document.getElementById('membershipLabel').textContent = t['membershipLabel'];
        }

        changeLanguage(currentLang);

        // ==========================================
        // دکمه تغییر زبان
        // ==========================================
        document.getElementById('langToggle').addEventListener('click', function() {
            var newLang = currentLang === 'fa' ? 'en' : 'fa';
            changeLanguage(newLang);
        });

        // ==========================================
        // دکمه تغییر تم (شب/روز)
        // ==========================================
        var themeToggle = document.getElementById('themeToggle');
        var themeIcon = themeToggle.querySelector('i');

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('light-mode');
            var isLight = document.body.classList.contains('light-mode');
            themeIcon.className = isLight ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        // ==========================================
        // دکمه عضویت
        // ==========================================
        document.getElementById('membershipBtn').addEventListener('click', function() {
            window.location.href = 'signup.html';
        });

        // ==========================================
        // تغییر مسیر کارت گوگل
        // ==========================================
        var cards = document.querySelectorAll('.island-card');
        for (var i = 0; i < cards.length; i++) {
            cards[i].addEventListener('click', function() {
                var page = this.getAttribute('data-page');
                if (page) {
                    window.location.href = page;
                }
            });
        }

        // ==========================================
        // دکمه بازگشت
        // ==========================================
        document.getElementById('backBtn').addEventListener('click', function() {
            window.location.href = 'index.html';
        });
    </script>

</body>
</html>
