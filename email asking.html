<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Connect - ورود / ثبت‌نام</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0/dist/umd/sdk.min.js"></script>
    
    <style>
        /* ==========================================
           متغیرهای رنگی (حالت شب / روز)
           ========================================== */
        :root {
            --bg-base: #0d0f14;
            --bg-radial: #1a1f2b;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --card-border: #2a3040;
            --pill-bg: rgba(26, 31, 43, 0.95);
            --accent-pink: #ff0055;
            --accent-green: #00ff88;
            --modal-glass-bg: rgba(26, 31, 43, 0.65);
            --modal-glass-border: rgba(255, 255, 255, 0.12);
            --input-bg: rgba(0, 0, 0, 0.3);
            --error-color: #ff4757;
            --success-color: #00ff88;
        }

        body.light-mode {
            --bg-base: #f4f1ea;
            --bg-radial: #ffffff;
            --text-main: #14161c;
            --text-sub: #5a6172;
            --card-border: #e2ded3;
            --pill-bg: rgba(255, 255, 255, 0.95);
            --accent-pink: #e2005f;
            --accent-green: #00b368;
            --modal-glass-bg: rgba(255, 255, 255, 0.65);
            --modal-glass-border: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(255, 255, 255, 0.8);
            --error-color: #dc3545;
            --success-color: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 10% 10%, var(--bg-radial) 0%, var(--bg-base) 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(26, 31, 43, 0.5);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        body.light-mode .icon-btn { background: #ffffff; }

        .icon-btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.35);
        }

        .lang-btn {
            width: auto;
            padding: 0 14px;
            border-radius: 21px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .logo-container {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            padding: 3px;
            background: rgba(26, 31, 43, 0.5);
            border: 2px solid var(--accent-pink);
            box-shadow: 0 0 20px var(--accent-pink), inset 0 0 20px var(--accent-pink);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .logo-container:hover { transform: scale(1.08); }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 20px 100px;
        }

        .glass-card {
            background: var(--modal-glass-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--modal-glass-border);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
        }

        .step-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .step-panel.active { display: flex; }

        .modal-icon {
            font-size: 2.5rem;
            color: var(--accent-pink);
            margin-bottom: 15px;
            text-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .modal-desc {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .glass-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 20px;
            transition: border-color 0.25s, box-shadow 0.25s;
            text-align: center;
        }

        .glass-input:focus {
            border-color: var(--accent-pink);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }

        .otp-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            direction: ltr;
            margin-bottom: 25px;
            width: 100%;
        }

        .otp-input {
            width: 42px;
            height: 50px;
            border-radius: 10px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .otp-input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent-pink), #ff5588);
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 22px rgba(255, 0, 85, 0.55);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .submit-btn.green {
            background: linear-gradient(135deg, var(--accent-green), #00b368);
            color: #0d0f14;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.35);
        }

        .submit-btn.green:hover:not(:disabled) {
            box-shadow: 0 0 22px rgba(0, 255, 136, 0.55);
        }

        .message-box {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            text-align: center;
        }
        
        .message-box.show { display: block; }
        
        .message-box.success {
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }
        
        .message-box.error {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }
        
        .message-box.info {
            background: rgba(0, 150, 255, 0.15);
            border: 1px solid #0096ff;
            color: #0096ff;
        }

        .timer-section {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        
        .timer-text {
            font-size: 0.85rem;
            color: var(--text-sub);
        }
        
        .timer-text span {
            color: var(--accent-green);
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        .resend-btn {
            background: none;
            border: none;
            color: var(--accent-pink);
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.85rem;
            padding: 5px 10px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .resend-btn:hover:not(:disabled) {
            color: var(--accent-green);
            background: rgba(0, 255, 136, 0.1);
        }
        
        .resend-btn:disabled {
            color: var(--text-sub);
            cursor: not-allowed;
            text-decoration: none;
            opacity: 0.5;
        }

        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .ps-shapes {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            background: var(--pill-bg);
            padding: 14px 35px;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            width: auto;
        }

        .ps-shapes i {
            font-size: 1.5rem;
            transition: transform 0.3s ease, filter 0.3s ease;
            cursor: pointer;
        }

        .ps-shapes .ps-cross { color: #5352ed; text-shadow: 0 0 15px rgba(83, 82, 237, 0.7); }
        .ps-shapes .ps-circle { color: #ff4757; text-shadow: 0 0 15px rgba(255, 71, 87, 0.7); }
        .ps-shapes .ps-triangle { color: #00f0ff; text-shadow: 0 0 15px rgba(0, 240, 255, 0.7); }
        .ps-shapes .ps-square { color: #ff77a9; text-shadow: 0 0 15px rgba(255, 119, 169, 0.7); }

        .ps-shapes i:hover {
            transform: scale(1.3) rotate(10deg);
            filter: brightness(1.5);
        }

        @media (max-width: 500px) {
            header { padding: 14px 15px; }
            .logo-container { width: 52px; height: 52px; }
            .icon-btn { width: 38px; height: 38px; font-size: 0.9rem; }
            .lang-btn { padding: 0 10px; font-size: 0.75rem; }
            .header-actions { gap: 6px; }
            .ps-shapes { padding: 12px 25px; gap: 20px; }
            .ps-shapes i { font-size: 1.2rem; }
            .otp-input { width: 35px; height: 45px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="op.jpg" alt="Logo" onerror="this.style.display='none'">
        </div>

        <div class="header-actions">
            <button class="icon-btn" id="themeToggle" type="button" aria-label="تغییر حالت شب و روز">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="icon-btn lang-btn" id="langToggle" type="button" aria-label="تغییر زبان">
                <span id="langLabel">FA</span>
            </button>
        </div>
    </header>

    <main>
        <div class="glass-card">
            <div class="step-panel active" id="stepEmail">
                <i class="fa-regular fa-envelope modal-icon"></i>
                <h3 class="modal-title" id="titleEmail">ورود / ثبت‌نام</h3>
                <p class="modal-desc" id="descEmail">جهت ادامه، ایمیل خود را وارد کنید</p>
                
                <div class="message-box" id="messageEmail"></div>
                
                <input type="email" class="glass-input" id="emailInput" placeholder="example@gmail.com" required>
                <button class="submit-btn" id="sendCodeBtn">ارسال کد تایید</button>
            </div>

            <div class="step-panel" id="stepCode">
                <i class="fa-solid fa-shield-halved modal-icon" style="color: var(--accent-green);"></i>
                <h3 class="modal-title" id="titleCode">تایید کد امنیت</h3>
                <p class="modal-desc" id="descCode">کد ۶ رقمی ارسال شده به ایمیل را وارد کنید</p>

                <div class="message-box" id="messageCode"></div>

                <div class="otp-container">
                    <input type="text" maxlength="1" class="otp-input" dir="ltr" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" dir="ltr" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" dir="ltr" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" dir="ltr" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" dir="ltr" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" dir="ltr" autocomplete="off">
                </div>

                <button class="submit-btn green" id="verifyBtn">تایید و ورود</button>
                
                <div class="timer-section">
                    <div class="timer-text">
                        ⏱️ زمان باقی‌مانده: <span id="timerDisplay">02:00</span>
                    </div>
                    <button class="resend-btn" id="resendBtn" disabled>ارسال مجدد کد</button>
                </div>
            </div>
        </div>
    </main>

    <div class="bottom-nav">
        <div class="ps-shapes">
            <a href="email asking.html">
                <i class="fa-solid fa-xmark ps-cross"></i>
            </a>
            <i class="fa-regular fa-circle ps-circle"></i>
            <i class="fa-solid fa-triangle-exclamation ps-triangle"></i>
            <i class="fa-regular fa-square ps-square"></i>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. تنظیمات Appwrite
        // ==========================================
        const APPWRITE_CONFIG = {
            endpoint: 'https://fra.cloud.appwrite.io/v1',
            projectId: '6a7734b900207cf3e944'
        };

        // ==========================================
        // 2. راه‌اندازی Appwrite
        // ==========================================
        let client, account;
        
        if (typeof Appwrite !== 'undefined') {
            client = new Appwrite.Client()
                .setEndpoint(APPWRITE_CONFIG.endpoint)
                .setProject(APPWRITE_CONFIG.projectId);
            
            account = new Appwrite.Account(client);
            console.log('✅ Appwrite با موفقیت راه‌اندازی شد!');
        } else {
            console.error('❌ Appwrite SDK بارگذاری نشد. اینترنت را بررسی کنید.');
        }

        // ==========================================
        // 3. متغیرهای سراسری
        // ==========================================
        let currentUserId = null;
        let countdownTimer = null;
        let timeLeft = 120;
        let currentLang = 'fa';
        let isSubmitting = false;

        // ==========================================
        // 4. عناصر DOM
        // ==========================================
        const stepEmail = document.getElementById('stepEmail');
        const stepCode = document.getElementById('stepCode');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const emailInput = document.getElementById('emailInput');
        const otpInputs = document.querySelectorAll('.otp-input');
        const verifyBtn = document.getElementById('verifyBtn');
        const messageEmail = document.getElementById('messageEmail');
        const messageCode = document.getElementById('messageCode');
        const timerDisplay = document.getElementById('timerDisplay');
        const resendBtn = document.getElementById('resendBtn');

        // ==========================================
        // 5. توابع پیام‌رسانی
        // ==========================================
        function showMessage(element, text, type = 'info') {
            element.textContent = text;
            element.className = 'message-box show ' + type;
        }

        function hideMessage(element) {
            element.className = 'message-box';
            element.textContent = '';
        }

        // ==========================================
        // 6. تابع ارسال کد OTP
        // ==========================================
        async function sendOTP() {
            if (isSubmitting) return;
            
            const email = emailInput.value.trim();
            
            if (!email || !email.includes('@') || !email.includes('.')) {
                showMessage(messageEmail, '❌ لطفاً یک ایمیل معتبر وارد کنید.', 'error');
                return;
            }

            isSubmitting = true;
            sendCodeBtn.disabled = true;
            sendCodeBtn.textContent = '⏳ در حال ارسال...';
            hideMessage(messageEmail);

            try {
                // ارسال درخواست Token
                const sessionToken = await account.createEmailToken(
                    Appwrite.ID.unique(),
                    email
                );
                
                currentUserId = sessionToken.userId;
                console.log('✅ کد ارسال شد! userId:', currentUserId);
                
                showMessage(messageEmail, '✅ کد ۶ رقمی به ایمیل شما ارسال شد!', 'success');
                
                setTimeout(() => {
                    stepEmail.classList.remove('active');
                    stepCode.classList.add('active');
                    hideMessage(messageEmail);
                    otpInputs[0].focus();
                    startTimer();
                }, 1000);
                
            } catch (error) {
                console.error('❌ خطا در ارسال کد:', error);
                let errorMessage = '❌ خطا در ارسال کد. لطفاً دامنه (Hostname) سایت خود را در پنل Appwrite چک کنید.';
                if (error.message && error.message.includes('rate limit')) {
                    errorMessage = '❌ تعداد درخواست‌ها زیاد است. لطفاً کمی صبر کنید.';
                }
                showMessage(messageEmail, errorMessage, 'error');
            } finally {
                sendCodeBtn.disabled = false;
                sendCodeBtn.textContent = 'ارسال کد تایید';
                isSubmitting = false;
            }
        }

        // ==========================================
        // 7. تابع تأیید کد OTP (اصلاح‌شده)
        // ==========================================
        async function verifyOTP() {
            if (isSubmitting) return;
            
            let otpCode = '';
            otpInputs.forEach(input => otpCode += input.value);

            if (otpCode.length !== 6) {
                showMessage(messageCode, '❌ لطفاً کد ۶ رقمی را کامل وارد کنید.', 'error');
                return;
            }

            isSubmitting = true;
            verifyBtn.disabled = true;
            verifyBtn.textContent = '⏳ در حال تأیید...';
            hideMessage(messageCode);

            try {
                // ✅ استفاده از متد صحیح Appwrite SDK v15
                const session = await account.createSessionWithToken(
                    currentUserId,
                    otpCode
                );
                
                console.log('✅ ورود موفق! Session:', session);
                
                showMessage(messageCode, '🎉 ورود با موفقیت انجام شد!', 'success');
                
                otpInputs.forEach(input => input.disabled = true);
                resendBtn.disabled = true;
                clearInterval(countdownTimer);
                
                // انتقال کاربر به صفحه بعد
                setTimeout(() => {
                    showMessage(messageCode, '✅ در حال انتقال...', 'info');
                    // window.location.href = 'dashboard.html'; // صفحه مقصد خود را تنظیم کنید
                }, 1500);
                
            } catch (error) {
                console.error('❌ خطا در تأیید کد:', error);
                showMessage(messageCode, '❌ کد وارد شده اشتباه یا منقضی شده است.', 'error');
                
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'تایید و ورود';
                isSubmitting = false;
            }
        }

        // ==========================================
        // 8. مدیریت تایمر
        // ==========================================
        function startTimer() {
            timeLeft = 120;
            resendBtn.disabled = true;
            resendBtn.textContent = '⏳ منتظر بمانید...';
            
            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    timerDisplay.textContent = '00:00';
                    resendBtn.disabled = false;
                    resendBtn.textContent = '📨 ارسال مجدد کد';
                    showMessage(messageCode, '⏰ زمان کد به پایان رسید. کد جدید دریافت کنید.', 'error');
                }
            }, 1000);
        }

        // ==========================================
        // 9. رویدادها (Event Listeners)
        // ==========================================
        sendCodeBtn.addEventListener('click', sendOTP);
        verifyBtn.addEventListener('click', verifyOTP);
        resendBtn.addEventListener('click', sendOTP);

        emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendOTP();
            }
        });

        // مدیریت رفتن به خانه بعدی موقع تایپ کد
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, ''); // فقط عدد
                if (this.value && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
                
                const allFilled = Array.from(otpInputs).every(inp => inp.value !== '');
                if (allFilled && !isSubmitting) {
                    verifyOTP();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });

        // تم دارک / لایت
        document.getElementById('themeToggle').addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const icon = document.querySelector('#themeToggle i');
            if (document.body.classList.contains('light-mode')) {
                icon.className = 'fa-solid fa-sun';
            } else {
                icon.className = 'fa-solid fa-moon';
            }
        });
    </script>
</body>
</html>
