<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Connect - ورود / ثبت‌نام</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- ========================================== -->
    <!-- ✅ اضافه کردن Appwrite SDK از CDN -->
    <!-- ========================================== -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@15.0.0/dist/umd/sdk.min.js"></script>
    
    <style>
        /* ==========================================
           متغیرهای رنگی (حالت شب / روز)
           ========================================== */
        :root {
            --bg-base: #0d0f14;
            --bg-radial: #1a1f2b;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --card-border: #2a3040;
            --pill-bg: rgba(26, 31, 43, 0.95);
            --accent-pink: #ff0055;
            --accent-green: #00ff88;
            --modal-glass-bg: rgba(26, 31, 43, 0.65);
            --modal-glass-border: rgba(255, 255, 255, 0.12);
            --input-bg: rgba(0, 0, 0, 0.3);
            --error-color: #ff4757;
            --success-color: #00ff88;
        }

        body.light-mode {
            --bg-base: #f4f1ea;
            --bg-radial: #ffffff;
            --text-main: #14161c;
            --text-sub: #5a6172;
            --card-border: #e2ded3;
            --pill-bg: rgba(255, 255, 255, 0.95);
            --accent-pink: #e2005f;
            --accent-green: #00b368;
            --modal-glass-bg: rgba(255, 255, 255, 0.65);
            --modal-glass-border: rgba(0, 0, 0, 0.1);
            --input-bg: rgba(255, 255, 255, 0.8);
            --error-color: #dc3545;
            --success-color: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 10% 10%, var(--bg-radial) 0%, var(--bg-base) 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(26, 31, 43, 0.5);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        body.light-mode .icon-btn {
            background: #ffffff;
        }

        .icon-btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.35);
        }

        .lang-btn {
            width: auto;
            padding: 0 14px;
            border-radius: 21px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .logo-container {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            padding: 3px;
            background: rgba(26, 31, 43, 0.5);
            border: 2px solid var(--accent-pink);
            box-shadow: 0 0 20px var(--accent-pink), inset 0 0 20px var(--accent-pink);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .logo-container:hover {
            transform: scale(1.08);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 20px 100px;
        }

        .glass-card {
            background: var(--modal-glass-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--modal-glass-border);
            border-radius: 24px;
            padding: 35px 25px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.05);
            text-align: center;
            position: relative;
        }

        .step-panel {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .step-panel.active {
            display: flex;
        }

        .modal-icon {
            font-size: 2.5rem;
            color: var(--accent-pink);
            margin-bottom: 15px;
            text-shadow: 0 0 12px rgba(255, 0, 85, 0.5);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .modal-desc {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .glass-input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 20px;
            transition: border-color 0.25s, box-shadow 0.25s;
            text-align: center;
        }

        .glass-input:focus {
            border-color: var(--accent-pink);
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.3);
        }
        
        .glass-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .otp-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            direction: ltr;
            margin-bottom: 25px;
            width: 100%;
        }

        .otp-input {
            width: 42px;
            height: 50px;
            border-radius: 10px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .otp-input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.4);
        }
        
        .otp-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent-pink), #ff5588);
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 22px rgba(255, 0, 85, 0.55);
        }
        
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .submit-btn.green {
            background: linear-gradient(135deg, var(--accent-green), #00b368);
            color: #0d0f14;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.35);
        }

        .submit-btn.green:hover:not(:disabled) {
            box-shadow: 0 0 22px rgba(0, 255, 136, 0.55);
        }

        .message-box {
            width: 100%;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            display: none;
            text-align: center;
        }
        
        .message-box.show {
            display: block;
        }
        
        .message-box.success {
            background: rgba(0, 255, 136, 0.15);
            border: 1px solid var(--success-color);
            color: var(--success-color);
        }
        
        .message-box.error {
            background: rgba(255, 71, 87, 0.15);
            border: 1px solid var(--error-color);
            color: var(--error-color);
        }
        
        .message-box.info {
            background: rgba(0, 150, 255, 0.15);
            border: 1px solid #0096ff;
            color: #0096ff;
        }

        .timer-section {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
        }
        
        .timer-text {
            font-size: 0.85rem;
            color: var(--text-sub);
        }
        
        .timer-text span {
            color: var(--accent-green);
            font-weight: 700;
            font-size: 1.1rem;
        }
        
        .resend-btn {
            background: none;
            border: none;
            color: var(--accent-pink);
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
            font-size: 0.85rem;
            padding: 5px 10px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .resend-btn:hover:not(:disabled) {
            color: var(--accent-green);
            background: rgba(0, 255, 136, 0.1);
        }
        
        .resend-btn:disabled {
            color: var(--text-sub);
            cursor: not-allowed;
            text-decoration: none;
            opacity: 0.5;
        }

        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .ps-shapes {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            background: var(--pill-bg);
            padding: 14px 35px;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            width: auto;
        }

        .ps-shapes i {
            font-size: 1.5rem;
            transition: transform 0.3s ease, filter 0.3s ease;
            cursor: pointer;
        }

        .ps-shapes .ps-cross { color: #5352ed; text-shadow: 0 0 15px rgba(83, 82, 237, 0.7); }
        .ps-shapes .ps-circle { color: #ff4757; text-shadow: 0 0 15px rgba(255, 71, 87, 0.7); }
        .ps-shapes .ps-triangle { color: #00f0ff; text-shadow: 0 0 15px rgba(0, 240, 255, 0.7); }
        .ps-shapes .ps-square { color: #ff77a9; text-shadow: 0 0 15px rgba(255, 119, 169, 0.7); }

        .ps-shapes i:hover {
            transform: scale(1.3) rotate(10deg);
            filter: brightness(1.5);
        }

        /* ==========================================
           اسپینر لودینگ
           ========================================== */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
            margin-right: 8px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 500px) {
            header { padding: 14px 15px; }
            .logo-container { width: 52px; height: 52px; }
            .icon-btn { width: 38px; height: 38px; font-size: 0.9rem; }
            .lang-btn { padding: 0 10px; font-size: 0.75rem; }
            .header-actions { gap: 6px; }

            .ps-shapes { padding: 12px 25px; gap: 20px; }
            .ps-shapes i { font-size: 1.2rem; }

            .otp-input { width: 35px; height: 45px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="op.jpg" alt="Logo" onerror="this.style.display='none'">
        </div>

        <div class="header-actions">
            <button class="icon-btn" id="themeToggle" type="button" aria-label="تغییر حالت شب و روز" title="حالت شب/روز">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="icon-btn lang-btn" id="langToggle" type="button" aria-label="تغییر زبان" title="زبان">
                <span id="langLabel">FA</span>
            </button>
        </div>
    </header>

    <main>
        <div class="glass-card">
            <!-- مرحله 1: ایمیل -->
            <div class="step-panel active" id="stepEmail">
                <i class="fa-regular fa-envelope modal-icon"></i>
                <h3 class="modal-title" id="titleEmail">ورود / ثبت‌نام</h3>
                <p class="modal-desc" id="descEmail">جهت ادامه، ایمیل خود را وارد کنید</p>
                
                <div class="message-box" id="messageEmail"></div>
                
                <input type="email" class="glass-input" id="emailInput" placeholder="example@gmail.com" required>
                <button class="submit-btn" id="sendCodeBtn">ارسال کد تایید</button>
            </div>

            <!-- مرحله 2: کد OTP -->
            <div class="step-panel" id="stepCode">
                <i class="fa-solid fa-shield-halved modal-icon" style="color: var(--accent-green);"></i>
                <h3 class="modal-title" id="titleCode">تایید کد امنیت</h3>
                <p class="modal-desc" id="descCode">کد ۶ رقمی ارسال شده به ایمیل را وارد کنید</p>

                <div class="message-box" id="messageCode"></div>

                <div class="otp-container">
                    <input type="text" maxlength="1" class="otp-input" dir="ltr" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" dir="ltr" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" dir="ltr" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" dir="ltr" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" dir="ltr" autocomplete="off">
                    <input type="text" maxlength="1" class="otp-input" dir="ltr" autocomplete="off">
                </div>

                <button class="submit-btn green" id="verifyBtn">تایید و ورود</button>
                
                <div class="timer-section">
                    <div class="timer-text">
                        ⏱️ زمان باقی‌مانده: <span id="timerDisplay">02:00</span>
                    </div>
                    <button class="resend-btn" id="resendBtn" disabled>ارسال مجدد کد</button>
                </div>
            </div>
        </div>
    </main>

    <div class="bottom-nav">
        <div class="ps-shapes">
            <a href="email asking.html">
                <i class="fa-solid fa-xmark ps-cross"></i>
            </a>
            <i class="fa-regular fa-circle ps-circle"></i>
            <i class="fa-solid fa-triangle-exclamation ps-triangle"></i>
            <i class="fa-regular fa-square ps-square"></i>
        </div>
    </div>

    <script>
        // ==========================================
        // جلوگیری از خطاهای Appwrite در حالت آفلاین
        // ==========================================
        if (typeof Appwrite === 'undefined') {
            console.warn('⚠️ Appwrite SDK بارگذاری نشد! لطفاً اتصال اینترنت را بررسی کنید.');
            // ایجاد یک شبیه‌سازی برای جلوگیری از خطا
            window.Appwrite = {
                Client: function() {
                    return {
                        setEndpoint: function() { return this; },
                        setProject: function() { return this; }
                    };
                },
                Account: function() {
                    return {
                        createEmailToken: function() {
                            return Promise.reject(new Error('Appwrite SDK در دسترس نیست. لطفاً اتصال اینترنت را بررسی کنید.'));
                        },
                        createSession: function() {
                            return Promise.reject(new Error('Appwrite SDK در دسترس نیست. لطفاً اتصال اینترنت را بررسی کنید.'));
                        }
                    };
                },
                ID: {
                    unique: function() { return 'unique_' + Date.now(); }
                }
            };
        }

        // ==========================================
        // 1. تنظیمات Appwrite
        // ==========================================
        const APPWRITE_CONFIG = {
            endpoint: 'https://fra.cloud.appwrite.io/v1',
            projectId: '6a7734b900207cf3e944'
        };

        // ==========================================
        // 2. راه‌اندازی Appwrite
        // ==========================================
        let client, account;
        
        try {
            client = new Appwrite.Client();
            client
                .setEndpoint(APPWRITE_CONFIG.endpoint)
                .setProject(APPWRITE_CONFIG.projectId);
            account = new Appwrite.Account(client);
            console.log('✅ Appwrite راه‌اندازی شد!');
        } catch (error) {
            console.error('❌ خطا در راه‌اندازی Appwrite:', error);
            // ایجاد یک نمونه ساختگی برای جلوگیری از خطا
            account = {
                createEmailToken: function() {
                    return Promise.reject(new Error('Appwrite راه‌اندازی نشد!'));
                },
                createSession: function() {
                    return Promise.reject(new Error('Appwrite راه‌اندازی نشد!'));
                }
            };
        }

        // ==========================================
        // 3. متغیرهای سراسری
        // ==========================================
        let currentUserId = null;
        let countdownTimer = null;
        let timeLeft = 120;
        let currentLang = 'fa';
        let isSubmitting = false;

        // ==========================================
        // 4. عناصر DOM
        // ==========================================
        const stepEmail = document.getElementById('stepEmail');
        const stepCode = document.getElementById('stepCode');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const emailInput = document.getElementById('emailInput');
        const otpInputs = document.querySelectorAll('.otp-input');
        const verifyBtn = document.getElementById('verifyBtn');
        const messageEmail = document.getElementById('messageEmail');
        const messageCode = document.getElementById('messageCode');
        const timerDisplay = document.getElementById('timerDisplay');
        const resendBtn = document.getElementById('resendBtn');

        // ==========================================
        // 5. توابع نمایش پیام
        // ==========================================
        function showMessage(element, text, type = 'info') {
            element.textContent = text;
            element.className = 'message-box show ' + type;
        }

        function hideMessage(element) {
            element.className = 'message-box';
            element.textContent = '';
        }

        // ==========================================
        // 6. تابع ارسال کد OTP
        // ==========================================
        async function sendOTP() {
            // جلوگیری از ارسال همزمان
            if (isSubmitting) return;
            
            const email = emailInput.value.trim();
            
            // اعتبارسنجی
            if (!email || !email.includes('@') || !email.includes('.')) {
                showMessage(messageEmail, 
                    currentLang === 'fa' ? '❌ لطفاً یک ایمیل معتبر وارد کنید.' : '❌ Please enter a valid email.',
                    'error'
                );
                return;
            }

            isSubmitting = true;
            sendCodeBtn.disabled = true;
            sendCodeBtn.innerHTML = currentLang === 'fa' ? '⏳ در حال ارسال...' : '⏳ Sending...';
            hideMessage(messageEmail);

            try {
                // ارسال کد به Appwrite
                const sessionToken = await account.createEmailToken(
                    Appwrite.ID.unique(),
                    email
                );
                
                currentUserId = sessionToken.userId;
                console.log('✅ کد ارسال شد! userId:', currentUserId);
                
                showMessage(messageEmail,
                    currentLang === 'fa' ? '✅ کد ۶ رقمی به ایمیل شما ارسال شد!' : '✅ 6-digit code sent to your email!',
                    'success'
                );
                
                // رفتن به مرحله ۲
                setTimeout(() => {
                    stepEmail.classList.remove('active');
                    stepCode.classList.add('active');
                    hideMessage(messageEmail);
                    otpInputs[0].focus();
                    startTimer();
                }, 1200);
                
            } catch (error) {
                console.error('❌ خطا در ارسال کد:', error);
                
                let errorMessage = currentLang === 'fa' 
                    ? '❌ خطا در ارسال کد. لطفاً دوباره تلاش کنید.' 
                    : '❌ Error sending code. Please try again.';
                    
                if (error.message && (error.message.includes('rate limit') || error.message.includes('too many'))) {
                    errorMessage = currentLang === 'fa'
                        ? '❌ تعداد درخواست‌ها زیاد است. لطفاً چند دقیقه بعد تلاش کنید.'
                        : '❌ Too many requests. Please wait a few minutes.';
                }
                
                showMessage(messageEmail, errorMessage, 'error');
                sendCodeBtn.disabled = false;
                sendCodeBtn.textContent = currentLang === 'fa' ? 'ارسال کد تایید' : 'Send Verification Code';
            } finally {
                isSubmitting = false;
            }
        }

        // ==========================================
        // 7. تابع تأیید کد OTP
        // ==========================================
        async function verifyOTP() {
            if (isSubmitting) return;
            
            // جمع‌آوری کد
            let otpCode = '';
            otpInputs.forEach(input => {
                otpCode += input.value;
            });

            // اعتبارسنجی
            if (otpCode.length !== 6 || !/^\d{6}$/.test(otpCode)) {
                showMessage(messageCode,
                    currentLang === 'fa' ? '❌ لطفاً کد ۶ رقمی را کامل و صحیح وارد کنید.' : '❌ Please enter the complete 6-digit code.',
                    'error'
                );
                return;
            }

            if (!currentUserId) {
                showMessage(messageCode,
                    currentLang === 'fa' ? '❌ خطا در سیستم. لطفاً دوباره تلاش کنید.' : '❌ System error. Please try again.',
                    'error'
                );
                return;
            }

            isSubmitting = true;
            verifyBtn.disabled = true;
            verifyBtn.innerHTML = currentLang === 'fa' ? '⏳ در حال تأیید...' : '⏳ Verifying...';
            hideMessage(messageCode);

            try {
                const session = await account.createSession(
                    currentUserId,
                    otpCode
                );
                
                console.log('✅ ورود موفق! Session:', session);
                
                showMessage(messageCode,
                    currentLang === 'fa' ? '🎉 ورود با موفقیت انجام شد! خوش آمدید.' : '🎉 Successfully logged in! Welcome.',
                    'success'
                );
                
                otpInputs.forEach(input => input.disabled = true);
                resendBtn.disabled = true;
                
                // توقف تایمر
                clearInterval(countdownTimer);
                
                // پس از ۳ ثانیه
                setTimeout(() => {
                    showMessage(messageCode,
                        currentLang === 'fa' ? '✅ در حال انتقال به صفحه اصلی...' : '✅ Redirecting to dashboard...',
                        'info'
                    );
                }, 2000);
                
            } catch (error) {
                console.error('❌ خطا در تأیید کد:', error);
                
                let errorMessage = currentLang === 'fa'
                    ? '❌ کد وارد شده اشتباه است یا منقضی شده است.'
                    : '❌ Invalid or expired code.';
                    
                if (error.message && error.message.includes('expired')) {
                    errorMessage = currentLang === 'fa'
                        ? '⏰ کد منقضی شده است. لطفاً کد جدید دریافت کنید.'
                        : '⏰ Code expired. Please request a new one.';
                }
                
                showMessage(messageCode, errorMessage, 'error');
                
                // پاک کردن کد
                otpInputs.forEach(input => input.value = '');
                otpInputs[0].focus();
                
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = currentLang === 'fa' ? 'تایید و ورود' : 'Verify & Login';
            } finally {
                isSubmitting = false;
            }
        }

        // ==========================================
        // 8. تایمر شمارش معکوس
        // ==========================================
        function startTimer() {
            timeLeft = 120;
            resendBtn.disabled = true;
            resendBtn.textContent = currentLang === 'fa' ? '⏳ منتظر بمانید...' : '⏳ Please wait...';
            verifyBtn.disabled = false;
            
            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                timeLeft--;
                
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                
                if (timeLeft <= 0) {
                    clearInterval(countdownTimer);
                    timerDisplay.textContent = '00:00';
                    resendBtn.disabled = false;
                    resendBtn.textContent = currentLang === 'fa' ? '📨 ارسال مجدد کد' : '📨 Resend Code';
                    verifyBtn.disabled = true;
                    showMessage(messageCode,
                        currentLang === 'fa' ? '⏰ زمان کد به پایان رسید. لطفاً کد جدید دریافت کنید.' : '⏰ Code expired. Please request a new one.',
                        'error'
                    );
                }
            }, 1000);
        }

        // ==========================================
        // 9. ارسال مجدد کد
        // ==========================================
        async function resendOTP() {
            if (isSubmitting) return;
            
            const email = emailInput.value.trim();
            
            if (!email) {
                showMessage(messageCode,
                    currentLang === 'fa' ? '❌ ایمیل یافت نشد. لطفاً دوباره تلاش کنید.' : '❌ Email not found. Please try again.',
                    'error'
                );
                return;
            }
            
            isSubmitting = true;
            resendBtn.disabled = true;
            resendBtn.textContent = currentLang === 'fa' ? '⏳ در حال ارسال...' : '⏳ Sending...';
            hideMessage(messageCode);
            
            try {
                const sessionToken = await account.createEmailToken(
                    Appwrite.ID.unique(),
                    email
                );
                
                currentUserId = sessionToken.userId;
                console.log('✅ کد مجدد ارسال شد! userId:', currentUserId);
                
                showMessage(messageCode,
                    currentLang === 'fa' ? '✅ کد جدید به ایمیل شما ارسال شد!' : '✅ New code sent to your email!',
                    'success'
                );
                
                otpInputs.forEach(input => {
                    input.value = '';
                    input.disabled = false;
                });
                otpInputs[0].focus();
                
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = currentLang === 'fa' ? 'تایید و ورود' : 'Verify & Login';
                
                startTimer();
                
            } catch (error) {
                console.error('❌ خطا در ارسال مجدد:', error);
                showMessage(messageCode,
                    currentLang === 'fa' ? '❌ خطا در ارسال مجدد. لطفاً دوباره تلاش کنید.' : '❌ Error resending. Please try again.',
                    'error'
                );
                resendBtn.disabled = false;
                resendBtn.textContent = currentLang === 'fa' ? '📨 ارسال مجدد کد' : '📨 Resend Code';
            } finally {
                isSubmitting = false;
            }
        }

        // ==========================================
        // 10. Event Listeners
        // ==========================================
        
        // دکمه ارسال کد
        sendCodeBtn.addEventListener('click', sendOTP);
        
        // کلید Enter در ایمیل
        emailInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendOTP();
            }
        });

        // مدیریت ورودی‌های ۶ رقمی
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', function(e) {
                // فقط عدد مجاز است
                this.value = this.value.replace(/\D/g, '');
                
                if (this.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
                
                // اگر همه جعبه‌ها پر شد، خودکار تأیید کن
                const allFilled = Array.from(otpInputs).every(inp => inp.value !== '');
                if (allFilled && !verifyBtn.disabled && !isSubmitting) {
                    verifyOTP();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
            
            input.addEventListener('click', function() {
                this.select();
            });
            
            // جلوگیری از paste
            input.addEventListener('paste', (e) => {
                e.preventDefault();
            });
        });

        // دکمه تأیید
        verifyBtn.addEventListener('click', verifyOTP);
        
        // دکمه ارسال مجدد
        resendBtn.addEventListener('click', resendOTP);

        // ==========================================
        // 11. حالت شب / روز
        // ==========================================
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeIcon.className = isLight ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        });

        // ==========================================
        // 12. تغییر زبان
        // ==========================================
        const langToggle = document.getElementById('langToggle');
        const langLabel = document.getElementById('langLabel');

        const textMap = {
            fa: {
                titleEmail: 'ورود / ثبت‌نام',
                descEmail: 'جهت ادامه، ایمیل خود را وارد کنید',
                btnEmail: 'ارسال کد تایید',
                titleCode: 'تایید کد امنیت',
                descCode: 'کد ۶ رقمی ارسال شده به ایمیل را وارد کنید',
                btnCode: 'تایید و ورود',
                resendText: '📨 ارسال مجدد کد',
                waitingText: '⏳ منتظر بمانید...',
                sendingText: '⏳ در حال ارسال...',
                verifyingText: '⏳ در حال تأیید...'
            },
            en: {
                titleEmail: 'Login / Register',
                descEmail: 'Enter your email to continue',
                btnEmail: 'Send Verification Code',
                titleCode: 'Security Verification',
                descCode: 'Enter the 6-digit code sent to your email',
                btnCode: 'Verify & Login',
                resendText: '📨 Resend Code',
                waitingText: '⏳ Please wait...',
                sendingText: '⏳ Sending...',
                verifyingText: '⏳ Verifying...'
            }
        };

        function updateLanguage(lang) {
            const texts = textMap[lang];
            document.getElementById('titleEmail').textContent = texts.titleEmail;
            document.getElementById('descEmail').textContent = texts.descEmail;
            if (!sendCodeBtn.disabled) {
                sendCodeBtn.textContent = texts.btnEmail;
            }
            document.getElementById('titleCode').textContent = texts.titleCode;
            document.getElementById('descCode').textContent = texts.descCode;
            if (!verifyBtn.disabled) {
                verifyBtn.innerHTML = texts.btnCode;
            }
            if (!resendBtn.disabled) {
                resendBtn.textContent = texts.resendText;
            } else if (resendBtn.textContent.includes('منتظر') || resendBtn.textContent.includes('wait')) {
                resendBtn.textContent = texts.waitingText;
            }
        }

        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'fa' ? 'en' : 'fa';
            langLabel.textContent = currentLang === 'fa' ? 'FA' : 'EN';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
            updateLanguage(currentLang);
        });

        // ==========================================
        // 13. مقداردهی اولیه
        // ==========================================
        console.log('🚀 سیستم OTP با Appwrite آماده است!');
        console.log('📧 پروژه:', APPWRITE_CONFIG.projectId);
        console.log('🌐 سرور:', APPWRITE_CONFIG.endpoint);
        console.log('💡 برای تست، یک ایمیل معتبر وارد کنید.');
    </script>

</body>
</html>
