<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Store - Special Rewards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="nav.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');

        :root {
            --bg: #0f0f12;
            --surface: #18181f;
            --surface-hover: #22222e;
            --border: rgba(255,255,255,0.06);
            --text: #f0f0f5;
            --text-muted: #8b8b9e;
            --accent: #e11d48;
            --accent-glow: rgba(225, 29, 72, 0.4);
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.3);
            --radius: 16px;
            --radius-sm: 12px;
            --nav-bg: rgba(24, 24, 31, 0.85);
            --pill-bg: rgba(24, 24, 31, 0.95);
            --card-border: #2a3040;
            --lime-main: #ccff00;
            --lime-shadow: rgba(204, 255, 0, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            --glass-blur: 30px;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --glass-card-bg: rgba(255, 255, 255, 0.08);
            --glass-card-border: rgba(255, 255, 255, 0.15);
            --glass-card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glass-card-blur: 20px;
        }

        [data-theme="light"] {
            --bg: #f0f0f5;
            --surface: #ffffff;
            --surface-hover: #e8e8ee;
            --border: rgba(0,0,0,0.08);
            --text: #1a1a1e;
            --text-muted: #6b6b7e;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --pill-bg: rgba(255, 255, 255, 0.95);
            --card-border: #e2ded3;
            --lime-main: #4a7a4a;
            --lime-shadow: rgba(74, 122, 74, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 25px 60px rgba(0, 0, 0, 0.08);
            --glass-blur: 20px;
            --shadow-color: rgba(0, 0, 0, 0.06);
            --glass-card-bg: rgba(255, 255, 255, 0.7);
            --glass-card-border: rgba(255, 255, 255, 0.4);
            --glass-card-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Vazirmatn', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 120px;
            line-height: 1.6;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* ===== HEADER (empty) ===== */
        header {
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .masonry {
            column-count: 5;
            column-gap: 18px;
        }

        .card {
            break-inside: avoid;
            margin-bottom: 18px;
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.4s ease, background 0.4s ease;
        }

        .card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 24px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
        }

        [data-theme="light"] .card:hover {
            box-shadow: 0 24px 48px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.04);
        }

        .card-img-wrap {
            position: relative;
            overflow: hidden;
        }

        .card-img {
            width: 100%;
            display: block;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.4s ease;
        }

        .card:hover .card-img {
            transform: scale(1.08);
            filter: brightness(1.1);
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 50%);
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 16px;
        }

        .card:hover .card-overlay {
            opacity: 1;
        }

        .overlay-title {
            font-weight: 800;
            font-size: 1rem;
            margin-bottom: 4px;
            color: #fff;
        }

        .overlay-desc {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.8);
        }

        .card-body {
            padding: 14px 16px;
        }

        .card-tags {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.65rem;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.06);
            color: var(--text-muted);
            font-weight: 500;
            border: 1px solid var(--border);
        }

        [data-theme="light"] .tag {
            background: rgba(0,0,0,0.04);
        }

        .tag.pink {
            background: rgba(225, 29, 72, 0.12);
            color: #fb7185;
            border-color: rgba(225, 29, 72, 0.2);
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }

        .price-box {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .diamond-img {
            width: 28px;
            height: 28px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(59, 130, 246, 0.6));
            transition: transform 0.3s ease, filter 0.3s ease;
            flex-shrink: 0;
        }

        .card:hover .diamond-img {
            transform: scale(1.2) rotate(-10deg);
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.8));
        }

        .price {
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--green);
            text-shadow: 0 0 20px var(--green-glow);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .save-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .save-btn:hover {
            background: rgba(225, 29, 72, 0.15);
            color: var(--accent);
            border-color: rgba(225, 29, 72, 0.3);
        }

        /* ==========================================
           DETAIL PANEL
           ========================================== */
        .detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeOverlay 0.3s ease;
        }

        .detail-overlay.open {
            display: flex;
        }

        @keyframes fadeOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .detail-panel {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 500px;
            width: 100%;
            border: 1px solid var(--border);
            box-shadow: 0 32px 64px rgba(0,0,0,0.6);
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            max-height: 90vh;
            overflow-y: auto;
        }

        [data-theme="light"] .detail-panel {
            box-shadow: 0 32px 64px rgba(0,0,0,0.15);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .detail-panel .panel-img-wrap {
            position: relative;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 200px;
        }

        .detail-panel .panel-img {
            max-width: 100%;
            max-height: 320px;
            object-fit: contain;
            border-radius: var(--radius-sm);
        }

        .detail-panel .panel-close {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .detail-panel .panel-close:hover {
            background: var(--accent);
            transform: rotate(90deg);
        }

        .detail-panel .panel-body {
            padding: 24px 28px 28px;
        }

        .detail-panel .panel-title {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .detail-panel .panel-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .detail-panel .panel-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .detail-panel .panel-tags .tag {
            font-size: 0.75rem;
            padding: 4px 14px;
        }

        .detail-panel .panel-price {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .detail-panel .panel-price .price {
            font-size: 1.5rem;
        }

        .detail-panel .panel-price .diamond-img {
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.8));
        }

        .detail-panel .panel-action {
            margin-top: 18px;
            display: flex;
            gap: 12px;
        }

        .detail-panel .panel-action .btn-primary {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            text-align: center;
            border-radius: var(--radius-sm);
            border: none;
            background: linear-gradient(135deg, var(--accent), #fb7185);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .detail-panel .panel-action .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px var(--accent-glow);
        }

        .detail-panel .panel-action .btn-secondary {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            text-align: center;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .detail-panel .panel-action .btn-secondary:hover {
            background: var(--surface-hover);
            border-color: rgba(255,255,255,0.2);
        }

        /* ==========================================
           SETTINGS PANEL
           ========================================== */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .settings-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .settings-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 400px;
            max-width: 92%;
            max-height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            padding: 0;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .settings-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .settings-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px 16px 24px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.02);
        }

        .settings-panel .panel-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }

        .settings-panel .panel-header h2 i {
            color: var(--lime-main);
            font-size: 1.2rem;
        }

        .settings-panel .close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-panel .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: rotate(90deg);
        }

        .settings-content {
            padding: 8px 0 20px 0;
            overflow-y: auto;
            max-height: calc(85vh - 80px);
            scroll-behavior: smooth;
        }

        .settings-content::-webkit-scrollbar {
            width: 3px;
        }

        .settings-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .settings-content::-webkit-scrollbar-thumb {
            background: var(--lime-main);
            border-radius: 10px;
        }

        .settings-group {
            padding: 0 16px;
            margin-bottom: 4px;
        }

        .settings-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 12px 8px 6px 8px;
            opacity: 0.7;
        }

        .settings-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 2px;
            border: 1px solid transparent;
            position: relative;
        }

        .settings-option:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
        }

        .settings-option:active {
            transform: scale(0.98);
        }

        .settings-option .option-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .settings-option .option-left i {
            color: var(--lime-main);
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
            opacity: 0.9;
        }

        .settings-option .option-text {
            color: var(--text);
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: -0.2px;
        }

        .settings-option .option-status {
            color: var(--lime-main);
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(204, 255, 0, 0.08);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .ios-toggle {
            width: 51px;
            height: 31px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            position: relative;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        [data-theme="light"] .ios-toggle {
            background: #e5e5ea;
            border-color: #d1d1d6;
        }

        .ios-toggle.active {
            background: var(--lime-main);
            border-color: var(--lime-main);
        }

        [data-theme="light"] .ios-toggle.active {
            background: #4a7a4a;
            border-color: #4a7a4a;
        }

        .ios-toggle .toggle-knob {
            width: 27px;
            height: 27px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 1px;
            left: 1px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .ios-toggle.active .toggle-knob {
            left: 21px;
        }

        .settings-option .chevron {
            color: var(--text-muted);
            opacity: 0.4;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .settings-option:hover .chevron {
            opacity: 0.8;
        }

        .settings-divider {
            height: 1px;
            background: var(--glass-border);
            margin: 4px 20px;
        }

        .settings-footer {
            padding: 16px 24px 8px 24px;
            text-align: center;
            opacity: 0.4;
        }

        .settings-footer span {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 1200px) { .masonry { column-count: 4; } }
        @media (max-width: 900px) { .masonry { column-count: 3; } }
        @media (max-width: 600px) { 
            .masonry { column-count: 2; column-gap: 12px; } 
            main { padding: 20px 12px; }
            
            .detail-panel { max-width: 95%; }
            .detail-panel .panel-body { padding: 18px 20px 22px; }
            .price { font-size: 1rem; }
            .detail-panel .panel-price .price { font-size: 1.2rem; }
            .diamond-img { width: 24px; height: 24px; }
            .detail-panel .panel-price .diamond-img { width: 32px; height: 32px; }
            .save-btn { width: 32px; height: 32px; font-size: 0.9rem; }

            .settings-panel { width: 94%; max-width: 94%; border-radius: 24px; }
            .settings-panel .panel-header { padding: 16px 18px 12px 18px; }
            .settings-panel .panel-header h2 { font-size: 1rem; }
            .settings-content { padding: 4px 0 16px 0; max-height: calc(85vh - 70px); }
            .settings-option { padding: 12px 14px; }
            .settings-option .option-text { font-size: 0.9rem; }
            .ios-toggle { width: 45px; height: 28px; }
            .ios-toggle .toggle-knob { width: 24px; height: 24px; }
            .ios-toggle.active .toggle-knob { left: 19px; }
        }
        @media (max-width: 380px) { 
            .masonry { column-count: 2; column-gap: 10px; } 
            .card-body { padding: 10px 12px; }
            .diamond-img { width: 20px; height: 20px; }
            .detail-panel .panel-price .diamond-img { width: 28px; height: 28px; }
            .price { font-size: 0.9rem; }
            .detail-panel .panel-price .price { font-size: 1rem; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        [data-theme="light"] ::-webkit-scrollbar-thumb { background: #bbb; }
        [data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: #999; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            animation: fadeInUp 0.6s ease backwards;
        }
    </style>
</head>
<body>

    <!-- ===== HEADER (empty) ===== -->
    <header></header>

    <!-- ==========================================
    SETTINGS OVERLAY
    ========================================== -->
    <div class="settings-overlay" id="settingsOverlay"></div>

    <!-- ==========================================
    SETTINGS PANEL
    ========================================== -->
    <div class="settings-panel" id="settingsPanel">
        <div class="panel-header">
            <h2><i class="fa-solid fa-gear"></i> <span>Settings</span></h2>
            <button class="close-btn" id="closeSettings"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="settings-content">
            <div class="settings-group">
                <label>🌐 Language</label>
                <div class="settings-option" id="langOption">
                    <div class="option-left">
                        <i class="fa-solid fa-language"></i>
                        <span class="option-text" id="langLabelSettings">English</span>
                    </div>
                    <div class="option-status" id="langStatus">EN</div>
                </div>
            </div>
            <div class="settings-divider"></div>

            <div class="settings-group">
                <label>🎨 Appearance</label>
                <div class="settings-option" id="themeOption">
                    <div class="option-left">
                        <i class="fa-solid fa-moon" id="themeIconSettings"></i>
                        <span class="option-text" id="themeLabel">Dark</span>
                    </div>
                    <div class="ios-toggle" id="themeToggleSettings">
                        <div class="toggle-knob"></div>
                    </div>
                </div>
            </div>
            <div class="settings-divider"></div>

            <div class="settings-group">
                <label>👤 Account</label>
                <div class="settings-option" onclick="window.location.href='signup.html'">
                    <div class="option-left">
                        <i class="fa-solid fa-user-plus"></i>
                        <span class="option-text">Sign Up / Login</span>
                    </div>
                    <i class="fa-solid fa-chevron-left chevron"></i>
                </div>
            </div>
            <div class="settings-divider"></div>

            <div class="settings-group">
                <label>💬 Support</label>
                <div class="settings-option" onclick="window.location.href='conection.html'">
                    <div class="option-left">
                        <i class="fa-solid fa-headset"></i>
                        <span class="option-text">Contact Support</span>
                    </div>
                    <i class="fa-solid fa-chevron-left chevron"></i>
                </div>
            </div>
            <div class="settings-footer">
                <span>Version 2.0.0</span>
            </div>
        </div>
    </div>

    <!-- ===== MAIN ===== -->
    <main>
        <div class="masonry" id="masonryGrid">
            <!-- Cards will be populated by JavaScript -->
        </div>
    </main>

    <!-- ==========================================
    DETAIL PANEL
    ========================================== -->
    <div class="detail-overlay" id="detailOverlay">
        <div class="detail-panel" id="detailPanel">
            <div class="panel-img-wrap">
                <img class="panel-img" id="panelImg" src="" alt="">
                <button class="panel-close" id="panelClose"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="panel-body">
                <h2 class="panel-title" id="panelTitle">Title</h2>
                <p class="panel-desc" id="panelDesc">Description</p>
                <div class="panel-tags" id="panelTags"></div>
                <div class="panel-price">
                    <img class="diamond-img" src="diamond.png" alt="Diamond">
                    <span class="price" id="panelPrice">0</span>
                </div>
                <div class="panel-action">
                    <button class="btn-primary" id="buyBtn">Buy with Diamonds</button>
                    <button class="btn-secondary" id="saveBtn"><i class="fa-regular fa-bookmark"></i> <span id="saveText">Save</span></button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
    BOTTOM NAV
    ========================================== -->
    <div id="bottom-nav-placeholder"></div>
    <script src="nav.js"></script>

    <script>
        // ============================================================
        // 1. DATA - ALL IN ENGLISH
        // ============================================================
        const itemsData = [
            {
                id: 1,
                img: "book of time.png",
                title: "Book of Time",
                desc: "Exchange your diamond with other items",
                tags: ["Magic item"],
                price: "200"
            },
            {
                id: 2,
                img: "book of hero.png",
                title: "Book of Hero",
                desc: "It's cheaper than Clash store",
                tags: ["Magic item"],
                price: "200"
            },
            {
                id: 3,
                img: "hut.png",
                title: "Builder Hut",
                desc: "Buy one more builder for your base",
                tags: ["Base"],
                price: "1000"
            },
            {
                id: 4,
                img: "rune.png",
                title: "Rune of Gold",
                desc: "Fill your treasury completely",
                tags: ["Magic item"],
                price: "350"
            },
            {
                id: 5,
                img: "book of warior.png",
                title: "Book of Warrior",
                desc: "Finish your Hero instantly",
                tags: ["Magic item", "Limited"],
                price: "200"
            },
            {
                id: 6,
                img: "hero ball.png",
                title: "Spiky Ball",
                desc: "Make your King great again",
                tags: ["Hero ability"],
                price: "500"
            },
            {
                id: 7,
                img: "hand of the king.png",
                title: "Giant Glove",
                desc: "Upgrade your King",
                tags: ["Hero ability"],
                price: "500"
            },
            {
                id: 8,
                img: "fire ball.png",
                title: "Fire Ball",
                desc: "Destroy enemy bases",
                tags: ["Hero ability"],
                price: "500"
            },
            {
                id: 9,
                img: "fhgkl.png",
                title: "Royal Champion Boot",
                desc: "Shock your enemy",
                tags: ["Hero ability"],
                price: "500"
            },
            {
                id: 10,
                img: "ChatGPT Image Aug 11, 2026, 08_10_30 PM.png",
                title: "Frozen Arrow",
                desc: "Freeze your enemies",
                tags: ["Hero ability"],
                price: "250"
            },
            {
                id: 11,
                img: "viking.png",
                title: "Viking King",
                desc: "Viking Barbarian King series",
                tags: ["Skin"],
                price: "500"
            },
            {
                id: 12,
                img: "gea.png",
                title: "Builder's Hammer",
                desc: "Free your builder instantly",
                tags: ["Magic item"],
                price: "200"
            },
            {
                id: 13,
                img: "haaland.png",
                title: "King Haaland",
                desc: "Limited edition skin",
                tags: ["Skin", "Limited"],
                price: "500"
            }
        ];

        // ============================================================
        // 2. DOM REFS
        // ============================================================
        const masonryGrid = document.getElementById('masonryGrid');
        const overlay = document.getElementById('detailOverlay');
        const panelImg = document.getElementById('panelImg');
        const panelTitle = document.getElementById('panelTitle');
        const panelDesc = document.getElementById('panelDesc');
        const panelTags = document.getElementById('panelTags');
        const panelPrice = document.getElementById('panelPrice');
        const panelClose = document.getElementById('panelClose');
        const buyBtn = document.getElementById('buyBtn');
        const saveBtn = document.getElementById('saveBtn');
        const saveText = document.getElementById('saveText');

        // ============================================================
        // 3. RENDER CARDS
        // ============================================================
        function renderCards() {
            masonryGrid.innerHTML = '';
            itemsData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${0.05 + index * 0.05}s`;
                card.dataset.index = index;
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img class="card-img" src="${item.img}" alt="${item.title}" loading="lazy">
                        <div class="card-overlay">
                            <div class="overlay-title">${item.title}</div>
                            <div class="overlay-desc">${item.desc}</div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="card-tags">
                            ${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                        <div class="card-footer">
                            <div class="price-box">
                                <img class="diamond-img" src="diamond.png" alt="Diamond">
                                <span class="price">${item.price}</span>
                            </div>
                            <button class="save-btn"><i class="fa-regular fa-bookmark"></i></button>
                        </div>
                    </div>
                `;
                card.addEventListener('click', () => openDetail(item));
                masonryGrid.appendChild(card);
            });
        }

        // ============================================================
        // 4. DETAIL PANEL
        // ============================================================
        let currentDetailItem = null;

        function openDetail(item) {
            currentDetailItem = item;
            updateDetailPanel(item);
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function updateDetailPanel(item) {
            panelImg.src = item.img;
            panelImg.alt = item.title;
            panelTitle.textContent = item.title;
            panelDesc.textContent = item.desc;
            panelTags.innerHTML = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
            panelPrice.textContent = item.price;
        }

        function closeDetail() {
            overlay.classList.remove('open');
            document.body.style.overflow = '';
            currentDetailItem = null;
        }

        panelClose.addEventListener('click', closeDetail);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeDetail();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDetail();
        });

        // ============================================================
        // 5. BUY BUTTON - DIRECT REDIRECT TO GOOGLE.HTML
        // ============================================================
        buyBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            window.location.href = 'google.html';
        });

        // ============================================================
        // 6. SETTINGS PANEL
        // ============================================================
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const settingsBtn = document.getElementById('settingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettings');

        function openSettings() {
            settingsPanel.classList.add('open');
            settingsOverlay.classList.add('visible');
            document.body.style.overflow = 'hidden';
        }

        function closeSettings() {
            settingsPanel.classList.remove('open');
            settingsOverlay.classList.remove('visible');
            document.body.style.overflow = '';
        }

        if (settingsBtn) {
            settingsBtn.addEventListener('click', openSettings);
        }
        closeSettingsBtn.addEventListener('click', closeSettings);
        settingsOverlay.addEventListener('click', closeSettings);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && settingsPanel.classList.contains('open')) {
                closeSettings();
            }
        });

        // ============================================================
        // 7. THEME TOGGLE
        // ============================================================
        const themeToggleSettings = document.getElementById('themeToggleSettings');
        const themeIconSettings = document.getElementById('themeIconSettings');
        const themeLabel = document.getElementById('themeLabel');

        function updateThemeUI(isLight) {
            if (isLight) {
                document.documentElement.setAttribute('data-theme', 'light');
                themeToggleSettings.classList.add('active');
                themeIconSettings.className = 'fa-solid fa-sun';
                themeIconSettings.style.color = '#f5a623';
                themeLabel.textContent = 'Light';
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeToggleSettings.classList.remove('active');
                themeIconSettings.className = 'fa-solid fa-moon';
                themeIconSettings.style.color = '';
                themeLabel.textContent = 'Dark';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'light') {
            updateThemeUI(true);
        } else {
            updateThemeUI(false);
        }

        document.getElementById('themeOption').addEventListener('click', function() {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            updateThemeUI(!isLight);
        });

        // ============================================================
        // 8. LANGUAGE (English only)
        // ============================================================
        const langOption = document.getElementById('langOption');
        const langLabelSettings = document.getElementById('langLabelSettings');
        const langStatus = document.getElementById('langStatus');

        langLabelSettings.textContent = 'English';
        langStatus.textContent = 'EN';
        document.documentElement.lang = 'en';
        document.documentElement.dir = 'ltr';

        langOption.style.cursor = 'default';
        langOption.addEventListener('click', function(e) {
            e.stopPropagation();
            langStatus.textContent = 'EN ✓';
            setTimeout(function() { 
                langStatus.textContent = 'EN'; 
            }, 800);
        });

        // ============================================================
        // 9. SAVE BUTTON
        // ============================================================
        document.addEventListener('click', function(e) {
            const saveBtn = e.target.closest('.save-btn');
            if (saveBtn) {
                const icon = saveBtn.querySelector('i');
                icon.classList.toggle('fa-regular');
                icon.classList.toggle('fa-solid');
                icon.classList.toggle('fa-bookmark');
                icon.classList.toggle('fa-check');
            }
        });

        // ============================================================
        // 10. INIT
        // ============================================================
        renderCards();
    </script>

</body>
</html>
