<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>گیمینگ استور - جوایز ویژه</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');

        :root {
            --bg: #0f0f12;
            --surface: #18181f;
            --surface-hover: #22222e;
            --border: rgba(255,255,255,0.06);
            --text: #f0f0f5;
            --text-muted: #8b8b9e;
            --accent: #e11d48;
            --accent-glow: rgba(225, 29, 72, 0.4);
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.3);
            --radius: 16px;
            --radius-sm: 12px;
            --nav-bg: rgba(24, 24, 31, 0.85);
            --pill-bg: rgba(24, 24, 31, 0.95);
            --card-border: #2a3040;
        }

        [data-theme="light"] {
            --bg: #f0f0f5;
            --surface: #ffffff;
            --surface-hover: #e8e8ee;
            --border: rgba(0,0,0,0.08);
            --text: #1a1a1e;
            --text-muted: #6b6b7e;
            --nav-bg: rgba(255, 255, 255, 0.85);
            --pill-bg: rgba(255, 255, 255, 0.95);
            --card-border: #e2ded3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Segoe UI', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 120px;
            line-height: 1.6;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* ==========================================
           HEADER
           ========================================== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 15, 18, 0.75);
            backdrop-filter: blur(20px) saturate(1.8);
            -webkit-backdrop-filter: blur(20px) saturate(1.8);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.4s ease;
        }

        [data-theme="light"] header {
            background: rgba(240, 240, 245, 0.75);
        }

        .brand {
            display: flex;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
        }

        .brand-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 2px solid var(--border);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .brand-logo:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 0.9rem;
        }

        .btn-icon:hover {
            background: var(--surface-hover);
            color: var(--text);
            transform: translateY(-2px);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        [data-theme="light"] .btn-icon:hover {
            background: var(--surface-hover);
            color: var(--text);
            border-color: rgba(0,0,0,0.12);
        }

        .btn-primary {
            padding: 8px 20px;
            border-radius: 24px;
            border: none;
            background: linear-gradient(135deg, var(--accent), #fb7185);
            color: white;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px var(--accent-glow);
        }

        /* ==========================================
           MAIN - PINTEREST STYLE MASONRY
           ========================================== */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .masonry {
            column-count: 5;
            column-gap: 18px;
        }

        /* ==========================================
           PINTEREST-STYLE CARDS
           ========================================== */
        .card {
            break-inside: avoid;
            margin-bottom: 18px;
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        box-shadow 0.4s ease, 
                        background 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        /* ارتفاع‌های متفاوت برای ظاهر پینترستی */
        .card:nth-child(1) { min-height: 320px; }
        .card:nth-child(2) { min-height: 280px; }
        .card:nth-child(3) { min-height: 360px; }
        .card:nth-child(4) { min-height: 300px; }
        .card:nth-child(5) { min-height: 340px; }
        .card:nth-child(6) { min-height: 260px; }
        .card:nth-child(7) { min-height: 350px; }
        .card:nth-child(8) { min-height: 290px; }
        .card:nth-child(9) { min-height: 330px; }
        .card:nth-child(10) { min-height: 270px; }
        .card:nth-child(11) { min-height: 310px; }
        .card:nth-child(12) { min-height: 380px; }

        .card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 24px 48px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
            z-index: 10;
        }

        [data-theme="light"] .card:hover {
            box-shadow: 0 24px 48px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.04);
        }

        .card-img-wrap {
            position: relative;
            overflow: hidden;
            flex: 1;
        }

        .card-img {
            width: 100%;
            height: 100%;
            display: block;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.4s ease;
            object-fit: cover;
            min-height: 200px;
        }

        .card:hover .card-img {
            transform: scale(1.06);
            filter: brightness(1.05);
        }

        /* ==========================================
           OVERLAY - فقط عنوان و توضیحات
           ========================================== */
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 55%);
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px 18px;
        }

        .card:hover .card-overlay {
            opacity: 1;
        }

        .overlay-title {
            font-weight: 800;
            font-size: 1.05rem;
            margin-bottom: 4px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .overlay-desc {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.85);
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* ==========================================
           CARD BODY
           ========================================== */
        .card-body {
            padding: 14px 16px 16px;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }

        .card-tags {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.6rem;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,0.06);
            color: var(--text-muted);
            font-weight: 500;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        [data-theme="light"] .tag {
            background: rgba(0,0,0,0.04);
        }

        .card:hover .tag {
            border-color: var(--green);
            color: var(--text);
        }

        .tag.pink {
            background: rgba(225, 29, 72, 0.12);
            color: #fb7185;
            border-color: rgba(225, 29, 72, 0.2);
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .price-box {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .coin-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px rgba(16, 185, 129, 0.3));
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .card:hover .coin-img {
            transform: scale(1.1) rotate(-6deg);
        }

        .price {
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--green);
            text-shadow: 0 0 20px var(--green-glow);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* ==========================================
           دکمه ذخیره در پایین کارت
           ========================================== */
        .save-btn-card {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .save-btn-card:hover {
            background: rgba(225, 29, 72, 0.15);
            color: var(--accent);
            border-color: rgba(225, 29, 72, 0.3);
        }

        .save-btn-card.saved {
            background: rgba(225, 29, 72, 0.2);
            color: var(--accent);
            border-color: var(--accent);
        }

        /* ==========================================
           DETAIL PANEL (POPUP)
           ========================================== */
        .detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeOverlay 0.3s ease;
        }

        .detail-overlay.open {
            display: flex;
        }

        @keyframes fadeOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .detail-panel {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 520px;
            width: 100%;
            border: 1px solid var(--border);
            box-shadow: 0 32px 80px rgba(0,0,0,0.8);
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            max-height: 90vh;
            overflow-y: auto;
        }

        [data-theme="light"] .detail-panel {
            box-shadow: 0 32px 80px rgba(0,0,0,0.2);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .detail-panel .panel-img-wrap {
            position: relative;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 220px;
            border-bottom: 1px solid var(--border);
        }

        .detail-panel .panel-img {
            max-width: 100%;
            max-height: 340px;
            object-fit: contain;
            border-radius: var(--radius-sm);
        }

        .detail-panel .panel-close {
            position: absolute;
            top: 12px;
            left: 12px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .detail-panel .panel-close:hover {
            background: var(--accent);
            transform: rotate(90deg);
        }

        .detail-panel .panel-body {
            padding: 24px 28px 28px;
        }

        .detail-panel .panel-title {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 6px;
        }

        .detail-panel .panel-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .detail-panel .panel-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .detail-panel .panel-tags .tag {
            font-size: 0.75rem;
            padding: 4px 14px;
        }

        .detail-panel .panel-price {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .detail-panel .panel-price .price {
            font-size: 1.6rem;
        }

        .detail-panel .panel-price .coin-img {
            width: 50px;
            height: 50px;
            filter: drop-shadow(0 0 24px rgba(16, 185, 129, 0.5));
        }

        .detail-panel .panel-action {
            margin-top: 18px;
            display: flex;
            gap: 12px;
        }

        .detail-panel .panel-action .btn-primary {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            text-align: center;
            border-radius: var(--radius-sm);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .detail-panel .panel-action .btn-secondary {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            text-align: center;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .detail-panel .panel-action .btn-secondary:hover {
            background: var(--surface-hover);
            border-color: rgba(255,255,255,0.2);
        }

        /* ==========================================
           BOTTOM NAV
           ========================================== */
        .bottom-nav {
            position: fixed;
            bottom: 24px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .ps-shapes {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 32px;
            background: var(--pill-bg);
            padding: 14px 40px;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.5);
            width: auto;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        [data-theme="light"] .ps-shapes {
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
        }

        .ps-shapes .ps-item {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            position: relative;
        }

        .ps-shapes .ps-cross { color: #5352ed; text-shadow: 0 0 20px rgba(83, 82, 237, 0.7); }
        .ps-shapes .ps-circle { color: #ff4757; text-shadow: 0 0 20px rgba(255, 71, 87, 0.7); }
        .ps-shapes .ps-triangle { color: #00f0ff; text-shadow: 0 0 20px rgba(0, 240, 255, 0.7); }
        .ps-shapes .ps-square { color: #ff77a9; text-shadow: 0 0 20px rgba(255, 119, 169, 0.7); }

        .ps-shapes .ps-item:hover {
            transform: scale(1.3) rotate(10deg);
            filter: brightness(1.5);
        }

        .ps-shapes .ps-item.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 15px currentColor;
        }

        /* ==========================================
           FAB SUPPORT
           ========================================== */
        .fab-support {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 1000;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green), #059669);
            border: none;
            color: white;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 32px var(--green-glow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .fab-support:hover {
            transform: scale(1.1) rotate(10deg);
            box-shadow: 0 12px 40px var(--green-glow);
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 1200px) { .masonry { column-count: 4; } }
        @media (max-width: 992px) { .masonry { column-count: 3; } }
        @media (max-width: 768px) { 
            .masonry { column-count: 2; column-gap: 14px; } 
            main { padding: 20px 12px; }
            header { padding: 12px 16px; }
            .brand-logo { width: 40px; height: 40px; }
            
            .ps-shapes { padding: 12px 25px; gap: 20px; }
            .ps-shapes .ps-item { font-size: 1.3rem; width: 32px; height: 32px; }
            
            .detail-panel { max-width: 95%; }
            .detail-panel .panel-body { padding: 18px 20px 22px; }
            .coin-img { width: 28px; height: 28px; }
            .detail-panel .panel-price .coin-img { width: 42px; height: 42px; }
            .price { font-size: 1rem; }
            .detail-panel .panel-price .price { font-size: 1.3rem; }
            
            .card { min-height: auto !important; }
            .card-img { min-height: 160px; }
        }

        @media (max-width: 480px) { 
            .masonry { column-count: 2; column-gap: 10px; } 
            .card-body { padding: 10px 12px 12px; }
            .ps-shapes { padding: 10px 18px; gap: 14px; }
            .ps-shapes .ps-item { font-size: 1.1rem; width: 28px; height: 28px; }
            .brand-logo { width: 36px; height: 36px; }
            .coin-img { width: 24px; height: 24px; }
            .detail-panel .panel-price .coin-img { width: 36px; height: 36px; }
            .price { font-size: 0.9rem; }
            .detail-panel .panel-price .price { font-size: 1.1rem; }
            .overlay-title { font-size: 0.85rem; }
            .overlay-desc { font-size: 0.7rem; }
            .tag { font-size: 0.5rem; padding: 2px 8px; }
            .card-img { min-height: 120px; }
            .save-btn-card { width: 28px; height: 28px; font-size: 0.75rem; }
        }

        /* ==========================================
           SCROLLBAR
           ========================================== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        [data-theme="light"] ::-webkit-scrollbar-thumb { background: #bbb; }
        [data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: #999; }

        /* ==========================================
           ANIMATIONS
           ========================================== */
        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(24px) scale(0.96); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        .card {
            animation: fadeInUp 0.5s ease backwards;
        }

        .card:nth-child(1) { animation-delay: 0.03s; }
        .card:nth-child(2) { animation-delay: 0.06s; }
        .card:nth-child(3) { animation-delay: 0.09s; }
        .card:nth-child(4) { animation-delay: 0.12s; }
        .card:nth-child(5) { animation-delay: 0.15s; }
        .card:nth-child(6) { animation-delay: 0.18s; }
        .card:nth-child(7) { animation-delay: 0.21s; }
        .card:nth-child(8) { animation-delay: 0.24s; }
        .card:nth-child(9) { animation-delay: 0.27s; }
        .card:nth-child(10) { animation-delay: 0.30s; }
        .card:nth-child(11) { animation-delay: 0.33s; }
        .card:nth-child(12) { animation-delay: 0.36s; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand" id="brandLink">
            <div class="brand-logo">
                <img src="op.jpg.png" alt="Logo">
            </div>
        </a>
        <div class="header-actions">
            <button class="btn-icon" id="themeToggle" title="حالت تاریک/روشن">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
            <button class="btn-icon" id="langToggle" title="تغییر زبان">
                <span id="langLabel" style="font-size:0.75rem; font-weight:700;">FA</span>
            </button>
            <button class="btn-primary" id="joinBtn">عضویت</button>
        </div>
    </header>

    <main>
        <div class="masonry" id="masonryGrid">
            <!-- Cards will be populated by JavaScript -->
        </div>
    </main>

    <!-- ==========================================
    DETAIL PANEL (POPUP)
    ========================================== -->
    <div class="detail-overlay" id="detailOverlay">
        <div class="detail-panel" id="detailPanel">
            <div class="panel-img-wrap">
                <img class="panel-img" id="panelImg" src="" alt="">
                <button class="panel-close" id="panelClose"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="panel-body">
                <h2 class="panel-title" id="panelTitle">عنوان</h2>
                <p class="panel-desc" id="panelDesc">توضیحات</p>
                <div class="panel-tags" id="panelTags"></div>
                <div class="panel-price">
                    <img class="coin-img" src="download.png" alt="سکه">
                    <span class="price" id="panelPrice">۰</span>
                </div>
                <div class="panel-action">
                    <button class="btn-primary" id="buyBtn"><i class="fa-solid fa-coins"></i> خرید با سکه</button>
                    <button class="btn-secondary" id="saveBtn"><i class="fa-regular fa-bookmark"></i> <span id="saveText">ذخیره</span></button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
    BOTTOM NAV
    ========================================== -->
    <div class="bottom-nav">
        <div class="ps-shapes">
            <div class="ps-item ps-cross"><i class="fa-solid fa-xmark"></i></div>
            <div class="ps-item ps-circle"><i class="fa-regular fa-circle"></i></div>
            <div class="ps-item ps-triangle"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="ps-item ps-square"><i class="fa-regular fa-square"></i></div>
        </div>
    </div>

    <!-- FAB Support -->
    <button class="fab-support" title="پشتیبانی" id="supportBtn" onclick="window.location.href='conection.html'">
        <i class="fa-solid fa-headset"></i>
    </button>

    <script>
        // ============================================================
        // 1. DATA
        // ============================================================
        const itemsData = [
            {
                id: 1,
                img: "mmm.png",
                title: "M416 Glacier",
                desc: "Changing your silver coin with m416. Limited edition skin with ice effect.",
                tags: ["Skin"],
                price: 10000
            },
            {
                id: 2,
                img: "qwe.png",
                title: "M416 Joker",
                desc: "Changing your silver coin with joker skin. The most wanted skin of 2025.",
                tags: ["Skin"],
                price: 45000
            },
            {
                id: 3,
                img: "shorkh.png",
                title: "PNC Jacket",
                desc: "Limited pubg item. PNC 2025 exclusive jacket.",
                tags: ["Wearable"],
                price: 2500
            },
            {
                id: 4,
                img: "trench.png",
                title: "Trench Coat",
                desc: "Limited pubg item. Classic trench coat style.",
                tags: ["Wearable"],
                price: 1800
            },
            {
                id: 5,
                img: "jampar zard.png",
                title: "Bright Idea Coat",
                desc: "Limited pubg item. Bright yellow coat for royal players.",
                tags: ["Wearable"],
                price: 2000
            },
            {
                id: 6,
                img: "victor.png",
                title: "Emerald Edge Victor",
                desc: "Change your silver with Victor. Emerald green edition.",
                tags: ["Skin"],
                price: 3500
            },
            {
                id: 7,
                img: "awm.png",
                title: "Season 42 AWM",
                desc: "Change your silver with AWM. Season 42 exclusive.",
                tags: ["Skin"],
                price: 800
            },
            {
                id: 8,
                img: "glove zard.png",
                title: "Bright Idea Gloves",
                desc: "Achieve Limited Items. Gloves with bright design.",
                tags: ["Wearable"],
                price: 1200
            },
            {
                id: 9,
                img: "jampar.png",
                title: "Stealth Mode Hoodie",
                desc: "Limited Pubg Item. Black stealth hoodie.",
                tags: ["Wearable"],
                price: 2500
            },
            {
                id: 10,
                img: "m24.png",
                title: "Wilham Putro",
                desc: "Exchange your silver with M24. White edition.",
                tags: ["Skin"],
                price: 3000
            },
            {
                id: 11,
                img: "m762.png",
                title: "Beryl M762",
                desc: "Exchange your silvers with M762. Red Beryl skin.",
                tags: ["Skin"],
                price: 3000
            },
            {
                id: 12,
                img: "Sks.png",
                title: "Steel Show SKS",
                desc: "Limited edition skin. Steel Show series.",
                tags: ["Skin"],
                price: 3000
            }
        ];

        // ============================================================
        // 2. TRANSLATIONS
        // ============================================================
        const uiTranslations = {
            fa: {
                join: "عضویت",
                buy: "خرید با سکه",
                save: "ذخیره"
            },
            en: {
                join: "Join",
                buy: "Buy with Coins",
                save: "Save"
            }
        };

        // ============================================================
        // 3. STATE
        // ============================================================
        let currentLang = localStorage.getItem('lang') || 'fa';
        let currentTheme = localStorage.getItem('theme') || 'dark';

        // ============================================================
        // 4. DOM REFS
        // ============================================================
        const masonryGrid = document.getElementById('masonryGrid');
        const overlay = document.getElementById('detailOverlay');
        const panelImg = document.getElementById('panelImg');
        const panelTitle = document.getElementById('panelTitle');
        const panelDesc = document.getElementById('panelDesc');
        const panelTags = document.getElementById('panelTags');
        const panelPrice = document.getElementById('panelPrice');
        const panelClose = document.getElementById('panelClose');
        const buyBtn = document.getElementById('buyBtn');
        const saveBtn = document.getElementById('saveBtn');
        const saveText = document.getElementById('saveText');
        const joinBtn = document.getElementById('joinBtn');
        const langToggle = document.getElementById('langToggle');
        const langLabel = document.getElementById('langLabel');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        // ============================================================
        // 5. RENDER CARDS
        // ============================================================
        function renderCards() {
            masonryGrid.innerHTML = '';
            itemsData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${0.03 + index * 0.03}s`;
                card.dataset.index = index;
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img class="card-img" src="${item.img}" alt="${item.title}" loading="lazy">
                        <div class="card-overlay">
                            <div class="overlay-title">${item.title}</div>
                            <div class="overlay-desc">${item.desc}</div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="card-tags">
                            ${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                        <div class="card-footer">
                            <div class="price-box">
                                <img class="coin-img" src="download.png" alt="سکه">
                                <span class="price">${item.price.toLocaleString()}</span>
                            </div>
                            <button class="save-btn-card" data-id="${item.id}" title="ذخیره">
                                <i class="fa-regular fa-bookmark"></i>
                            </button>
                        </div>
                    </div>
                `;
                
                // کلیک روی کارت برای باز شدن پنل
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.save-btn-card')) return;
                    openDetail(item);
                });
                
                // دکمه ذخیره در پایین کارت
                const saveCardBtn = card.querySelector('.save-btn-card');
                saveCardBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const icon = saveCardBtn.querySelector('i');
                    icon.classList.toggle('fa-regular');
                    icon.classList.toggle('fa-solid');
                    icon.classList.toggle('fa-bookmark');
                    icon.classList.toggle('fa-check');
                    saveCardBtn.classList.toggle('saved');
                });
                
                masonryGrid.appendChild(card);
            });
        }

        // ============================================================
        // 6. DETAIL PANEL
        // ============================================================
        let currentDetailItem = null;

        function openDetail(item) {
            currentDetailItem = item;
            updateDetailPanel(item);
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function updateDetailPanel(item) {
            panelImg.src = item.img;
            panelImg.alt = item.title;
            panelTitle.textContent = item.title;
            panelDesc.textContent = item.desc;
            panelTags.innerHTML = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
            panelPrice.textContent = item.price.toLocaleString();
        }

        function closeDetail() {
            overlay.classList.remove('open');
            document.body.style.overflow = '';
            currentDetailItem = null;
        }

        panelClose.addEventListener('click', closeDetail);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeDetail();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDetail();
        });

        // ============================================================
        // 7. BUY BUTTON - LINK TO sendme.html
        // ============================================================
        buyBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            
            if (!currentDetailItem) return;
            
            const itemName = currentDetailItem.title;
            const itemPrice = currentDetailItem.price;
            
            // هدایت به صفحه sendme.html با پارامترها
            const url = 'sendme.html?item=' + encodeURIComponent(itemName) + '&price=' + itemPrice;
            window.location.href = url;
        });

        // Save button in detail panel
        saveBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const icon = saveBtn.querySelector('i');
            icon.classList.toggle('fa-regular');
            icon.classList.toggle('fa-solid');
            icon.classList.toggle('fa-bookmark');
            icon.classList.toggle('fa-check');
        });

        // ============================================================
        // 8. APPLY UI LANGUAGE
        // ============================================================
        function applyUILanguage(lang) {
            const t = uiTranslations[lang];
            joinBtn.textContent = t.join;
            buyBtn.innerHTML = '<i class="fa-solid fa-coins"></i> ' + t.buy;
            saveText.textContent = t.save;
            langLabel.textContent = lang === 'fa' ? 'FA' : 'EN';
            document.documentElement.lang = lang === 'fa' ? 'fa' : 'en';
            document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
            localStorage.setItem('lang', lang);
            currentLang = lang;
        }

        // ============================================================
        // 9. THEME
        // ============================================================
        function applyTheme(theme) {
            if (theme === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                themeIcon.className = 'fa-solid fa-sun';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.className = 'fa-solid fa-moon';
            }
            localStorage.setItem('theme', theme);
            currentTheme = theme;
        }

        // ============================================================
        // 10. EVENT LISTENERS
        // ============================================================

        langToggle.addEventListener('click', () => {
            const newLang = currentLang === 'fa' ? 'en' : 'fa';
            applyUILanguage(newLang);
        });

        themeToggle.addEventListener('click', () => {
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            applyTheme(newTheme);
        });

        // PlayStation nav active state
        const psItems = document.querySelectorAll('.ps-item');
        psItems.forEach(item => {
            item.addEventListener('click', function() {
                psItems.forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });
        if (psItems.length > 0) psItems[0].classList.add('active');

        // ============================================================
        // 11. INIT
        // ============================================================
        applyTheme(currentTheme);
        applyUILanguage(currentLang);
        renderCards();
        if (psItems.length > 0) psItems[0].classList.add('active');
    </script>

</body>
</html>
