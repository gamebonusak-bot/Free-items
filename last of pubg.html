<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Store - Special Rewards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="nav.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');

        :root {
            --bg-base: #0a0a0a;
            --bg-radial: #1a1a0a;
            --text-main: #f0f0e0;
            --text-sub: #b8b8a0;
            --card-bg: #12120a;
            --card-border: #2a2a10;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --lime-main: #ccff00;
            --lime-shadow: rgba(204, 255, 0, 0.4);
            --green-shadow: rgba(204, 255, 0, 0.3);
            --modal-overlay: rgba(0, 0, 0, 0.8);
            --input-bg: #1a1a0a;
            --nav-bg: rgba(10, 10, 10, 0.92);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            --glass-blur: 30px;
            --surface: #12120a;
            --surface-hover: #1a1a0a;
            --border: #2a2a10;
            --radius: 16px;
            --radius-sm: 12px;
            --accent: #ccff00;
            --accent-glow: rgba(204, 255, 0, 0.4);
            --green: #ccff00;
            --green-glow: rgba(204, 255, 0, 0.3);
            --pill-bg: rgba(10, 10, 10, 0.95);
            --img-bg: radial-gradient(circle at center, #1a1a0a, #0a0a00);
            --img-filter: brightness(1.1) saturate(1.2);
            --img-opacity: 0.95;
            --glass-card-bg: rgba(255, 255, 255, 0.08);
            --glass-card-border: rgba(255, 255, 255, 0.15);
            --glass-card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glass-card-blur: 20px;
        }

        .light-mode {
            --bg-base: #f5f7f5;
            --bg-radial: #e8ece8;
            --text-main: #1a1a1a;
            --text-sub: #4a4a4a;
            --card-bg: #ffffff;
            --card-border: #d0d4d0;
            --shadow-color: rgba(0, 0, 0, 0.06);
            --lime-main: #4a7a4a;
            --lime-shadow: rgba(74, 122, 74, 0.15);
            --green-shadow: rgba(74, 122, 74, 0.15);
            --modal-overlay: rgba(0, 0, 0, 0.5);
            --input-bg: #edf2f7;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 25px 60px rgba(0, 0, 0, 0.08);
            --glass-blur: 20px;
            --surface: #ffffff;
            --surface-hover: #e8e8ee;
            --border: #d0d4d0;
            --accent: #4a7a4a;
            --accent-glow: rgba(74, 122, 74, 0.15);
            --green: #4a7a4a;
            --green-glow: rgba(74, 122, 74, 0.15);
            --pill-bg: rgba(255, 255, 255, 0.95);
            --img-bg: linear-gradient(135deg, #f0f4f0, #ffffff);
            --img-filter: brightness(1) saturate(1);
            --img-opacity: 1;
            --glass-card-bg: rgba(255, 255, 255, 0.7);
            --glass-card-border: rgba(255, 255, 255, 0.4);
            --glass-card-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Vazirmatn', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 10% 10%, var(--bg-radial) 0%, var(--bg-base) 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 120px;
            line-height: 1.6;
            transition: background-color 0.5s ease, color 0.5s ease, background-image 0.5s ease;
        }

        /* ==========================================
           HEADER - Empty
           ========================================== */
        header {
            padding: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 0;
        }

        /* ==========================================
           MAIN - PINTEREST STYLE MASONRY
           ========================================== */
        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 24px 32px;
        }

        .masonry {
            column-count: 5;
            column-gap: 18px;
        }

        /* ==========================================
           PINTEREST-STYLE CARDS
           ========================================== */
        .card {
            break-inside: avoid;
            margin-bottom: 18px;
            background: var(--surface);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        box-shadow 0.4s ease, 
                        background 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        .card:nth-child(1) { min-height: 320px; }
        .card:nth-child(2) { min-height: 280px; }
        .card:nth-child(3) { min-height: 360px; }
        .card:nth-child(4) { min-height: 300px; }
        .card:nth-child(5) { min-height: 340px; }
        .card:nth-child(6) { min-height: 260px; }
        .card:nth-child(7) { min-height: 350px; }
        .card:nth-child(8) { min-height: 290px; }
        .card:nth-child(9) { min-height: 330px; }
        .card:nth-child(10) { min-height: 270px; }
        .card:nth-child(11) { min-height: 310px; }
        .card:nth-child(12) { min-height: 380px; }

        .card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 24px 48px var(--shadow-color), 0 0 0 1px var(--lime-main);
            z-index: 10;
        }

        .card-img-wrap {
            position: relative;
            overflow: hidden;
            flex: 1;
        }

        .card-img {
            width: 100%;
            height: 100%;
            display: block;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.4s ease;
            object-fit: cover;
            min-height: 200px;
        }

        .card:hover .card-img {
            transform: scale(1.06);
            filter: brightness(1.05);
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 55%);
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px 18px;
        }

        .card:hover .card-overlay {
            opacity: 1;
        }

        .overlay-title {
            font-weight: 800;
            font-size: 1.05rem;
            margin-bottom: 4px;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .overlay-desc {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.85);
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .card-body {
            padding: 14px 16px 16px;
            background: var(--surface);
            border-top: 1px solid var(--border);
        }

        .card-tags {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.6rem;
            padding: 3px 10px;
            border-radius: 20px;
            background: rgba(204, 255, 0, 0.06);
            color: var(--text-sub);
            font-weight: 500;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .light-mode .tag {
            background: rgba(0,0,0,0.04);
        }

        .card:hover .tag {
            border-color: var(--lime-main);
            color: var(--text-main);
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .price-box {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .coin-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            filter: drop-shadow(0 0 12px var(--lime-shadow));
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .card:hover .coin-img {
            transform: scale(1.1) rotate(-6deg);
        }

        .price {
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--lime-main);
            text-shadow: 0 0 20px var(--lime-shadow);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .save-btn-card {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .save-btn-card:hover {
            background: rgba(204, 255, 0, 0.1);
            color: var(--lime-main);
            border-color: var(--lime-main);
        }

        .save-btn-card.saved {
            background: rgba(204, 255, 0, 0.15);
            color: var(--lime-main);
            border-color: var(--lime-main);
        }

        /* ==========================================
           DETAIL PANEL (POPUP)
           ========================================== */
        .detail-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeOverlay 0.3s ease;
        }

        .detail-overlay.open {
            display: flex;
        }

        @keyframes fadeOverlay {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .detail-panel {
            background: var(--surface);
            border-radius: var(--radius);
            max-width: 520px;
            width: 100%;
            border: 1px solid var(--border);
            box-shadow: 0 32px 80px var(--shadow-color);
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .detail-panel .panel-img-wrap {
            position: relative;
            background: var(--bg-base);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 220px;
            border-bottom: 1px solid var(--border);
        }

        .detail-panel .panel-img {
            max-width: 100%;
            max-height: 340px;
            object-fit: contain;
            border-radius: var(--radius-sm);
        }

        .detail-panel .panel-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: rgba(0,0,0,0.6);
            color: #fff;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }

        .detail-panel .panel-close:hover {
            background: var(--lime-main);
            color: #0a0a0a;
            transform: rotate(90deg);
        }

        .detail-panel .panel-body {
            padding: 24px 28px 28px;
        }

        .detail-panel .panel-title {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .detail-panel .panel-desc {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .detail-panel .panel-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .detail-panel .panel-tags .tag {
            font-size: 0.75rem;
            padding: 4px 14px;
        }

        .detail-panel .panel-price {
            display: flex;
            align-items: center;
            gap: 14px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }

        .detail-panel .panel-price .price {
            font-size: 1.6rem;
        }

        .detail-panel .panel-price .coin-img {
            width: 50px;
            height: 50px;
            filter: drop-shadow(0 0 24px var(--lime-shadow));
        }

        .detail-panel .panel-action {
            margin-top: 18px;
            display: flex;
            gap: 12px;
        }

        .detail-panel .panel-action .btn-primary {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            text-align: center;
            border-radius: var(--radius-sm);
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            background: linear-gradient(135deg, var(--lime-main), #aadd00);
            color: #0a0a0a;
            font-weight: 700;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px var(--lime-shadow);
        }

        .light-mode .detail-panel .panel-action .btn-primary {
            color: #ffffff;
            background: linear-gradient(135deg, #4a7a4a, #5a8a5a);
        }

        .detail-panel .panel-action .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px var(--lime-shadow);
        }

        .detail-panel .panel-action .btn-secondary {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            text-align: center;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .detail-panel .panel-action .btn-secondary:hover {
            background: var(--surface-hover);
            border-color: var(--lime-main);
            color: var(--lime-main);
        }

        /* ==========================================
           SETTINGS PANEL - کامل مثل بقیه صفحات
           ========================================== */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .settings-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .settings-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 400px;
            max-width: 92%;
            max-height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            padding: 0;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .settings-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .settings-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px 16px 24px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.02);
        }

        .settings-panel .panel-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }

        .settings-panel .panel-header h2 i {
            color: var(--lime-main);
            font-size: 1.2rem;
        }

        .settings-panel .close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-sub);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-panel .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: rotate(90deg);
        }

        .settings-content {
            padding: 8px 0 20px 0;
            overflow-y: auto;
            max-height: calc(85vh - 80px);
            scroll-behavior: smooth;
        }

        .settings-content::-webkit-scrollbar {
            width: 3px;
        }

        .settings-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .settings-content::-webkit-scrollbar-thumb {
            background: var(--lime-main);
            border-radius: 10px;
        }

        .settings-group {
            padding: 0 16px;
            margin-bottom: 4px;
        }

        .settings-group label {
            display: block;
            color: var(--text-sub);
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 12px 8px 6px 8px;
            opacity: 0.7;
        }

        .settings-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 2px;
            border: 1px solid transparent;
            position: relative;
        }

        .settings-option:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
        }

        .settings-option:active {
            transform: scale(0.98);
        }

        .settings-option .option-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .settings-option .option-left i {
            color: var(--lime-main);
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
            opacity: 0.9;
        }

        .settings-option .option-text {
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: -0.2px;
        }

        .settings-option .option-status {
            color: var(--lime-main);
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(204, 255, 0, 0.08);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .ios-toggle {
            width: 51px;
            height: 31px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            position: relative;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .light-mode .ios-toggle {
            background: #e5e5ea;
            border-color: #d1d1d6;
        }

        .ios-toggle.active {
            background: var(--lime-main);
            border-color: var(--lime-main);
        }

        .light-mode .ios-toggle.active {
            background: #4a7a4a;
            border-color: #4a7a4a;
        }

        .ios-toggle .toggle-knob {
            width: 27px;
            height: 27px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 1px;
            left: 1px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .ios-toggle.active .toggle-knob {
            left: 21px;
        }

        .settings-option .chevron {
            color: var(--text-sub);
            opacity: 0.4;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .settings-option:hover .chevron {
            opacity: 0.8;
        }

        .settings-divider {
            height: 1px;
            background: var(--glass-border);
            margin: 4px 20px;
        }

        .settings-footer {
            padding: 16px 24px 8px 24px;
            text-align: center;
            opacity: 0.4;
        }

        .settings-footer span {
            font-size: 0.65rem;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        /* ==========================================
           BOTTOM NAV - NORMAL (بدون RTL)
           ========================================== */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 15px;
            background: var(--nav-bg);
            padding: 12px 25px;
            border-radius: 50px;
            border: 1px solid var(--border);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 5px 30px var(--shadow-color);
            width: auto;
            min-width: 320px;
            max-width: 480px;
            transition: all 0.5s ease;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            text-decoration: none;
            color: var(--text-sub);
            font-size: 0.6rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px 10px;
            border-radius: 12px;
            position: relative;
        }

        .nav-item i {
            font-size: 1.3rem;
            transition: all 0.3s ease;
            color: var(--text-sub);
        }

        .nav-item span {
            font-size: 0.55rem;
            letter-spacing: 0.5px;
            opacity: 0.8;
        }

        .nav-item:hover {
            transform: translateY(-3px);
        }

        .nav-item:hover i {
            color: var(--lime-main);
            text-shadow: 0 0 15px var(--lime-shadow);
        }

        .nav-item.active {
            color: var(--lime-main);
        }

        .nav-item.active i {
            color: var(--lime-main);
            text-shadow: 0 0 20px var(--lime-shadow);
        }

        .nav-item.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: var(--lime-main);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--lime-shadow);
        }

        .nav-item .badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--lime-main);
            color: #0a0a0a;
            font-size: 0.5rem;
            font-weight: 700;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px var(--lime-shadow);
        }

        .light-mode .nav-item .badge {
            color: #ffffff;
            background: #4a7a4a;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 1200px) { .masonry { column-count: 4; } }
        @media (max-width: 992px) { .masonry { column-count: 3; } }
        @media (max-width: 768px) { 
            .masonry { column-count: 2; column-gap: 14px; } 
            main { padding: 20px 12px; }
            
            .nav-container {
                padding: 10px 15px;
                gap: 8px;
                min-width: auto;
                width: 92%;
                border-radius: 30px;
            }
            .nav-item { padding: 3px 6px; }
            .nav-item i { font-size: 1.1rem; }
            .nav-item span { font-size: 0.45rem; }
            .nav-item .badge { width: 14px; height: 14px; font-size: 0.4rem; top: -4px; right: -4px; }
            
            .detail-panel { max-width: 95%; }
            .detail-panel .panel-body { padding: 18px 20px 22px; }
            .coin-img { width: 28px; height: 28px; }
            .detail-panel .panel-price .coin-img { width: 42px; height: 42px; }
            .price { font-size: 1rem; }
            .detail-panel .panel-price .price { font-size: 1.3rem; }
            
            .card { min-height: auto !important; }
            .card-img { min-height: 160px; }

            .settings-panel { width: 94%; max-width: 94%; border-radius: 24px; }
            .settings-panel .panel-header { padding: 16px 18px 12px 18px; }
            .settings-panel .panel-header h2 { font-size: 1rem; }
            .settings-content { padding: 4px 0 16px 0; max-height: calc(85vh - 70px); }
            .settings-option { padding: 12px 14px; }
            .settings-option .option-text { font-size: 0.9rem; }
            .ios-toggle { width: 45px; height: 28px; }
            .ios-toggle .toggle-knob { width: 24px; height: 24px; }
            .ios-toggle.active .toggle-knob { left: 19px; }
        }

        @media (max-width: 480px) { 
            .masonry { column-count: 2; column-gap: 10px; } 
            .card-body { padding: 10px 12px 12px; }
            .nav-container { padding: 8px 10px; gap: 4px; }
            .nav-item i { font-size: 0.95rem; }
            .nav-item span { font-size: 0.4rem; }
            .coin-img { width: 24px; height: 24px; }
            .detail-panel .panel-price .coin-img { width: 36px; height: 36px; }
            .price { font-size: 0.9rem; }
            .detail-panel .panel-price .price { font-size: 1.1rem; }
            .overlay-title { font-size: 0.85rem; }
            .overlay-desc { font-size: 0.7rem; }
            .tag { font-size: 0.5rem; padding: 2px 8px; }
            .card-img { min-height: 120px; }
            .save-btn-card { width: 28px; height: 28px; font-size: 0.75rem; }
        }

        /* ==========================================
           SCROLLBAR
           ========================================== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-base); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        .light-mode ::-webkit-scrollbar-thumb { background: #bbb; }
        .light-mode ::-webkit-scrollbar-thumb:hover { background: #999; }

        /* ==========================================
           ANIMATIONS
           ========================================== */
        @keyframes fadeInUp {
            from { 
                opacity: 0; 
                transform: translateY(24px) scale(0.96); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        .card {
            animation: fadeInUp 0.5s ease backwards;
        }

        .card:nth-child(1) { animation-delay: 0.03s; }
        .card:nth-child(2) { animation-delay: 0.06s; }
        .card:nth-child(3) { animation-delay: 0.09s; }
        .card:nth-child(4) { animation-delay: 0.12s; }
        .card:nth-child(5) { animation-delay: 0.15s; }
        .card:nth-child(6) { animation-delay: 0.18s; }
        .card:nth-child(7) { animation-delay: 0.21s; }
        .card:nth-child(8) { animation-delay: 0.24s; }
        .card:nth-child(9) { animation-delay: 0.27s; }
        .card:nth-child(10) { animation-delay: 0.30s; }
        .card:nth-child(11) { animation-delay: 0.33s; }
        .card:nth-child(12) { animation-delay: 0.36s; }
    </style>
</head>
<body>

    <!-- ==========================================
    HEADER - Empty
    ========================================== -->
    <header></header>

    <!-- ==========================================
    SETTINGS OVERLAY
    ========================================== -->
    <div class="settings-overlay" id="settingsOverlay"></div>

    <!-- ==========================================
    SETTINGS PANEL - کامل
    ========================================== -->
    <div class="settings-panel" id="settingsPanel">
        <div class="panel-header">
            <h2><i class="fa-solid fa-gear"></i> <span>Settings</span></h2>
            <button class="close-btn" id="closeSettings"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="settings-content">
            <!-- Language -->
            <div class="settings-group">
                <label>🌐 Language</label>
                <div class="settings-option" id="langOption">
                    <div class="option-left">
                        <i class="fa-solid fa-language"></i>
                        <span class="option-text" id="langLabel">English</span>
                    </div>
                    <div class="option-status" id="langStatus">EN</div>
                </div>
            </div>
            <div class="settings-divider"></div>

            <!-- Appearance -->
            <div class="settings-group">
                <label>🎨 Appearance</label>
                <div class="settings-option" id="themeOption">
                    <div class="option-left">
                        <i class="fa-solid fa-moon" id="themeIconSettings"></i>
                        <span class="option-text" id="themeLabel">Dark</span>
                    </div>
                    <div class="ios-toggle" id="themeToggleSettings">
                        <div class="toggle-knob"></div>
                    </div>
                </div>
            </div>
            <div class="settings-divider"></div>

            <!-- Account -->
            <div class="settings-group">
                <label>👤 Account</label>
                <div class="settings-option" onclick="window.location.href='signup.html'">
                    <div class="option-left">
                        <i class="fa-solid fa-user-plus"></i>
                        <span class="option-text">Sign Up / Login</span>
                    </div>
                    <i class="fa-solid fa-chevron-left chevron"></i>
                </div>
            </div>
            <div class="settings-divider"></div>

            <!-- Support -->
            <div class="settings-group">
                <label>💬 Support</label>
                <div class="settings-option" onclick="window.location.href='conection.html'">
                    <div class="option-left">
                        <i class="fa-solid fa-headset"></i>
                        <span class="option-text">Contact Support</span>
                    </div>
                    <i class="fa-solid fa-chevron-left chevron"></i>
                </div>
            </div>
            <div class="settings-footer">
                <span>Version 2.0.0</span>
            </div>
        </div>
    </div>

    <!-- ==========================================
    MAIN
    ========================================== -->
    <main>
        <div class="masonry" id="masonryGrid">
            <!-- Cards will be populated by JavaScript -->
        </div>
    </main>

    <!-- ==========================================
    DETAIL PANEL (POPUP)
    ========================================== -->
    <div class="detail-overlay" id="detailOverlay">
        <div class="detail-panel" id="detailPanel">
            <div class="panel-img-wrap">
                <img class="panel-img" id="panelImg" src="" alt="">
                <button class="panel-close" id="panelClose"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="panel-body">
                <h2 class="panel-title" id="panelTitle">Title</h2>
                <p class="panel-desc" id="panelDesc">Description</p>
                <div class="panel-tags" id="panelTags"></div>
                <div class="panel-price">
                    <img class="coin-img" src="download.png" alt="Coin">
                    <span class="price" id="panelPrice">0</span>
                </div>
                <div class="panel-action">
                    <button class="btn-primary" id="buyBtn"><i class="fa-solid fa-coins"></i> Buy with Coins</button>
                    <button class="btn-secondary" id="saveBtn"><i class="fa-regular fa-bookmark"></i> <span id="saveText">Save</span></button>
                </div>
            </div>
        </div>
    </div>

    <!-- ==========================================
    BOTTOM NAV - NORMAL
    ========================================== -->
    <div class="bottom-nav">
        <div class="nav-container">
            <button class="nav-item" id="newsBtn" onclick="window.location.href='news.html'">
                <i class="fa-solid fa-newspaper"></i>
                <span>News</span>
            </button>
            <button class="nav-item" id="supportBtn" onclick="window.location.href='conection.html'">
                <i class="fa-solid fa-headset"></i>
                <span>Support</span>
            </button>
            <button class="nav-item active" id="homeBtn" onclick="window.location.href='index.html'">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </button>
            <button class="nav-item" id="signupNavBtn" onclick="window.location.href='signup.html'">
                <i class="fa-solid fa-user-plus"></i>
                <span>Sign Up</span>
                <span class="badge">+</span>
            </button>
            <button class="nav-item" id="settingsBtn">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </button>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. DATA
        // ============================================================
        const itemsData = [
            {
                id: 1,
                img: "mmm.png",
                title: "M416 Glacier",
                desc: "Changing your silver coin with m416. Limited edition skin with ice effect.",
                tags: ["Skin"],
                price: 10000
            },
            {
                id: 2,
                img: "qwe.png",
                title: "M416 Joker",
                desc: "Changing your silver coin with joker skin. The most wanted skin of 2025.",
                tags: ["Skin"],
                price: 45000
            },
            {
                id: 3,
                img: "shorkh.png",
                title: "PNC Jacket",
                desc: "Limited pubg item. PNC 2025 exclusive jacket.",
                tags: ["Wearable"],
                price: 2500
            },
            {
                id: 4,
                img: "trench.png",
                title: "Trench Coat",
                desc: "Limited pubg item. Classic trench coat style.",
                tags: ["Wearable"],
                price: 1800
            },
            {
                id: 5,
                img: "jampar zard.png",
                title: "Bright Idea Coat",
                desc: "Limited pubg item. Bright yellow coat for royal players.",
                tags: ["Wearable"],
                price: 2000
            },
            {
                id: 6,
                img: "victor.png",
                title: "Emerald Edge Victor",
                desc: "Change your silver with Victor. Emerald green edition.",
                tags: ["Skin"],
                price: 3500
            },
            {
                id: 7,
                img: "awm.png",
                title: "Season 42 AWM",
                desc: "Change your silver with AWM. Season 42 exclusive.",
                tags: ["Skin"],
                price: 800
            },
            {
                id: 8,
                img: "glove zard.png",
                title: "Bright Idea Gloves",
                desc: "Achieve Limited Items. Gloves with bright design.",
                tags: ["Wearable"],
                price: 1200
            },
            {
                id: 9,
                img: "jampar.png",
                title: "Stealth Mode Hoodie",
                desc: "Limited Pubg Item. Black stealth hoodie.",
                tags: ["Wearable"],
                price: 2500
            },
            {
                id: 10,
                img: "m24.png",
                title: "Wilham Putro",
                desc: "Exchange your silver with M24. White edition.",
                tags: ["Skin"],
                price: 3000
            },
            {
                id: 11,
                img: "m762.png",
                title: "Beryl M762",
                desc: "Exchange your silvers with M762. Red Beryl skin.",
                tags: ["Skin"],
                price: 3000
            },
            {
                id: 12,
                img: "Sks.png",
                title: "Steel Show SKS",
                desc: "Limited edition skin. Steel Show series.",
                tags: ["Skin"],
                price: 3000
            }
        ];

        // ============================================================
        // 2. DOM REFS
        // ============================================================
        const masonryGrid = document.getElementById('masonryGrid');
        const overlay = document.getElementById('detailOverlay');
        const panelImg = document.getElementById('panelImg');
        const panelTitle = document.getElementById('panelTitle');
        const panelDesc = document.getElementById('panelDesc');
        const panelTags = document.getElementById('panelTags');
        const panelPrice = document.getElementById('panelPrice');
        const panelClose = document.getElementById('panelClose');
        const buyBtn = document.getElementById('buyBtn');
        const saveBtn = document.getElementById('saveBtn');
        const saveText = document.getElementById('saveText');

        // ============================================================
        // 3. RENDER CARDS
        // ============================================================
        function renderCards() {
            masonryGrid.innerHTML = '';
            itemsData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${0.03 + index * 0.03}s`;
                card.dataset.index = index;
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img class="card-img" src="${item.img}" alt="${item.title}" loading="lazy">
                        <div class="card-overlay">
                            <div class="overlay-title">${item.title}</div>
                            <div class="overlay-desc">${item.desc}</div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="card-tags">
                            ${item.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                        </div>
                        <div class="card-footer">
                            <div class="price-box">
                                <img class="coin-img" src="download.png" alt="Coin">
                                <span class="price">${item.price.toLocaleString()}</span>
                            </div>
                            <button class="save-btn-card" data-id="${item.id}" title="Save">
                                <i class="fa-regular fa-bookmark"></i>
                            </button>
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', (e) => {
                    if (e.target.closest('.save-btn-card')) return;
                    openDetail(item);
                });
                
                const saveCardBtn = card.querySelector('.save-btn-card');
                saveCardBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const icon = saveCardBtn.querySelector('i');
                    icon.classList.toggle('fa-regular');
                    icon.classList.toggle('fa-solid');
                    icon.classList.toggle('fa-bookmark');
                    icon.classList.toggle('fa-check');
                    saveCardBtn.classList.toggle('saved');
                });
                
                masonryGrid.appendChild(card);
            });
        }

        // ============================================================
        // 4. DETAIL PANEL
        // ============================================================
        let currentDetailItem = null;

        function openDetail(item) {
            currentDetailItem = item;
            updateDetailPanel(item);
            overlay.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function updateDetailPanel(item) {
            panelImg.src = item.img;
            panelImg.alt = item.title;
            panelTitle.textContent = item.title;
            panelDesc.textContent = item.desc;
            panelTags.innerHTML = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
            panelPrice.textContent = item.price.toLocaleString();
        }

        function closeDetail() {
            overlay.classList.remove('open');
            document.body.style.overflow = '';
            currentDetailItem = null;
        }

        panelClose.addEventListener('click', closeDetail);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeDetail();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeDetail();
        });

        // ============================================================
        // 5. BUY BUTTON
        // ============================================================
        buyBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (!currentDetailItem) return;
            const itemName = currentDetailItem.title;
            const itemPrice = currentDetailItem.price;
            const url = 'sendme.html?item=' + encodeURIComponent(itemName) + '&price=' + itemPrice;
            window.location.href = url;
        });

        // ============================================================
        // 6. SAVE BUTTON IN DETAIL
        // ============================================================
        saveBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const icon = saveBtn.querySelector('i');
            icon.classList.toggle('fa-regular');
            icon.classList.toggle('fa-solid');
            icon.classList.toggle('fa-bookmark');
            icon.classList.toggle('fa-check');
        });

        // ============================================================
        // 7. THEME TOGGLE
        // ============================================================
        const themeToggleSettings = document.getElementById('themeToggleSettings');
        const themeIconSettings = document.getElementById('themeIconSettings');
        const themeLabel = document.getElementById('themeLabel');

        function updateThemeUI(isLight) {
            if (isLight) {
                document.body.classList.add('light-mode');
                themeToggleSettings.classList.add('active');
                themeIconSettings.className = 'fa-solid fa-sun';
                themeIconSettings.style.color = '#f5a623';
                themeLabel.textContent = 'Light';
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                themeToggleSettings.classList.remove('active');
                themeIconSettings.className = 'fa-solid fa-moon';
                themeIconSettings.style.color = '';
                themeLabel.textContent = 'Dark';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'light') {
            updateThemeUI(true);
        } else {
            updateThemeUI(false);
        }

        document.getElementById('themeOption').addEventListener('click', function() {
            const isLight = document.body.classList.contains('light-mode');
            updateThemeUI(!isLight);
        });

        // ============================================================
        // 8. LANGUAGE
        // ============================================================
        const langOption = document.getElementById('langOption');
        const langLabel = document.getElementById('langLabel');
        const langStatus = document.getElementById('langStatus');

        langLabel.textContent = 'English';
        langStatus.textContent = 'EN';
        document.documentElement.lang = 'en';
        document.documentElement.dir = 'ltr';

        langOption.style.cursor = 'default';
        langOption.addEventListener('click', function(e) {
            e.stopPropagation();
            langStatus.textContent = 'EN ✓';
            setTimeout(function() { 
                langStatus.textContent = 'EN'; 
            }, 800);
        });

        // ============================================================
        // 9. SETTINGS PANEL
        // ============================================================
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const settingsBtn = document.getElementById('settingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettings');

        function openSettings() {
            settingsPanel.classList.add('open');
            settingsOverlay.classList.add('visible');
            document.body.style.overflow = 'hidden';
        }

        function closeSettings() {
            settingsPanel.classList.remove('open');
            settingsOverlay.classList.remove('visible');
            document.body.style.overflow = '';
        }

        settingsBtn.addEventListener('click', openSettings);
        closeSettingsBtn.addEventListener('click', closeSettings);
        settingsOverlay.addEventListener('click', closeSettings);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && settingsPanel.classList.contains('open')) {
                closeSettings();
            }
        });

        // ============================================================
        // 10. INIT
        // ============================================================
        renderCards();
    </script>

</body>
</html>
