<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشتیبانی و ارتباط با ما - گیمینگ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="nav.css">
    <style>
        /* ==========================================
           متغیرهای رنگی (حالت شب / روز)
           ========================================== */
        :root {
            --bg-base: #0d0f14;
            --bg-radial: #1a1f2b;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --card-bg: #1a1f2b;
            --card-border: #2a3040;
            --pill-bg: rgba(26, 31, 43, 0.95);
            --accent-pink: #ff0055;
            --accent-green: #00ff88;
            --green-shadow: rgba(0, 255, 136, 0.4);
            --shadow-color: rgba(0, 0, 0, 0.35);
            --twitter-color: #ffffff;
            --twitter-bg: #1a1a1a;
            --twitter-neon: rgba(255, 255, 255, 0.6);
            
            --facebook-color: #1877f2;
            --facebook-neon: rgba(24, 119, 242, 0.6);
            
            --tiktok-color: #ff0050;
            --tiktok-neon: rgba(255, 0, 80, 0.6);
            
            --google-color: #ea4335;
            --google-neon: rgba(234, 67, 53, 0.6);

            --nav-bg: rgba(10, 10, 10, 0.92);
            --lime-main: #ccff00;
            --lime-shadow: rgba(204, 255, 0, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            --glass-blur: 30px;
            --img-bg: radial-gradient(circle at center, #1a1a0a, #0a0a00);
            --img-filter: brightness(1.1) saturate(1.2);
            --img-opacity: 0.95;
            --glass-card-bg: rgba(255, 255, 255, 0.08);
            --glass-card-border: rgba(255, 255, 255, 0.15);
            --glass-card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glass-card-blur: 20px;
        }

        .light-mode {
            --bg-base: #f5f7fa;
            --bg-radial: #eef1f5;
            --text-main: #2d3748;
            --text-sub: #4a5568;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --pill-bg: rgba(255, 255, 255, 0.95);
            --shadow-color: rgba(0, 0, 0, 0.08);
            --accent-green: #38a89d;
            --green-shadow: rgba(56, 168, 157, 0.25);
            --twitter-color: #1a1a1a;
            --twitter-bg: #e8e8e8;
            --twitter-neon: rgba(26, 26, 26, 0.4);
            
            --facebook-neon: rgba(24, 119, 242, 0.3);
            --tiktok-neon: rgba(255, 0, 80, 0.3);
            --google-neon: rgba(234, 67, 53, 0.3);

            --nav-bg: rgba(255, 255, 255, 0.92);
            --lime-main: #4a7a4a;
            --lime-shadow: rgba(74, 122, 74, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 25px 60px rgba(0, 0, 0, 0.08);
            --glass-blur: 20px;
            --img-bg: linear-gradient(135deg, #f0f4f0, #ffffff);
            --img-filter: brightness(1) saturate(1);
            --img-opacity: 1;
            --glass-card-bg: rgba(255, 255, 255, 0.7);
            --glass-card-border: rgba(255, 255, 255, 0.4);
            --glass-card-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 10% 10%, var(--bg-radial) 0%, var(--bg-base) 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 90px;
            position: relative;
            transition: background-color 0.5s ease, color 0.5s ease, background-image 0.5s ease;
        }

        /* ==========================================
           بخش اصلی
           ========================================== */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .train-container {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 480px;
        }

        /* ریل عمودی نوری */
        .train-container::before {
            content: '';
            position: absolute;
            top: 25px;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            background: var(--accent-green);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent-green), 0 0 20px var(--accent-green), 0 0 35px var(--accent-green);
            z-index: 0;
            transition: all 0.5s ease;
        }

        .light-mode .train-container::before {
            background: #cbd5e0;
            box-shadow: none;
            width: 2px;
        }

        /* کارت‌ها */
        .island-card {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 14px 20px;
            box-shadow: 0 8px 25px var(--shadow-color);
            transition: all 0.3s ease;
            animation: floatIsland 4s ease-in-out infinite;
            cursor: pointer;
        }

        .island-card:nth-child(1) { animation-delay: 0s; }
        .island-card:nth-child(2) { animation-delay: 0.3s; }
        .island-card:nth-child(3) { animation-delay: 0.6s; }
        .island-card:nth-child(4) { animation-delay: 0.9s; }

        @keyframes floatIsland {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .island-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: var(--accent-green);
            box-shadow: 0 12px 35px var(--green-shadow);
        }

        .light-mode .island-card:hover {
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            border-color: var(--accent-green);
        }

        .island-content {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        /* ==========================================
           باکس آیکون با نوار نئونی
           ========================================== */
        .icon-box {
            width: 50px;
            height: 50px;
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            flex-shrink: 0;
            position: relative;
        }

        .light-mode .icon-box {
            background: #f7fafc;
        }

        .island-card:hover .icon-box {
            border-color: var(--accent-green);
            box-shadow: 0 0 20px var(--green-shadow);
        }

        /* ==========================================
           نوار نئونی دور هر آیکون
           ========================================== */
        .icon-box::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 16px;
            z-index: -1;
            opacity: 0;
            transition: all 0.4s ease;
        }

        .island-card:hover .icon-box::before {
            opacity: 1;
        }

        /* فیس بوک - نوار نئونی آبی */
        .island-card.facebook .icon-box::before {
            background: var(--facebook-neon);
            filter: blur(8px);
            box-shadow: 0 0 30px var(--facebook-neon);
        }
        .island-card.facebook:hover .icon-box {
            border-color: var(--facebook-color);
            box-shadow: 0 0 25px var(--facebook-neon);
        }
        .island-card.facebook .icon-box { color: var(--facebook-color); }
        .island-card.facebook:hover .icon-box { background: var(--facebook-color); color: #ffffff; border-color: var(--facebook-color); }
        .island-card.facebook:hover h3 { color: var(--facebook-color); }

        /* توییتر - نوار نئونی سفید/مشکی */
        .island-card.x-twitter .icon-box::before {
            background: var(--twitter-neon);
            filter: blur(8px);
            box-shadow: 0 0 30px var(--twitter-neon);
        }
        .island-card.x-twitter:hover .icon-box {
            border-color: var(--twitter-color);
            box-shadow: 0 0 25px var(--twitter-neon);
        }
        .island-card.x-twitter .icon-box { 
            color: var(--twitter-color);
            background: var(--twitter-bg);
            border-color: var(--twitter-color);
        }
        .island-card.x-twitter:hover .icon-box { 
            background: var(--twitter-color); 
            color: var(--bg-base); 
            border-color: var(--twitter-color);
        }
        .island-card.x-twitter:hover h3 { color: var(--twitter-color); }

        /* تیک تاک - نوار نئونی صورتی */
        .island-card.tiktok .icon-box::before {
            background: var(--tiktok-neon);
            filter: blur(8px);
            box-shadow: 0 0 30px var(--tiktok-neon);
        }
        .island-card.tiktok:hover .icon-box {
            border-color: var(--tiktok-color);
            box-shadow: 0 0 25px var(--tiktok-neon);
        }
        .island-card.tiktok .icon-box { color: var(--tiktok-color); }
        .island-card.tiktok:hover .icon-box { background: var(--tiktok-color); color: #ffffff; border-color: var(--tiktok-color); }
        .island-card.tiktok:hover h3 { color: var(--tiktok-color); }

        /* گوگل - نوار نئونی قرمز */
        .island-card.google .icon-box::before {
            background: var(--google-neon);
            filter: blur(8px);
            box-shadow: 0 0 30px var(--google-neon);
        }
        .island-card.google:hover .icon-box {
            border-color: var(--google-color);
            box-shadow: 0 0 25px var(--google-neon);
        }
        .island-card.google .icon-box { color: var(--google-color); }
        .island-card.google:hover .icon-box { background: var(--google-color); color: #ffffff; border-color: var(--google-color); }
        .island-card.google:hover h3 { color: var(--google-color); }

        /* ==========================================
           اطلاعات کارت
           ========================================== */
        .island-info h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 2px;
            color: var(--text-main);
            transition: color 0.3s ease;
        }

        .island-info p {
            font-size: 0.78rem;
            color: var(--text-sub);
            transition: color 0.3s ease;
        }

        .arrow-icon {
            font-size: 0.9rem;
            color: var(--text-sub);
            transition: all 0.3s ease;
        }

        .island-card:hover .arrow-icon {
            transform: translateX(-6px);
            color: var(--accent-green);
        }

        /* ==========================================
           SETTINGS PANEL - کامل
           ========================================== */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .settings-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .settings-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 400px;
            max-width: 92%;
            max-height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            padding: 0;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .settings-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .settings-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px 16px 24px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.02);
        }

        .settings-panel .panel-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }

        .settings-panel .panel-header h2 i {
            color: var(--lime-main);
            font-size: 1.2rem;
        }

        .settings-panel .close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-sub);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-panel .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: rotate(90deg);
        }

        .settings-content {
            padding: 8px 0 20px 0;
            overflow-y: auto;
            max-height: calc(85vh - 80px);
            scroll-behavior: smooth;
        }

        .settings-content::-webkit-scrollbar {
            width: 3px;
        }

        .settings-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .settings-content::-webkit-scrollbar-thumb {
            background: var(--lime-main);
            border-radius: 10px;
        }

        .settings-group {
            padding: 0 16px;
            margin-bottom: 4px;
        }

        .settings-group label {
            display: block;
            color: var(--text-sub);
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 12px 8px 6px 8px;
            opacity: 0.7;
        }

        .settings-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 2px;
            border: 1px solid transparent;
            position: relative;
        }

        .settings-option:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
        }

        .settings-option:active {
            transform: scale(0.98);
        }

        .settings-option .option-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .settings-option .option-left i {
            color: var(--lime-main);
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
            opacity: 0.9;
        }

        .settings-option .option-text {
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: -0.2px;
        }

        .settings-option .option-status {
            color: var(--lime-main);
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(204, 255, 0, 0.08);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .ios-toggle {
            width: 51px;
            height: 31px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            position: relative;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        .light-mode .ios-toggle {
            background: #e5e5ea;
            border-color: #d1d1d6;
        }

        .ios-toggle.active {
            background: var(--lime-main);
            border-color: var(--lime-main);
        }

        .light-mode .ios-toggle.active {
            background: #4a7a4a;
            border-color: #4a7a4a;
        }

        .ios-toggle .toggle-knob {
            width: 27px;
            height: 27px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 1px;
            left: 1px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .ios-toggle.active .toggle-knob {
            left: 21px;
        }

        .settings-option .chevron {
            color: var(--text-sub);
            opacity: 0.4;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .settings-option:hover .chevron {
            opacity: 0.8;
        }

        .settings-divider {
            height: 1px;
            background: var(--glass-border);
            margin: 4px 20px;
        }

        .settings-footer {
            padding: 16px 24px 8px 24px;
            text-align: center;
            opacity: 0.4;
        }

        .settings-footer span {
            font-size: 0.65rem;
            color: var(--text-sub);
            letter-spacing: 0.5px;
        }

        /* ==========================================
           واکنش‌گرایی
           ========================================== */
        @media (max-width: 500px) {
            .train-container { max-width: 100%; }
            .island-card { padding: 12px 14px; border-radius: 14px; }
            .icon-box { width: 42px; height: 42px; font-size: 1.3rem; }
            .island-info h3 { font-size: 0.9rem; }
            .island-info p { font-size: 0.7rem; }

            .settings-panel { width: 94%; max-width: 94%; border-radius: 24px; }
            .settings-panel .panel-header { padding: 16px 18px 12px 18px; }
            .settings-panel .panel-header h2 { font-size: 1rem; }
            .settings-content { padding: 4px 0 16px 0; max-height: calc(85vh - 70px); }
            .settings-option { padding: 12px 14px; }
            .settings-option .option-text { font-size: 0.9rem; }
            .ios-toggle { width: 45px; height: 28px; }
            .ios-toggle .toggle-knob { width: 24px; height: 24px; }
            .ios-toggle.active .toggle-knob { left: 19px; }
        }

        @media (max-width: 380px) {
            .icon-box { width: 36px; height: 36px; font-size: 1.1rem; }
            .island-card { padding: 10px 10px; }
            .island-info h3 { font-size: 0.8rem; }
            .island-info p { font-size: 0.6rem; }
        }
    </style>
</head>
<body>

    <!-- ==========================================
    SETTINGS OVERLAY
    ========================================== -->
    <div class="settings-overlay" id="settingsOverlay"></div>

    <!-- ==========================================
    SETTINGS PANEL - کامل
    ========================================== -->
    <div class="settings-panel" id="settingsPanel">
        <div class="panel-header">
            <h2><i class="fa-solid fa-gear"></i> <span>Settings</span></h2>
            <button class="close-btn" id="closeSettings"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="settings-content">
            <!-- Language -->
            <div class="settings-group">
                <label>🌐 Language</label>
                <div class="settings-option" id="langOption">
                    <div class="option-left">
                        <i class="fa-solid fa-language"></i>
                        <span class="option-text" id="langLabelSettings">English</span>
                    </div>
                    <div class="option-status" id="langStatus">EN</div>
                </div>
            </div>
            <div class="settings-divider"></div>

            <!-- Appearance -->
            <div class="settings-group">
                <label>🎨 Appearance</label>
                <div class="settings-option" id="themeOption">
                    <div class="option-left">
                        <i class="fa-solid fa-moon" id="themeIconSettings"></i>
                        <span class="option-text" id="themeLabel">Dark</span>
                    </div>
                    <div class="ios-toggle" id="themeToggleSettings">
                        <div class="toggle-knob"></div>
                    </div>
                </div>
            </div>
            <div class="settings-divider"></div>

            <!-- Account -->
            <div class="settings-group">
                <label>👤 Account</label>
                <div class="settings-option" onclick="window.location.href='signup.html'">
                    <div class="option-left">
                        <i class="fa-solid fa-user-plus"></i>
                        <span class="option-text">Sign Up / Login</span>
                    </div>
                    <i class="fa-solid fa-chevron-left chevron"></i>
                </div>
            </div>
            <div class="settings-divider"></div>

            <!-- Support -->
            <div class="settings-group">
                <label>💬 Support</label>
                <div class="settings-option" onclick="window.location.href='conection.html'">
                    <div class="option-left">
                        <i class="fa-solid fa-headset"></i>
                        <span class="option-text">Contact Support</span>
                    </div>
                    <i class="fa-solid fa-chevron-left chevron"></i>
                </div>
            </div>
            <div class="settings-footer">
                <span>Version 2.0.0</span>
            </div>
        </div>
    </div>

    <!-- ==========================================
    محتوای اصلی
    ========================================== -->
    <main>
        <div class="train-container">

            <div class="island-card facebook" data-page="facebook.html">
                <div class="island-content">
                    <div class="icon-box">
                        <i class="fa-brands fa-facebook-f"></i>
                    </div>
                    <div class="island-info">
                        <h3 data-i18n="facebookTitle">Facebook</h3>
                        <p data-i18n="facebookDesc">ورود از طریق فیس بوک</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </div>

            <div class="island-card x-twitter" data-page="X.com.html">
                <div class="island-content">
                    <div class="icon-box">
                        <i class="fa-brands fa-x-twitter"></i>
                    </div>
                    <div class="island-info">
                        <h3 data-i18n="twitterTitle">X.com</h3>
                        <p data-i18n="twitterDesc">ورود از طریق اکس</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </div>

            <div class="island-card tiktok" data-page="tiktok.html">
                <div class="island-content">
                    <div class="icon-box">
                        <i class="fa-brands fa-tiktok"></i>
                    </div>
                    <div class="island-info">
                        <h3 data-i18n="tiktokTitle">Tiktok</h3>
                        <p data-i18n="tiktokDesc">ورود از طریق تیک تاک</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </div>

            <div class="island-card google" data-page="google.html">
                <div class="island-content">
                    <div class="icon-box">
                        <i class="fa-brands fa-google"></i>
                    </div>
                    <div class="island-info">
                        <h3 data-i18n="googleTitle">Google</h3>
                        <p data-i18n="googleDesc">ورود از طریق گوگل</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left arrow-icon"></i>
            </div>

        </div>
    </main>

    <!-- ==========================================
    BOTTOM NAV - با کامپوننت shared
    ========================================== -->
    <div id="bottom-nav-placeholder"></div>
    <script src="nav.js"></script>

    <script>
        // ==========================================
        // ترجمه‌ها
        // ==========================================
        var translations = {
            fa: {
                'facebookTitle': 'Facebook',
                'facebookDesc': 'ورود از طریق فیس بوک',
                'twitterTitle': 'X.com',
                'twitterDesc': 'ورود از طریق اکس',
                'tiktokTitle': 'Tiktok',
                'tiktokDesc': 'ورود از طریق تیک تاک',
                'googleTitle': 'Google',
                'googleDesc': 'ورود از طریق گوگل'
            },
            en: {
                'facebookTitle': 'Facebook',
                'facebookDesc': 'Login via Facebook',
                'twitterTitle': 'X.com',
                'twitterDesc': 'Login via X',
                'tiktokTitle': 'Tiktok',
                'tiktokDesc': 'Login via TikTok',
                'googleTitle': 'Google',
                'googleDesc': 'Login via Google'
            }
        };

        var currentLang = localStorage.getItem('lang') || 'fa';

        // ==========================================
        // توابع ترجمه
        // ==========================================
        function changeLanguage(lang) {
            currentLang = lang;
            var t = translations[lang];
            
            document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            localStorage.setItem('lang', lang);
            
            var elements = document.querySelectorAll('[data-i18n]');
            for (var i = 0; i < elements.length; i++) {
                var el = elements[i];
                var key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) {
                    var icon = el.querySelector('i');
                    if (icon) {
                        var textNode = el.childNodes[el.childNodes.length - 1];
                        if (textNode && textNode.nodeType === 3) {
                            textNode.textContent = ' ' + t[key];
                        } else {
                            el.innerHTML = icon.outerHTML + ' ' + t[key];
                        }
                    } else {
                        el.textContent = t[key];
                    }
                }
            }
        }

        changeLanguage(currentLang);

        // ==========================================
        // تغییر مسیر کارت‌ها
        // ==========================================
        var cards = document.querySelectorAll('.island-card');
        for (var i = 0; i < cards.length; i++) {
            cards[i].addEventListener('click', function() {
                var page = this.getAttribute('data-page');
                if (page) {
                    window.location.href = page;
                }
            });
        }

        // ==========================================
        // SETTINGS PANEL
        // ==========================================
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const settingsBtn = document.getElementById('settingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettings');

        function openSettings() {
            settingsPanel.classList.add('open');
            settingsOverlay.classList.add('visible');
            document.body.style.overflow = 'hidden';
        }

        function closeSettings() {
            settingsPanel.classList.remove('open');
            settingsOverlay.classList.remove('visible');
            document.body.style.overflow = '';
        }

        if (settingsBtn) {
            settingsBtn.addEventListener('click', openSettings);
        }
        closeSettingsBtn.addEventListener('click', closeSettings);
        settingsOverlay.addEventListener('click', closeSettings);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && settingsPanel.classList.contains('open')) {
                closeSettings();
            }
        });

        // ==========================================
        // THEME TOGGLE در پنل تنظیمات
        // ==========================================
        const themeToggleSettings = document.getElementById('themeToggleSettings');
        const themeIconSettings = document.getElementById('themeIconSettings');
        const themeLabel = document.getElementById('themeLabel');

        function updateThemeUI(isLight) {
            if (isLight) {
                document.body.classList.add('light-mode');
                themeToggleSettings.classList.add('active');
                themeIconSettings.className = 'fa-solid fa-sun';
                themeIconSettings.style.color = '#f5a623';
                themeLabel.textContent = 'Light';
                localStorage.setItem('theme', 'light');
            } else {
                document.body.classList.remove('light-mode');
                themeToggleSettings.classList.remove('active');
                themeIconSettings.className = 'fa-solid fa-moon';
                themeIconSettings.style.color = '';
                themeLabel.textContent = 'Dark';
                localStorage.setItem('theme', 'dark');
            }
        }

        if (localStorage.getItem('theme') === 'light') {
            updateThemeUI(true);
        } else {
            updateThemeUI(false);
        }

        document.getElementById('themeOption').addEventListener('click', function() {
            const isLight = document.body.classList.contains('light-mode');
            updateThemeUI(!isLight);
        });

        // ==========================================
        // LANGUAGE در پنل تنظیمات
        // ==========================================
        const langOption = document.getElementById('langOption');
        const langLabelSettings = document.getElementById('langLabelSettings');
        const langStatus = document.getElementById('langStatus');

        langLabelSettings.textContent = currentLang === 'fa' ? 'فارسی' : 'English';
        langStatus.textContent = currentLang === 'fa' ? 'FA' : 'EN';

        langOption.style.cursor = 'default';
        langOption.addEventListener('click', function(e) {
            e.stopPropagation();
            var newLang = currentLang === 'fa' ? 'en' : 'fa';
            changeLanguage(newLang);
            langLabelSettings.textContent = newLang === 'fa' ? 'فارسی' : 'English';
            langStatus.textContent = newLang === 'fa' ? 'FA ✓' : 'EN ✓';
            setTimeout(function() { 
                langStatus.textContent = newLang === 'fa' ? 'FA' : 'EN'; 
            }, 800);
        });
    </script>

</body>
</html>
