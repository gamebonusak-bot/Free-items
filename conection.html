<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support & Contact - Gaming</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="nav.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');

        :root {
            --bg: #0f0f12;
            --surface: #18181f;
            --surface-hover: #22222e;
            --border: rgba(255,255,255,0.06);
            --text: #f0f0f5;
            --text-muted: #8b8b9e;
            --text-sub: #b8b8a0;
            --accent: #e11d48;
            --accent-glow: rgba(225, 29, 72, 0.4);
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.3);
            --radius: 16px;
            --radius-sm: 12px;
            --nav-bg: rgba(10, 10, 10, 0.92);
            --pill-bg: rgba(24, 24, 31, 0.95);
            --card-border: #2a3040;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --lime-main: #ccff00;
            --lime-shadow: rgba(204, 255, 0, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            --glass-blur: 30px;
            --img-bg: radial-gradient(circle at center, #1a1a0a, #0a0a00);
            --img-filter: brightness(1.1) saturate(1.2);
            --img-opacity: 0.95;
            --glass-card-bg: rgba(255, 255, 255, 0.08);
            --glass-card-border: rgba(255, 255, 255, 0.15);
            --glass-card-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glass-card-blur: 20px;
        }

        [data-theme="light"] {
            --bg: #f0f0f5;
            --surface: #ffffff;
            --surface-hover: #e8e8ee;
            --border: rgba(0,0,0,0.08);
            --text: #1a1a1e;
            --text-muted: #6b6b7e;
            --text-sub: #4a4a4a;
            --nav-bg: rgba(255, 255, 255, 0.92);
            --pill-bg: rgba(255, 255, 255, 0.95);
            --card-border: #e2ded3;
            --shadow-color: rgba(0, 0, 0, 0.06);
            --lime-main: #4a7a4a;
            --lime-shadow: rgba(74, 122, 74, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 25px 60px rgba(0, 0, 0, 0.08);
            --glass-blur: 20px;
            --img-bg: linear-gradient(135deg, #f0f4f0, #ffffff);
            --img-filter: brightness(1) saturate(1);
            --img-opacity: 1;
            --glass-card-bg: rgba(255, 255, 255, 0.7);
            --glass-card-border: rgba(255, 255, 255, 0.4);
            --glass-card-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Vazirmatn', 'Segoe UI', sans-serif;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 120px;
            line-height: 1.6;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* ==========================================
           HEADER - خالی
           ========================================== */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 15, 18, 0.75);
            backdrop-filter: blur(20px) saturate(1.8);
            -webkit-backdrop-filter: blur(20px) saturate(1.8);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            transition: background 0.4s ease;
        }

        [data-theme="light"] header {
            background: rgba(240, 240, 245, 0.75);
        }

        /* ==========================================
           MAIN
           ========================================== */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--green);
            font-size: 1.4rem;
            font-weight: 900;
            margin-bottom: 32px;
            text-shadow: 0 0 20px var(--green-glow);
        }

        .page-title i {
            font-size: 1.8rem;
        }

        /* ==========================================
           TRAIN CONTAINER
           ========================================== */
        .train-container {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 22px;
            width: 100%;
            max-width: 480px;
        }

        .train-container::before {
            content: '';
            position: absolute;
            top: 25px;
            bottom: 25px;
            right: 42px;
            width: 3px;
            background: linear-gradient(180deg, #10b981, #3b82f6, #8b5cf6, #f59e0b, #ef4444);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5);
            z-index: 1;
            border-radius: 10px;
        }

        /* ==========================================
           ISLAND CARDS
           ========================================== */
        .island-card {
            position: relative;
            z-index: 2;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            animation: floatIsland 4s ease-in-out infinite;
        }

        .island-card:nth-child(1) { animation-delay: 0s; }
        .island-card:nth-child(2) { animation-delay: 0.3s; }
        .island-card:nth-child(3) { animation-delay: 0.6s; }
        .island-card:nth-child(4) { animation-delay: 0.9s; }

        @keyframes floatIsland {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .island-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: var(--green);
            box-shadow: 0 16px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(16, 185, 129, 0.15);
        }

        [data-theme="light"] .island-card:hover {
            box-shadow: 0 16px 40px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.04);
        }

        .island-content {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon-box {
            width: 48px;
            height: 48px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.4s ease;
            flex-shrink: 0;
        }

        .island-card:hover .icon-box {
            background: var(--green);
            color: var(--bg);
            border-color: var(--green);
            box-shadow: 0 0 25px var(--green-glow);
            transform: rotate(-8deg) scale(1.05);
        }

        .island-info h3 {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 2px;
            color: var(--text);
            transition: color 0.3s ease;
        }

        .island-card:hover .island-info h3 {
            color: var(--green);
        }

        .island-info p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .arrow-icon {
            font-size: 1rem;
            color: var(--text-muted);
            transition: all 0.3s ease;
        }

        .island-card:hover .arrow-icon {
            transform: translateX(-6px);
            color: var(--green);
        }

        /* رنگ‌های اختصاصی */
        .island-card.whatsapp:hover .icon-box {
            background: #25d366;
            border-color: #25d366;
            box-shadow: 0 0 30px rgba(37, 211, 102, 0.5);
        }
        .island-card.whatsapp .icon-box { color: #25d366; }

        .island-card.telegram:hover .icon-box {
            background: #0088cc;
            border-color: #0088cc;
            box-shadow: 0 0 30px rgba(0, 136, 204, 0.5);
        }
        .island-card.telegram .icon-box { color: #0088cc; }

        .island-card.github:hover .icon-box {
            background: #6e5494;
            border-color: #6e5494;
            box-shadow: 0 0 30px rgba(110, 84, 148, 0.5);
        }
        .island-card.github .icon-box { color: #6e5494; }

        .island-card.email:hover .icon-box {
            background: #ea4335;
            border-color: #ea4335;
            box-shadow: 0 0 30px rgba(234, 67, 53, 0.5);
        }
        .island-card.email .icon-box { color: #ea4335; }

        .island-card.whatsapp:hover .island-info h3 { color: #25d366; }
        .island-card.telegram:hover .island-info h3 { color: #0088cc; }
        .island-card.github:hover .island-info h3 { color: #6e5494; }
        .island-card.email:hover .island-info h3 { color: #ea4335; }

        /* ==========================================
           SETTINGS PANEL - کامل با گزینه Language
           ========================================== */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .settings-overlay.visible {
            opacity: 1;
            visibility: visible;
        }

        .settings-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            width: 400px;
            max-width: 92%;
            max-height: 85vh;
            background: var(--glass-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            padding: 0;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .settings-panel.open {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .settings-panel .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px 16px 24px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.02);
        }

        .settings-panel .panel-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.3px;
        }

        .settings-panel .panel-header h2 i {
            color: var(--lime-main);
            font-size: 1.2rem;
        }

        .settings-panel .close-btn {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 8px;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .settings-panel .close-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: rotate(90deg);
        }

        .settings-content {
            padding: 8px 0 20px 0;
            overflow-y: auto;
            max-height: calc(85vh - 80px);
            scroll-behavior: smooth;
        }

        .settings-content::-webkit-scrollbar {
            width: 3px;
        }

        .settings-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .settings-content::-webkit-scrollbar-thumb {
            background: var(--lime-main);
            border-radius: 10px;
        }

        .settings-group {
            padding: 0 16px;
            margin-bottom: 4px;
        }

        .settings-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            padding: 12px 8px 6px 8px;
            opacity: 0.7;
        }

        .settings-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-bottom: 2px;
            border: 1px solid transparent;
            position: relative;
        }

        .settings-option:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--glass-border);
        }

        .settings-option:active {
            transform: scale(0.98);
        }

        .settings-option .option-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .settings-option .option-left i {
            color: var(--lime-main);
            font-size: 1.1rem;
            width: 24px;
            text-align: center;
            opacity: 0.9;
        }

        .settings-option .option-text {
            color: var(--text);
            font-weight: 500;
            font-size: 0.95rem;
            letter-spacing: -0.2px;
        }

        .settings-option .option-status {
            color: var(--lime-main);
            font-size: 0.8rem;
            font-weight: 600;
            background: rgba(204, 255, 0, 0.08);
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .ios-toggle {
            width: 51px;
            height: 31px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            position: relative;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        [data-theme="light"] .ios-toggle {
            background: #e5e5ea;
            border-color: #d1d1d6;
        }

        .ios-toggle.active {
            background: var(--lime-main);
            border-color: var(--lime-main);
        }

        [data-theme="light"] .ios-toggle.active {
            background: #4a7a4a;
            border-color: #4a7a4a;
        }

        .ios-toggle .toggle-knob {
            width: 27px;
            height: 27px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 1px;
            left: 1px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .ios-toggle.active .toggle-knob {
            left: 21px;
        }

        .settings-option .chevron {
            color: var(--text-muted);
            opacity: 0.4;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .settings-option:hover .chevron {
            opacity: 0.8;
        }

        .settings-divider {
            height: 1px;
            background: var(--glass-border);
            margin: 4px 20px;
        }

        .settings-footer {
            padding: 16px 24px 8px 24px;
            text-align: center;
            opacity: 0.4;
        }

        .settings-footer span {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* ==========================================
           RESPONSIVE
           ========================================== */
        @media (max-width: 600px) {
            header { padding: 12px 16px; }

            .page-title { font-size: 1.1rem; }
            .page-title i { font-size: 1.4rem; }
            
            .train-container { max-width: 100%; padding: 0 4px; }
            .train-container::before { right: 34px; }
            
            .island-card { padding: 14px 16px; }
            .icon-box { width: 40px; height: 40px; font-size: 1.2rem; }
            .island-info h3 { font-size: 0.95rem; }
            .island-info p { font-size: 0.7rem; }

            .settings-panel { width: 94%; max-width: 94%; border-radius: 24px; }
            .settings-panel .panel-header { padding: 16px 18px 12px 18px; }
            .settings-panel .panel-header h2 { font-size: 1rem; }
            .settings-content { padding: 4px 0 16px 0; max-height: calc(85vh - 70px); }
            .settings-option { padding: 12px 14px; }
            .settings-option .option-text { font-size: 0.9rem; }
            .ios-toggle { width: 45px; height: 28px; }
            .ios-toggle .toggle-knob { width: 24px; height: 24px; }
            .ios-toggle.active .toggle-knob { left: 19px; }
        }

        @media (max-width: 380px) {
            .train-container::before { right: 28px; }
            .icon-box { width: 34px; height: 34px; font-size: 1rem; }
            .island-card { padding: 10px 12px; }
            .island-info h3 { font-size: 0.85rem; }
            .island-info p { font-size: 0.65rem; }
        }

        /* ==========================================
           SCROLLBAR
           ========================================== */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        [data-theme="light"] ::-webkit-scrollbar-thumb { background: #bbb; }
        [data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: #999; }
    </style>
</head>
<body>

    <!-- ===== HEADER (خالی) ===== -->
    <header></header>

    <!-- ===== SETTINGS OVERLAY ===== -->
    <div class="settings-overlay" id="settingsOverlay"></div>

    <!-- ===== GLASS SETTINGS PANEL (کامل با Language) ===== -->

    <div id="bottom-nav-placeholder"></div>

    <script>
        // ============================================================
        // 1. THEME TOGGLE
        // ============================================================
        const themeToggleSettings = document.getElementById('themeToggleSettings');
        const themeIconSettings = document.getElementById('themeIconSettings');
        const themeLabel = document.getElementById('themeLabel');

        function updateThemeUI(isLight) {
            if (isLight) {
                document.documentElement.setAttribute('data-theme', 'light');
                themeIconSettings.className = 'fa-solid fa-sun';
                themeIconSettings.style.color = '#f5a623';
                themeLabel.textContent = 'Light';
                themeToggleSettings.classList.add('active');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIconSettings.className = 'fa-solid fa-moon';
                themeIconSettings.style.color = '';
                themeLabel.textContent = 'Dark';
                themeToggleSettings.classList.remove('active');
                localStorage.setItem('theme', 'dark');
            }
        }

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            updateThemeUI(true);
        } else {
            updateThemeUI(false);
        }

        document.getElementById('themeOption').addEventListener('click', () => {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            updateThemeUI(!isLight);
        });

        // ============================================================
        // 2. LANGUAGE (مثل صفحه هوم)
        // ============================================================
        const langOption = document.getElementById('langOption');
        const langLabel = document.getElementById('langLabel');
        const langStatus = document.getElementById('langStatus');

        langLabel.textContent = 'English';
        langStatus.textContent = 'EN';
        document.documentElement.lang = 'en';
        document.documentElement.dir = 'ltr';

        langOption.style.cursor = 'default';
        langOption.addEventListener('click', (e) => {
            e.stopPropagation();
            langStatus.textContent = 'EN ✓';
            setTimeout(() => { langStatus.textContent = 'EN'; }, 800);
        });

        // ============================================================
        // 3. SETTINGS PANEL
        // ============================================================
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsOverlay = document.getElementById('settingsOverlay');
        const settingsBtn = document.getElementById('settingsBtn');
        const closeSettingsBtn = document.getElementById('closeSettings');

        function openSettings() {
            settingsPanel.classList.add('open');
            settingsOverlay.classList.add('visible');
            document.body.style.overflow = 'hidden';
        }

        function closeSettings() {
            settingsPanel.classList.remove('open');
            settingsOverlay.classList.remove('visible');
            document.body.style.overflow = '';
        }

        settingsBtn.addEventListener('click', openSettings);
        closeSettingsBtn.addEventListener('click', closeSettings);
        settingsOverlay.addEventListener('click', closeSettings);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && settingsPanel.classList.contains('open')) {
                closeSettings();
            }
        });
    </script>

</body>
</html>
