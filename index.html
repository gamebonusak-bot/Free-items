<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تبدیل آیتم‌های بازی</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ===== ROOT ===== */
        :root {
            --bg-base: #0d0f14;
            --bg-radial: #1a1f2b;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --card-bg: #1a1f2b;
            --card-border: #2a3040;
            --pill-bg: rgba(26, 31, 43, 0.95);
            --accent-pink: #ff0055;
            --accent-green: #00ff88;
            --shadow-color: rgba(0, 0, 0, 0.35);
            --green-main: #00ff88;
            --green-shadow: rgba(0, 255, 136, 0.4);
            --img-bg: radial-gradient(circle at center, #1a1a2e, #0a0a0a);
            --img-filter: brightness(1.1) saturate(1.1) drop-shadow(0 0 10px rgba(0, 255, 136, 0.1));
            --img-opacity: 0.95;
            --img-scale: 1;
        }

        .light-mode {
            --bg-base: #f5f7fa;
            --bg-radial: #eef1f5;
            --text-main: #2d3748;
            --text-sub: #4a5568;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --pill-bg: rgba(255, 255, 255, 0.95);
            --shadow-color: rgba(0, 0, 0, 0.08);
            --green-main: #38a89d;
            --green-shadow: rgba(56, 168, 157, 0.25);
            --img-bg: linear-gradient(135deg, #f0f4f8, #ffffff);
            --img-filter: brightness(1) saturate(1) drop-shadow(0 2px 8px rgba(0, 0, 0, 0.06));
            --img-opacity: 1;
            --img-scale: 0.92;
        }

        /* ===== RESET & BASE ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 10% 10%, var(--bg-radial) 0%, var(--bg-base) 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 90px;
            position: relative;
            transition: background-color 0.5s ease, color 0.5s ease, background-image 0.5s ease;
        }

        /* ===== HEADER ===== */
        header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .icon-btn:hover {
            transform: translateY(-2px);
            border-color: var(--green-main);
            box-shadow: 0 0 12px var(--green-shadow);
        }

        .membership-btn {
            width: auto;
            padding: 0 18px;
            border-radius: 21px;
            font-weight: 700;
            font-size: 0.85rem;
            background: linear-gradient(135deg, var(--accent-pink), #ff5588);
            border: none;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.35);
            transition: all 0.3s ease;
        }

        .light-mode .membership-btn {
            background: linear-gradient(135deg, #e53e6b, #ed6a8e);
            box-shadow: 0 0 15px rgba(229, 62, 107, 0.2);
        }

        .membership-btn:hover {
            box-shadow: 0 0 22px rgba(255, 0, 85, 0.55);
        }

        .lang-btn {
            width: auto;
            padding: 0 14px;
            border-radius: 21px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .logo-container {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            padding: 3px;
            background: var(--card-bg);
            border: 2px solid var(--accent-pink);
            box-shadow: 0 0 20px var(--accent-pink), inset 0 0 20px var(--accent-pink);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .light-mode .logo-container {
            border-color: #e53e6b;
            box-shadow: 0 0 20px rgba(229, 62, 107, 0.15), inset 0 0 20px rgba(229, 62, 107, 0.05);
        }

        .logo-container:hover {
            transform: scale(1.08);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* ===== MAIN ===== */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px 20px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 28px;
            padding: 0 20px;
        }

        .page-header h1 {
            color: var(--green-main);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--green-shadow);
            margin-bottom: 6px;
            transition: all 0.5s ease;
        }

        .light-mode .page-header h1 {
            text-shadow: 0 0 10px rgba(56, 168, 157, 0.15);
            font-weight: 600;
        }

        .page-header p {
            color: var(--text-sub);
            font-size: 0.85rem;
            transition: color 0.5s ease;
        }

        /* ===== CARDS ===== */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 480px;
            position: relative;
        }

        .cards-container::before {
            content: '';
            position: absolute;
            top: 50px;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            background: var(--green-main);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--green-main), 0 0 20px var(--green-main), 0 0 35px var(--green-main);
            z-index: 0;
            transition: all 0.5s ease;
        }

        .light-mode .cards-container::before {
            background: #cbd5e0;
            box-shadow: none;
            width: 2px;
        }

        .card {
            display: flex;
            text-decoration: none;
            color: inherit;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            height: 100px;
            align-items: center;
            overflow: hidden;
            position: relative;
            z-index: 1;
            box-shadow: 0 8px 25px var(--shadow-color);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--green-main);
            box-shadow: 0 12px 35px var(--green-shadow);
        }

        .light-mode .card:hover {
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
            border-color: var(--green-main);
        }

        .card-img-wrapper {
            width: 140px;
            height: 100%;
            flex-shrink: 0;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-left: 2px solid var(--green-main);
            transition: all 0.5s ease;
            background: var(--img-bg);
        }

        .light-mode .card-img-wrapper {
            border-left: 2px solid #e2e8f0;
            background: linear-gradient(135deg, #f7fafc, #edf2f7);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.02);
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            padding: 12px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            filter: var(--img-filter);
            opacity: var(--img-opacity);
            transform: scale(var(--img-scale));
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.08);
            filter: brightness(1.2) saturate(1.1);
        }

        .light-mode .card:hover .card-img-wrapper img {
            transform: scale(1.05);
            filter: brightness(1.05) saturate(1.05);
        }

        .card-body {
            flex: 1;
            padding: 0 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 5px;
            transition: color 0.5s ease;
        }

        .light-mode .card-title {
            font-weight: 700;
        }

        .card-title i {
            margin-left: 6px;
            color: var(--green-main);
            font-size: 1.3rem;
            width: 1.6rem;
            text-align: center;
        }

        .card-desc {
            font-size: 0.9rem;
            color: var(--text-sub);
            font-weight: 500;
            transition: color 0.5s ease;
        }

        .card-action {
            margin-top: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--green-main);
            transition: all 0.3s ease;
        }

        .light-mode .card-action {
            font-weight: 600;
            color: #38a89d;
        }

        /* ===== BOTTOM NAV ===== */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .ps-shapes {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            background: var(--pill-bg);
            padding: 14px 35px;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px var(--shadow-color);
            width: auto;
            transition: all 0.5s ease;
        }

        .light-mode .ps-shapes {
            background: rgba(255, 255, 255, 0.9);
            border-color: #e2e8f0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .ps-shapes i {
            font-size: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .ps-shapes .ps-cross { color: #5352ed; text-shadow: 0 0 15px rgba(83, 82, 237, 0.7); }
        .ps-shapes .ps-circle { color: #ff4757; text-shadow: 0 0 15px rgba(255, 71, 87, 0.7); }
        .ps-shapes .ps-triangle { color: #00f0ff; text-shadow: 0 0 15px rgba(0, 240, 255, 0.7); }
        .ps-shapes .ps-square { color: #ff77a9; text-shadow: 0 0 15px rgba(255, 119, 169, 0.7); }

        .light-mode .ps-shapes .ps-cross { color: #6c63c4; text-shadow: 0 0 15px rgba(108, 99, 196, 0.2); }
        .light-mode .ps-shapes .ps-circle { color: #e53e6b; text-shadow: 0 0 15px rgba(229, 62, 107, 0.2); }
        .light-mode .ps-shapes .ps-triangle { color: #38b2ac; text-shadow: 0 0 15px rgba(56, 178, 172, 0.2); }
        .light-mode .ps-shapes .ps-square { color: #b779c4; text-shadow: 0 0 15px rgba(183, 121, 196, 0.2); }

        .ps-shapes i:hover {
            transform: scale(1.3) rotate(10deg);
            filter: brightness(1.5);
        }

        .light-mode .ps-shapes i:hover {
            filter: brightness(1.2);
        }

        /* ===== FAB ===== */
        .fab-support {
            position: fixed;
            bottom: 90px;
            right: 25px;
            left: auto;
            z-index: 1000;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--green-main), #00cc88);
            border: 2px solid var(--green-main);
            color: #ffffff;
            font-size: 1.8rem;
            cursor: pointer;
            box-shadow: 0 0 25px var(--green-shadow), 0 8px 30px var(--shadow-color);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: floatFAB 3s ease-in-out infinite;
        }

        .light-mode .fab-support {
            background: linear-gradient(135deg, #38a89d, #4fc3b7);
            border-color: #38a89d;
            box-shadow: 0 0 20px rgba(56, 168, 157, 0.2), 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .fab-support:hover {
            transform: scale(1.15) translateY(-5px);
            box-shadow: 0 0 40px var(--green-shadow), 0 12px 40px var(--shadow-color);
            background: var(--green-main);
            border-color: #ffffff;
        }

        .light-mode .fab-support:hover {
            background: #38a89d;
            border-color: #ffffff;
            box-shadow: 0 0 30px rgba(56, 168, 157, 0.35), 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .fab-support:active {
            transform: scale(0.95);
        }

        .fab-support::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--green-main);
            animation: rippleFAB 2s ease-out infinite;
            pointer-events: none;
        }

        .light-mode .fab-support::after {
            border-color: #38a89d;
        }

        @keyframes rippleFAB {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        @keyframes floatFAB {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            header { padding: 14px 15px; }
            .logo-container { width: 52px; height: 52px; }
            .icon-btn { width: 38px; height: 38px; font-size: 0.9rem; }
            .lang-btn { padding: 0 10px; font-size: 0.75rem; }
            .membership-btn { padding: 0 12px; font-size: 0.75rem; }
            .header-actions { gap: 6px; }

            .card { height: 85px; border-radius: 15px; }
            .cards-container::before { top: 42px; bottom: 42px; }
            .card-img-wrapper { width: 110px; }
            .card-img-wrapper img { padding: 8px; }
            .card-body { padding: 0 15px; }
            .card-title { font-size: 1.1rem; }
            .card-desc { font-size: 0.8rem; }

            .bottom-nav { bottom: 12px; }
            .ps-shapes { padding: 12px 25px; gap: 20px; }
            .ps-shapes i { font-size: 1.2rem; }

            .fab-support {
                bottom: 80px;
                right: 16px;
                left: auto;
                width: 50px;
                height: 50px;
                font-size: 1.4rem;
            }
        }

        @media (max-width: 380px) {
            .card-img-wrapper { width: 90px; }
            .card-img-wrapper img { padding: 6px; }
            .card-title { font-size: 0.95rem; }
            .card-title i { font-size: 1rem; width: 1.3rem; }
            .card-desc { font-size: 0.7rem; }
            .card-body { padding: 0 10px; }
            .ps-shapes { gap: 14px; padding: 10px 16px; }
            .ps-shapes i { font-size: 1rem; }
            .fab-support {
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
                bottom: 75px;
                right: 12px;
                left: auto;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="logo-container">
            <img src="op.jpg.png" alt="Logo">
        </div>
        <div class="header-actions">
            <button class="icon-btn" id="themeToggle" type="button">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="icon-btn lang-btn" id="langToggle" type="button">
                <span id="langLabel">FA</span>
            </button>
            <button class="icon-btn membership-btn" id="membershipBtn" type="button">
                <span id="membershipLabel">عضویت</span>
            </button>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main>
        <div class="page-header">
            <h1 data-i18n="pageTitle"><i class="fa-solid fa-gamepad"></i> Game item converter</h1>
            <p data-i18n="pageSubtitle"><i class="fa-solid fa-globe"></i> Global Content</p>
        </div>

        <div class="cards-container">
            <!-- کارت ۱: PUBG -->
            <a href="pubg.html" class="card">
                <div class="card-img-wrapper">
                    <img src="beetter.png" alt="PUBG">
                </div>
                <div class="card-body">
                    <h3 class="card-title" data-i18n="card1Title">PUBG</h3>
                    <p class="card-desc" data-i18n="card1Desc">تبدیل آیتم‌های پابجی به یکدیگر</p>
                    <span class="card-action" data-i18n="card1Action">تبدیل و دریافت ←</span>
                </div>
            </a>

            <!-- کارت ۲: Clash of Clans -->
            <a href="clash.html" class="card">
                <div class="card-img-wrapper">
                    <img src="coc.png" alt="Clash of Clans">
                </div>
                <div class="card-body">
                    <h3 class="card-title" data-i18n="card2Title">Clash of Clans</h3>
                    <p class="card-desc" data-i18n="card2Desc">تبدیل آیتم‌های کلش اف کلنز به یکدیگر</p>
                    <span class="card-action" data-i18n="card2Action">تبدیل و دریافت ←</span>
                </div>
            </a>
        </div>
    </main>

    <!-- ===== BOTTOM NAV ===== -->
    <div class="bottom-nav">
        <div class="ps-shapes">
            <i class="fa-solid fa-xmark ps-cross"></i>
            <i class="fa-regular fa-circle ps-circle"></i>
            <i class="fa-solid fa-triangle-exclamation ps-triangle"></i>
            <i class="fa-regular fa-square ps-square"></i>
        </div>
    </div>

    <!-- ===== FAB SUPPORT ===== -->
    <button class="fab-support" title="پشتیبانی" id="supportBtn" onclick="window.location.href='conection.html'">
        <i class="fa-solid fa-headset"></i>
    </button>

    <!-- ===== SCRIPT ===== -->
    <script>
        const translations = {
            fa: {
                'langLabel': 'FA',
                'membershipLabel': 'عضویت',
                'pageTitle': 'Game item converter',
                'pageSubtitle': 'Global Content',
                'card1Title': 'PUBG',
                'card1Desc': 'تبدیل آیتم‌های پابجی به یکدیگر',
                'card1Action': 'تبدیل و دریافت ←',
                'card2Title': 'Clash of Clans',
                'card2Desc': 'تبدیل آیتم‌های کلش اف کلنز به یکدیگر',
                'card2Action': 'تبدیل و دریافت ←',
                'supportTitle': 'پشتیبانی'
            },
            en: {
                'langLabel': 'EN',
                'membershipLabel': 'Sign up',
                'pageTitle': 'Game item converter',
                'pageSubtitle': 'Global Content',
                'card1Title': 'PUBG',
                'card1Desc': 'Convert PUBG items to each other',
                'card1Action': 'Convert & Receive ←',
                'card2Title': 'Clash of Clans',
                'card2Desc': 'Convert Clash of Clans items to each other',
                'card2Action': 'Convert & Receive ←',
                'supportTitle': 'Support'
            }
        };

        let currentLang = localStorage.getItem('lang') || 'fa';

        function changeLanguage(lang) {
            currentLang = lang;
            const t = translations[lang];
            
            document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            localStorage.setItem('lang', lang);
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) {
                    const icon = el.querySelector('i');
                    if (icon) {
                        const textNode = el.childNodes[el.childNodes.length - 1];
                        if (textNode && textNode.nodeType === 3) {
                            textNode.textContent = ' ' + t[key];
                        } else {
                            el.innerHTML = icon.outerHTML + ' ' + t[key];
                        }
                    } else {
                        el.textContent = t[key];
                    }
                }
            });
            
            document.getElementById('langLabel').textContent = t['langLabel'];
            document.getElementById('membershipLabel').textContent = t['membershipLabel'];
            document.getElementById('supportBtn').title = t['supportTitle'];
        }

        changeLanguage(currentLang);

        document.getElementById('langToggle').addEventListener('click', () => {
            const newLang = currentLang === 'fa' ? 'en' : 'fa';
            changeLanguage(newLang);
        });

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeIcon.className = isLight ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        });

        document.getElementById('membershipBtn').addEventListener('click', () => {
            window.location.href = 'signup.html';
        });
    </script>

</body>
</html>
