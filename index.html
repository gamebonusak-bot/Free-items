<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Connect Gaming</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ==========================================
           متغیرهای رنگی (حالت شب / روز)
           ========================================== */
        :root {
            --bg-base: #0d0f14;
            --bg-radial: #1a1f2b;
            --text-main: #ffffff;
            --text-sub: #a0aec0;
            --card-bg: #1a1f2b;
            --card-border: #2a3040;
            --pill-bg: rgba(26, 31, 43, 0.95);
            --accent-pink: #ff0055;
            --accent-green: #00ff88;
        }

        body.light-mode {
            --bg-base: #f4f1ea;
            --bg-radial: #ffffff;
            --text-main: #14161c;
            --text-sub: #5a6172;
            --card-bg: #ffffff;
            --card-border: #e2ded3;
            --pill-bg: rgba(255, 255, 255, 0.95);
            --accent-pink: #e2005f;
            --accent-green: #00b368;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 10% 10%, var(--bg-radial) 0%, var(--bg-base) 100%);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-bottom: 90px;
            position: relative;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ==========================================
           هدر: دکمه‌های عضویت / زبان / شب‌وروز + لوگو
           ========================================== */
        header {
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        .icon-btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent-green);
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.35);
        }

        .lang-btn {
            width: auto;
            padding: 0 14px;
            border-radius: 21px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .membership-btn {
            width: auto;
            padding: 0 18px;
            border-radius: 21px;
            font-weight: 700;
            font-size: 0.85rem;
            background: linear-gradient(135deg, var(--accent-pink), #ff5588);
            border: none;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.35);
        }

        .membership-btn:hover {
            box-shadow: 0 0 22px rgba(255, 0, 85, 0.55);
        }

        .logo-container {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            padding: 3px;
            background: var(--card-bg);
            border: 2px solid var(--accent-pink);
            box-shadow: 0 0 20px var(--accent-pink), inset 0 0 20px var(--accent-pink);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .logo-container:hover {
            transform: scale(1.08);
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* ==========================================
           بخش محتوای اصلی (کارت‌ها)
           ========================================== */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px 20px;
        }

        .page-title {
            color: var(--accent-green);
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
        }

        .page-subtitle {
            color: var(--text-sub);
            font-size: 0.85rem;
            margin-bottom: 28px;
            text-align: center;
        }

        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 480px;
            position: relative;
        }

        .cards-container::before {
            content: '';
            position: absolute;
            top: 50px;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            background: var(--accent-green);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent-green), 0 0 20px var(--accent-green), 0 0 35px var(--accent-green);
            z-index: 0;
        }

        .card {
            display: flex;
            text-decoration: none;
            color: inherit;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            height: 100px;
            align-items: center;
            overflow: hidden;
            position: relative;
            z-index: 1;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: var(--accent-green);
            box-shadow: 0 12px 35px rgba(0, 255, 136, 0.2);
        }

        .card-img-wrapper {
            width: 140px;
            height: 100%;
            flex-shrink: 0;
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-left: 2px solid var(--accent-green);
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0.9;
            transition: opacity 0.3s, transform 0.3s;
        }

        .card:hover .card-img-wrapper img {
            opacity: 1;
            transform: scale(1.05);
        }

        .card-content {
            flex: 1;
            padding: 0 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        .card-content h3 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .card-content p {
            font-size: 0.9rem;
            color: var(--text-sub);
            font-weight: 500;
        }

        .card-content .price-tag {
            margin-top: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--accent-green);
        }

        /* ==========================================
           نوار پایین با آیکون‌های نئونی (پلی‌استیشن)
           ========================================== */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .ps-shapes {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 30px;
            background: var(--pill-bg);
            padding: 14px 35px;
            border-radius: 50px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
            width: auto;
        }

        .ps-shapes i {
            font-size: 1.5rem;
            transition: transform 0.3s ease, filter 0.3s ease;
            cursor: pointer;
        }

        .ps-shapes .ps-cross { color: #5352ed; text-shadow: 0 0 15px rgba(83, 82, 237, 0.7); }
        .ps-shapes .ps-circle { color: #ff4757; text-shadow: 0 0 15px rgba(255, 71, 87, 0.7); }
        .ps-shapes .ps-triangle { color: #00f0ff; text-shadow: 0 0 15px rgba(0, 240, 255, 0.7); }
        .ps-shapes .ps-square { color: #ff77a9; text-shadow: 0 0 15px rgba(255, 119, 169, 0.7); }

        .ps-shapes i:hover {
            transform: scale(1.3) rotate(10deg);
            filter: brightness(1.5);
        }

        /* ==========================================
           واکنش‌گرایی
           ========================================== */
        @media (max-width: 500px) {
            header { padding: 14px 15px; }
            .logo-container { width: 52px; height: 52px; }
            .icon-btn { width: 38px; height: 38px; font-size: 0.9rem; }
            .lang-btn { padding: 0 10px; font-size: 0.75rem; }
            .membership-btn { padding: 0 12px; font-size: 0.75rem; }
            .header-actions { gap: 6px; }

            .card { height: 85px; border-radius: 15px; }
            .cards-container::before { top: 42px; bottom: 42px; }
            .card-img-wrapper { width: 110px; }
            .card-content { padding: 0 15px; }
            .card-content h3 { font-size: 1.1rem; }
            .card-content p { font-size: 0.8rem; }

            .ps-shapes { padding: 12px 25px; gap: 20px; }
            .ps-shapes i { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="op.jpg" alt="Logo">
        </div>

        <div class="header-actions">
            <button class="icon-btn" id="themeToggle" type="button" aria-label="تغییر حالت شب و روز" title="حالت شب/روز">
                <i class="fa-solid fa-moon"></i>
            </button>
            <button class="icon-btn lang-btn" id="langToggle" type="button" aria-label="تغییر زبان" title="زبان">
                <span id="langLabel">FA</span>
            </button>
            <button class="icon-btn membership-btn" id="membershipBtn" type="button">
                <span id="membershipLabel">عضویت</span>
            </button>
        </div>
    </header>

    <main>
        <h2 class="page-title" id="pageTitle">GLOBAL CONNECT</h2>
        <p class="page-subtitle" id="pageSubtitle">فروش گیفت‌کارت و یوسی بازی‌های محبوب</p>

        <div class="cards-container">

            <!-- کارت PUBG -->
            <a href="pubg.html" class="card">
                <div class="card-img-wrapper">
                    <img src="pubg logo.jpg" alt="PUBG">
                </div>
                <div class="card-content">
                    <h3 class="card-title" data-fa=" پابجی موبایل" data-en="PUBG Mobile"> پابجی موبایل</h3>
                    <p class="card-desc" data-fa="دریافت مستقیم و آنی" data-en="Instant direct ">دریافت مستقیم و آنی</p>
                    <span class="price-tag" data-fa="مشاهده جوایز" data-en="View Rewards">مشاهده جوایز</span>
                </div>
            </a>

            <!-- کارت Clash of Clans -->
            <a href="clash.html" class="card">
                <div class="card-img-wrapper">
                    <img src="yyy.jpg" alt="Clash of Clans">
                </div>
                <div class="card-content">
                    <h3 class="card-title" data-fa="کلش اف کلنز" data-en="Clash of Clans">کلش اف کلنز</h3>
                    <p class="card-desc" data-fa="دریافت مستقیم و آنی" data-en="Instant direct ">دریافت مستقیم و آنی</p>
                    <span class="price-tag" data-fa="مشاهده جوایز" data-en="View Rewards">مشاهده جوایز</span>
                </div>
            </a>

        </div>
    </main>

    <div class="bottom-nav">
    <div class="ps-shapes">
        <a href="email asking.html">
            <i class="fa-solid fa-xmark ps-cross"></i>
        </a>
        <i class="fa-regular fa-circle ps-circle"></i>
        <i class="fa-solid fa-triangle-exclamation ps-triangle"></i>
        <i class="fa-regular fa-square ps-square"></i>
    </div>
</div>

    <script>
        // حالت شب / روز
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeIcon.classList.toggle('fa-moon', !isLight);
            themeIcon.classList.toggle('fa-sun', isLight);
        });

        // تغییر زبان (فارسی / انگلیسی)
        const langToggle = document.getElementById('langToggle');
        const langLabel = document.getElementById('langLabel');
        const pageTitle = document.getElementById('pageTitle');
        const pageSubtitle = document.getElementById('pageSubtitle');
        const membershipLabel = document.getElementById('membershipLabel');
        let currentLang = 'fa';

        const textMap = {
            fa: {
                subtitle: 'فروش گیفت‌کارت و یوسی بازی‌های محبوب',
                membership: 'عضویت',
                dir: 'rtl'
            },
            en: {
                subtitle: 'Gift cards & in-game currency, delivered instantly',
                membership: 'Sign up',
                dir: 'ltr'
            }
        };

        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'fa' ? 'en' : 'fa';
            langLabel.textContent = currentLang === 'fa' ? 'FA' : 'EN';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = textMap[currentLang].dir;

            pageSubtitle.textContent = textMap[currentLang].subtitle;
            membershipLabel.textContent = textMap[currentLang].membership;

            document.querySelectorAll('.card-title, .card-desc, .price-tag').forEach(el => {
                el.textContent = el.getAttribute('data-' + currentLang);
            });
        });

        // دکمه عضویت (اتصال به صفحه واقعی ثبت‌نام)
        document.getElementById('membershipBtn').addEventListener('click', () => {
            window.location.href = 'signup.html';
        });
    </script>

</body>
</html>
